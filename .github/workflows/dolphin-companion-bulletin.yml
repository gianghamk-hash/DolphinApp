name: Dolphin companion bulletin
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/companion-feed/**', '.github/workflows/dolphin-companion-bulletin.yml']
  pull_request:
    paths: ['scripts/companion-feed/**', '.github/workflows/dolphin-companion-bulletin.yml']
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix scripts/companion-feed --no-audit --no-fund
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: node scripts/companion-feed/refresh.mjs brief.json
        env:
          FACEBOOK_VN_PAGE_IDS: ${{ vars.FACEBOOK_VN_PAGE_IDS }}
          FACEBOOK_VN_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.FACEBOOK_VN_ACCESS_TOKEN || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-bulletin
          path: brief.json
          retention-days: 1
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: dolphin-companion-bulletin-publish
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dolphin-bulletin
      - uses: actions/github-script@v7
        with:
          script: |
            const branch='companion-bulletin', repo=context.repo;
            try { await github.rest.git.getRef({...repo,ref:'heads/'+branch}); }
            catch(e){
              if(e.status!==404)throw e;
              await github.rest.git.createRef({...repo,ref:'refs/heads/'+branch,sha:context.sha});
            }
            let sha;
            try { sha=(await github.rest.repos.getContent({...repo,path:'brief.json',ref:branch})).data.sha; }
            catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({...repo,branch,path:'brief.json',sha,
              message:'Refresh public companion topics and Ha Long forecast',
              content:require('node:fs').readFileSync('brief.json').toString('base64')});
