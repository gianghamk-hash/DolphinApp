<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#123634">
<title>Dolphin Ha Long Cruise</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:#123634;color:#fff;font-family:'Nunito',sans-serif}

/* ==================== BRAND ==================== */
.brand-title{font-family:'Fraunces',serif;font-weight:900;letter-spacing:.28em;
  background:linear-gradient(180deg,#FBD77A 0%,#F4B842 45%,#D99A2B 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 4px 24px rgba(244,184,66,.65));
  font-size:clamp(2.2rem,9vw,4.5rem);line-height:1;margin:0;padding-left:.28em}
.brand-sub{letter-spacing:.55em;font-size:clamp(.55rem,1.7vw,.85rem);color:#bfe9dc;
  font-weight:800;text-transform:uppercase;margin-top:.6rem;padding-left:.55em}

/* ==================== WELCOME ==================== */
.welcome-lbl{text-align:center;font-size:clamp(.8rem,1.7vw,1.05rem);font-weight:800;
  color:#e6f7f2;margin:0 0 clamp(1.25rem,3vw,2rem);text-shadow:0 2px 10px rgba(0,0,0,.7);
  letter-spacing:.02em;line-height:1.5}
.welcome-lbl .wlc-vi{display:block;color:#FBD77A}
.welcome-lbl .wlc-en{display:block;font-size:.85em;color:#bfe9dc;font-weight:700;margin-top:.35em;letter-spacing:.08em}

/* ==================== AREA CARDS ==================== */
.area-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(.75rem,2vw,1.25rem)}
@media(min-width:900px){.area-grid{grid-template-columns:repeat(4,1fr)}}

.area-card{position:relative;background:rgba(25,71,67,.55);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  border:1px solid rgba(244,184,66,.25);border-radius:22px;
  padding:1.8rem 1rem 1.5rem;text-align:center;cursor:pointer;
  transition:all .45s cubic-bezier(.16,1,.3,1);overflow:hidden;isolation:isolate;
  font-family:'Nunito',sans-serif;color:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;width:100%;min-height:190px;gap:.4rem;
  -webkit-appearance:none;appearance:none;outline:none}
.area-card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(135deg,rgba(244,184,66,.55),transparent 45%,rgba(244,184,66,.35));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.75;transition:opacity .4s}
.area-card:hover{transform:translateY(-8px) scale(1.03);border-color:rgba(244,184,66,.85)}
.area-card:hover::before{opacity:1}
.area-card:hover .area-icon{transform:scale(1.2) rotate(-8deg)}
.area-card:hover .area-title-en{color:#FBD77A;text-shadow:0 0 20px rgba(244,184,66,.7)}
.area-card:active{transform:translateY(-2px) scale(.99)}
.area-icon{font-size:clamp(2.6rem,6vw,3.6rem);line-height:1;display:block;margin-bottom:.85rem;
  transition:transform .5s cubic-bezier(.16,1,.3,1);filter:drop-shadow(0 8px 16px rgba(0,0,0,.5))}
.area-title-en{font-weight:900;font-size:clamp(.85rem,1.9vw,1.1rem);letter-spacing:.06em;
  text-transform:uppercase;color:#fff;margin:0;transition:all .3s;line-height:1.15}
.area-title-vi{font-weight:700;font-size:clamp(.7rem,1.5vw,.9rem);color:#bfe9dc;
  margin:0;letter-spacing:.04em;opacity:.9;font-style:italic}
.area-badge{position:absolute;top:.75rem;right:.85rem;
  background:linear-gradient(135deg,#FBD77A,#D99A2B);color:#123634;
  font-size:.55rem;font-weight:900;letter-spacing:.12em;
  padding:3px 8px;border-radius:99px;text-transform:uppercase;box-shadow:0 3px 10px rgba(244,184,66,.5)}

/* ==================== ENHANCED SCENE ==================== */
.sun-halo-2{animation:sun-pulse-2 7s ease-in-out infinite;transform-origin:center}
@keyframes sun-pulse-2{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.5;transform:scale(1.08)}}
.wave-anim path{filter:drop-shadow(0 2px 4px rgba(255,255,255,.3))}
.particle{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,#FFF8C2 0%,rgba(251,215,122,0) 70%);
  animation:particle-float linear infinite;will-change:transform,opacity}
@keyframes particle-float{
  0%{transform:translateY(0) scale(0);opacity:0}
  15%{opacity:.9;transform:translateY(-20px) scale(1)}
  85%{opacity:.7}
  100%{transform:translateY(-100vh) scale(.4);opacity:0}
}
.area-card:hover{
  box-shadow:0 28px 56px -16px rgba(0,0,0,.7),
             0 0 60px -8px rgba(244,184,66,.7),
             inset 0 0 30px rgba(244,184,66,.15)!important;
}
.area-card:hover .area-icon{
  filter:drop-shadow(0 8px 16px rgba(0,0,0,.5)) drop-shadow(0 0 20px rgba(244,184,66,.9));
}
#landing::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
  background:transparent;transition:background 3s ease-out}
#landing.time-morning::before{background:linear-gradient(180deg,rgba(255,180,100,.15) 0%,transparent 60%)}
#landing.time-day::before{background:transparent}
#landing.time-evening::before{background:linear-gradient(180deg,rgba(255,120,60,.2) 0%,transparent 60%)}
#landing.time-night::before{background:linear-gradient(180deg,rgba(10,20,60,.4) 0%,rgba(10,20,60,.15) 60%,transparent)}

/* ==================== SCENE ANIM ==================== */
@keyframes wave-flow{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.wave-anim{animation:wave-flow 14s linear infinite}
.wave-anim-2{animation:wave-flow 22s linear infinite reverse}
@keyframes cloud-drift{0%{transform:translateX(-6%)}100%{transform:translateX(6%)}}
.cloud{animation:cloud-drift 32s ease-in-out infinite alternate}
.cloud-2{animation:cloud-drift 40s ease-in-out infinite alternate-reverse;animation-delay:-8s}
@keyframes boat-bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(7px) rotate(.6deg)}}
.boat{animation:boat-bob 5s ease-in-out infinite;transform-origin:center}
.boat-2{animation:boat-bob 6.5s ease-in-out infinite;animation-delay:-2s;transform-origin:center}
@keyframes sun-breathe{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.07);opacity:1}}
.sun{animation:sun-breathe 6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes bird-fly{0%{transform:translate(-150px,0);opacity:0}12%{opacity:.75}88%{opacity:.75}100%{transform:translate(1600px,-80px);opacity:0}}
.bird-track{animation:bird-fly 48s linear infinite}
.bird-track-2{animation:bird-fly 65s linear infinite;animation-delay:-20s}
@keyframes float-up{0%{transform:translateY(28px);opacity:0}100%{transform:translateY(0);opacity:1}}
.fade-up{animation:float-up .85s cubic-bezier(.16,1,.3,1) both}
.d-1{animation-delay:.08s}.d-2{animation-delay:.22s}

/* ==================== ANNOUNCEMENT TICKER ==================== */
#announcementBar{display:none;max-width:900px;margin:0 auto 1.5rem;
  background:linear-gradient(135deg,#0f3d38 0%,#0a2b28 100%);
  border:2px solid #FBD77A;border-radius:14px;padding:14px 0;
  position:relative;overflow:hidden;
  box-shadow:0 6px 28px rgba(244,184,66,.45),inset 0 0 30px rgba(244,184,66,.08)}
#announcementBar.show{display:block;animation:announce-fade-in .6s ease-out}
@keyframes announce-fade-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.announcement-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:22px;z-index:5;animation:announce-icon-pulse 1.5s ease-in-out infinite;
  filter:drop-shadow(0 0 10px rgba(244,184,66,1))}
@keyframes announce-icon-pulse{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-50%) scale(1.2)}}
.announcement-viewport{overflow:hidden;padding-left:48px;padding-right:20px;position:relative}
.announcement-track{display:inline-flex;white-space:nowrap;
  animation:announce-marquee 25s linear infinite;will-change:transform}
.announcement-text{padding-right:100px;color:#FFE58F;font-weight:900;font-size:14px;
  letter-spacing:.04em;
  text-shadow:0 0 4px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.7),0 0 16px rgba(255,229,143,.6),0 0 24px rgba(244,184,66,.4);
  font-family:'Nunito',sans-serif;-webkit-text-stroke:0.3px rgba(0,0,0,.3)}
@keyframes announce-marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@media(min-width:768px){
  .announcement-text{font-size:17px;padding-right:160px}
  .announcement-icon{font-size:26px;left:18px}
  .announcement-viewport{padding-left:60px}
  #announcementBar{padding:16px 0}
}
@media(prefers-reduced-motion:reduce){.announcement-track{animation-duration:60s}}

/* ==================== UPDATE BANNER ==================== */
#updateBanner{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;
  background:linear-gradient(135deg,#1a4a45 0%,#123634 100%);
  border-bottom:3px solid #FBD77A;padding:12px 16px;
  box-shadow:0 8px 32px rgba(244,184,66,.5);
  animation:update-slide-down .5s cubic-bezier(.16,1,.3,1);font-family:'Nunito',sans-serif}
#updateBanner.show{display:block}
@keyframes update-slide-down{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
.update-content{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.update-icon{font-size:32px;animation:update-bounce 1s ease-in-out infinite;
  filter:drop-shadow(0 0 12px rgba(244,184,66,.9))}
@keyframes update-bounce{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-6px) rotate(5deg)}}
.update-info{flex:1;min-width:180px}
.update-title{font-size:15px;font-weight:900;color:#FFE58F;text-transform:uppercase;
  letter-spacing:.04em;text-shadow:0 0 8px rgba(0,0,0,.9),0 0 16px rgba(255,229,143,.5);margin-bottom:2px}
.update-notes{font-size:11.5px;color:#bfe9dc;font-weight:600;line-height:1.4;opacity:.9}
.update-actions{display:flex;gap:8px;flex-wrap:wrap}
.update-btn{background:linear-gradient(135deg,#FBD77A,#F4B842);color:#123634;font-weight:900;
  font-size:13px;text-transform:uppercase;letter-spacing:.05em;padding:12px 22px;
  border-radius:12px;border:none;cursor:pointer;
  box-shadow:0 4px 16px rgba(244,184,66,.5);transition:all .2s;font-family:inherit;
  animation:update-btn-glow 2s ease-in-out infinite;white-space:nowrap}
@keyframes update-btn-glow{
  0%,100%{box-shadow:0 4px 16px rgba(244,184,66,.5)}
  50%{box-shadow:0 4px 24px rgba(244,184,66,.9),0 0 0 3px rgba(244,184,66,.3)}
}
.update-btn:active{transform:scale(.96)}
.update-btn:disabled{opacity:.5;cursor:wait;animation:none}
.update-skip{background:transparent;color:#98dccb;font-weight:700;font-size:11.5px;
  padding:12px 14px;border-radius:12px;border:1px solid rgba(152,220,203,.3);
  cursor:pointer;font-family:inherit;white-space:nowrap}
.update-skip:active{transform:scale(.96)}
@media(min-width:768px){
  .update-title{font-size:17px}
  .update-notes{font-size:13px}
  .update-btn{padding:14px 28px;font-size:14px}
}
@media(max-width:480px){
  #updateBanner{padding:10px 12px}
  .update-icon{font-size:26px}
  .update-title{font-size:13px}
  .update-actions{width:100%}
  .update-btn,.update-skip{flex:1;text-align:center}
}

/* ==================== TRANSITIONS ==================== */
#landing{transition:opacity .55s ease,transform .7s cubic-bezier(.16,1,.3,1);
  position:fixed;inset:0;z-index:50;overflow-y:auto;overflow-x:hidden}
#landing.fade-out{opacity:0;transform:scale(1.06);pointer-events:none}
#app-view{opacity:0;transition:opacity .45s ease;position:fixed;inset:0;z-index:40;background:#123634}
#app-view.show{opacity:1}
#app-frame{width:100%;height:100%;border:0;display:block;background:#123634;position:absolute;inset:0;z-index:1}
#app-frame.hidden-frame{opacity:0}
#app-loading{position:absolute;inset:0;z-index:5;display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:1rem;background:#123634;
  transition:opacity .4s;pointer-events:none}
#app-loading.hide{opacity:0}
.loader-ring{width:56px;height:56px;border:4px solid rgba(244,184,66,.2);
  border-top-color:#F4B842;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{color:#FBD77A;font-weight:800;font-size:.85rem;letter-spacing:.15em;text-transform:uppercase}

/* ============ FLOATING HOME CONTROLS ============ */
#home-controls{position:fixed;bottom:20px;right:15px;z-index:1000;
  display:flex;flex-direction:column-reverse;gap:8px;align-items:center;
  user-select:none;-webkit-user-select:none;touch-action:none;transition:opacity .2s}
#home-controls.dragging{transition:none;opacity:.85}
#home-controls.dragging #btn-home{transform:scale(1.08);
  box-shadow:0 10px 30px rgba(0,0,0,.7), 0 0 0 4px rgba(244,184,66,.35)}
#btn-home{width:52px;height:52px;border-radius:50%;background:rgba(18,54,52,.9);
  border:2px solid rgba(244,184,66,.7);color:#FBD77A;display:flex;align-items:center;justify-content:center;
  cursor:grab;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 6px 20px rgba(0,0,0,.5);transition:transform .15s,box-shadow .15s;
  -webkit-appearance:none;appearance:none;padding:0;touch-action:none;-webkit-tap-highlight-color:transparent}
#btn-home:active{cursor:grabbing}
#btn-home svg{width:24px;height:24px;pointer-events:none}
#btn-toggle{width:34px;height:34px;border-radius:50%;background:rgba(18,54,52,.8);
  border:1px solid rgba(244,184,66,.4);color:rgba(251,215,122,.95);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 3px 10px rgba(0,0,0,.3);transition:transform .15s;font-size:14px;
  -webkit-appearance:none;appearance:none;padding:0;line-height:1;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#btn-toggle:active{transform:scale(.92);background:rgba(18,54,52,.95)}
#home-controls.minimized #btn-home{width:18px;height:18px;opacity:.5;
  border-color:rgba(244,184,66,.5);box-shadow:0 3px 10px rgba(0,0,0,.4)}
#home-controls.minimized #btn-home svg{display:none}
#home-controls.minimized #btn-toggle{display:none}
#home-controls.minimized #btn-home::after{content:'';width:8px;height:8px;border-radius:50%;
  background:#FBD77A;box-shadow:0 0 10px rgba(244,184,66,.9)}
#home-controls.minimized #btn-home:active{width:52px;height:52px;opacity:1}
#home-controls.minimized #btn-home:active::after{display:none}
#home-controls.minimized #btn-home:active svg{display:block}

/* ==================== ORDER NOTIFICATION ==================== */
#orderNotif{display:none;position:fixed;top:20px;left:50%;
  transform:translateX(-50%) translateY(-120%);z-index:9998;
  background:linear-gradient(135deg,#B91C1C 0%,#7F1D1D 100%);
  border:2px solid #FBD77A;border-radius:16px;padding:14px 18px;
  min-width:280px;max-width:90vw;
  box-shadow:0 12px 40px rgba(185,28,28,.6),0 0 60px rgba(244,184,66,.3);
  transition:transform .5s cubic-bezier(.16,1,.3,1),opacity .3s;font-family:'Nunito',sans-serif}
#orderNotif.show{display:block;transform:translateX(-50%) translateY(0);
  animation:order-pulse 1.2s ease-in-out infinite}
@keyframes order-pulse{
  0%,100%{box-shadow:0 12px 40px rgba(185,28,28,.6),0 0 60px rgba(244,184,66,.3)}
  50%{box-shadow:0 12px 40px rgba(185,28,28,.9),0 0 80px rgba(244,184,66,.6)}
}
.order-notif-content{display:flex;align-items:center;gap:12px}
.order-notif-icon{font-size:32px;animation:bell-shake 0.8s ease-in-out infinite;
  filter:drop-shadow(0 0 12px rgba(251,215,122,.9))}
@keyframes bell-shake{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.order-notif-info{flex:1;min-width:0}
.order-notif-title{color:#FFE58F;font-size:15px;font-weight:900;text-transform:uppercase;
  letter-spacing:.04em;text-shadow:0 0 8px rgba(0,0,0,.9);margin-bottom:3px}
.order-notif-sub{color:#fff;font-size:12px;font-weight:700;opacity:.95;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order-notif-sub .table-hl{background:rgba(255,229,143,.2);color:#FFE58F;
  padding:1px 6px;border-radius:6px;font-weight:900}
.order-notif-actions{display:flex;gap:6px;flex-direction:column}
.order-notif-btn{background:linear-gradient(135deg,#FBD77A,#F4B842);color:#123634;
  font-weight:900;font-size:11px;padding:8px 12px;border-radius:9px;border:none;
  cursor:pointer;font-family:inherit;white-space:nowrap}
.order-notif-btn:active{transform:scale(.95)}
.order-notif-close{background:transparent;color:#FFE58F;font-size:11px;font-weight:700;
  border:none;cursor:pointer;padding:4px;font-family:inherit}
@media(min-width:768px){
  #orderNotif{min-width:360px;padding:16px 22px}
  .order-notif-icon{font-size:38px}
  .order-notif-title{font-size:17px}
  .order-notif-sub{font-size:13.5px}
}

/* ==================== MOBILE ==================== */
@media (max-width:380px){
  .area-card{min-height:160px;padding:1.4rem .7rem 1.2rem;gap:.3rem}
  .area-icon{font-size:2.2rem;margin-bottom:.5rem}
  #btn-home{width:34px;height:34px}
  #btn-toggle{width:24px;height:24px}
}
@media (max-height:560px) and (orientation:landscape){
  .brand-title{font-size:clamp(1.6rem,5vw,2.6rem)}
  .area-card{min-height:130px;padding:1rem .5rem .9rem}
  .area-icon{font-size:2rem;margin-bottom:.4rem}
}
</style>

<script src="community-chat.js" defer></script>
<script src="theme-system.js" defer></script>
<script src="avatar-system.js" defer></script>
<script src="master.js" defer></script>

<body>

<!-- ════════ ORDER NOTIFICATION BELL ════════ -->
<div id="orderNotif">
  <div class="order-notif-content">
    <span class="order-notif-icon">🔔</span>
    <div class="order-notif-info">
      <div class="order-notif-title" id="orderNotifTitle">ĐƠN MỚI!</div>
      <div class="order-notif-sub" id="orderNotifSub">Bàn ... vừa đặt</div>
    </div>
    <div class="order-notif-actions">
      <button class="order-notif-btn" onclick="openOrderFromNotif()">Xem</button>
      <button class="order-notif-close" onclick="closeOrderNotif()">✕</button>
    </div>
  </div>
</div>

<!-- ════════ UPDATE BANNER ════════ -->
<div id="updateBanner">
  <div class="update-content">
    <span class="update-icon">🎉</span>
    <div class="update-info">
      <div class="update-title">Có bản cập nhật mới!</div>
      <div class="update-notes" id="updateNotes">Đang tải...</div>
    </div>
    <div class="update-actions">
      <button class="update-skip" onclick="dismissUpdate()">Để sau</button>
      <button class="update-btn" id="updateBtn" onclick="performUpdate()">🔄 Cập nhật ngay</button>
    </div>
  </div>
</div>

<!-- ══════════════ LANDING PAGE ══════════════ -->
<div id="landing">
  <svg style="position:fixed;inset:0;width:100%;height:100%;z-index:-1" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fb4d9"/><stop offset="0.55" stop-color="#a9e0e6"/><stop offset="1" stop-color="#fbf0cf"/></linearGradient>

      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

<script>
(function(){
  'use strict';

  /* ============ CONFIG ============ */
  var APP_MAP = {
    lounge:     'dolphin-lounge.html',
    bungalow:   'dolphin-bungalow.html',
    restaurant: 'dolphin-restaurant.html',
    show:       'dolphin-show.html',
    dashboard:  'manager/dashboard.html',
    ranking:    'ranking/index.html',
    caro:       'caro/index.html'
  };

  var currentApp = null;
  var transitionLock = false;

  /* ============ HOME BUTTON ============ */
  var HOME_KEY = 'dolphinHomeBtnHidden';
  function applyHomeBtnState(){
    var ctrl = document.getElementById('home-controls');
    var hidden = localStorage.getItem(HOME_KEY) === '1';
    ctrl.classList.toggle('minimized', hidden);
  }
  window.toggleHomeBtn = function(){
    var ctrl = document.getElementById('home-controls');
    var nowHidden = !ctrl.classList.contains('minimized');
    localStorage.setItem(HOME_KEY, nowHidden ? '1' : '0');
    ctrl.classList.toggle('minimized', nowHidden);
  };

  /* ============ DRAGGABLE HOME ============ */
  var DRAG_POS_KEY = 'dolphinHomeBtnPos';
  var ctrl = null;

  function saveHomePos(x, y){
    try { localStorage.setItem(DRAG_POS_KEY, JSON.stringify({ x: x, y: y })); } catch(e){}
  }
  function loadHomePos(){
    try { var s = localStorage.getItem(DRAG_POS_KEY); return s ? JSON.parse(s) : null; }
    catch(e){ return null; }
  }
  function applyHomePos(x, y){
    if (!ctrl) return;
    ctrl.style.left = x + 'px';
    ctrl.style.top = y + 'px';
    ctrl.style.right = 'auto';
    ctrl.style.bottom = 'auto';
  }
  function clampPos(x, y){
    var vw = window.innerWidth, vh = window.innerHeight;
    var w = ctrl.offsetWidth || 60, h = ctrl.offsetHeight || 100;
    x = Math.max(4, Math.min(x, vw - w - 4));
    y = Math.max(4, Math.min(y, vh - h - 4));
    return { x: x, y: y };
  }
  function snapToEdge(){
    if (!ctrl) return;
    var vw = window.innerWidth, w = ctrl.offsetWidth || 60;
    var cur = { x: ctrl.offsetLeft, y: ctrl.offsetTop };
    var snapLeft = cur.x < (vw - w) / 2;
    var nx = snapLeft ? 12 : (vw - w - 12);
    var ny = clampPos(nx, cur.y).y;
    ctrl.style.transition = 'left .3s cubic-bezier(.16,1,.3,1), top .3s cubic-bezier(.16,1,.3,1)';
    applyHomePos(nx, ny);
    setTimeout(function(){ ctrl.style.transition = ''; }, 320);
    saveHomePos(nx, ny);
  }
  function clampOnResize(){
    if (!ctrl) return;
    var pos = loadHomePos();
    if (!pos) return;
    var c = clampPos(pos.x, pos.y);
    applyHomePos(c.x, c.y);
  }
  function initDraggableHome(){
    ctrl = document.getElementById('home-controls');
    if (!ctrl) return;
    var saved = loadHomePos();
    if (saved) {
      var c = clampPos(saved.x, saved.y);
      applyHomePos(c.x, c.y);
    }
    var btnHome = document.getElementById('btn-home');
    if (!btnHome) return;
    var drag = { active: false, startX: 0, startY: 0, origX: 0, origY: 0, moved: false };
    function getPoint(e){
      if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      if (e.changedTouches && e.changedTouches[0]) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }
    function onStart(e){
      if (e.target.closest('#btn-toggle')) return;
      var pt = getPoint(e);
      drag.active = true; drag.moved = false;
      drag.startX = pt.x; drag.startY = pt.y;
      drag.origX = ctrl.offsetLeft; drag.origY = ctrl.offsetTop;
      ctrl.classList.add('dragging');
      ctrl.style.transition = '';
    }
    function onMove(e){
      if (!drag.active) return;
      var pt = getPoint(e);
      var dx = pt.x - drag.startX, dy = pt.y - drag.startY;
      if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 8) return;
      drag.moved = true;
      if (e.cancelable) e.preventDefault();
      var c = clampPos(drag.origX + dx, drag.origY + dy);
      applyHomePos(c.x, c.y);
    }
    function onEnd(){
      if (!drag.active) return;
      drag.active = false;
      ctrl.classList.remove('dragging');
      if (!drag.moved) return;
      snapToEdge();
    }
    btnHome.addEventListener('touchstart', onStart, { passive: true });
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);
    document.addEventListener('touchcancel', onEnd);
    btnHome.addEventListener('mousedown', function(e){ onStart(e); e.preventDefault(); });
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    window.addEventListener('resize', clampOnResize);
    window.addEventListener('orientationchange', function(){ setTimeout(clampOnResize, 300); });
    btnHome.addEventListener('click', function(e){
      if (drag.moved) { e.preventDefault(); e.stopPropagation(); drag.moved = false; }
    }, true);
  }

  applyHomeBtnState();
  setTimeout(initDraggableHome, 100);

  /* ============ HIỆN DASHBOARD CHO MANAGER ============ */
  if (navigator.userAgent.indexOf('DolphinManager') >= 0) {
    var cardDash = document.getElementById('card-dashboard');
    if (cardDash) cardDash.style.display = 'flex';
  }

  /* ============ OPEN APP ============ */
  window.openApp = function(area){
    if (transitionLock) return;
    if (!APP_MAP[area]) return;
    doOpenApp(area);
  };

  function doOpenApp(area){
    if (transitionLock) return;
    var url = APP_MAP[area];
    if (!url) return;
    transitionLock = true;
    if (location.hash !== '#' + area) {
      try { history.pushState({area: area}, '', '#' + area); } catch(e) { location.hash = area; }
    }
    currentApp = area;
    var frame = document.getElementById('app-frame');
    var view = document.getElementById('app-view');
    var landing = document.getElementById('landing');
    var loading = document.getElementById('app-loading');
    loading.classList.remove('hide');
    frame.classList.add('hidden-frame');
    var done = false;
    var onLoaded = function(){
      if (done) return; done = true;
      frame.removeEventListener('load', onLoaded);
      setTimeout(function(){
        loading.classList.add('hide');
        frame.classList.remove('hidden-frame');
        transitionLock = false;
      }, 300);
    };
    frame.addEventListener('load', onLoaded);
    frame.src = url;
    setTimeout(function(){
      if (done) return; done = true;
      loading.classList.add('hide');
      frame.classList.remove('hidden-frame');
      transitionLock = false;
    }, 10000);
    landing.classList.add('fade-out');
    setTimeout(function(){
      landing.style.display = 'none';
      view.classList.remove('hidden');
      void view.offsetWidth;
      requestAnimationFrame(function(){ view.classList.add('show'); });
    }, 420);
  }

  /* ============ GO HOME ============ */
  window.goHome = function(){
    if (transitionLock) return;
    transitionLock = true;
    if (location.hash) {
      try { history.pushState({}, '', location.pathname + location.search); }
      catch(e){ location.hash = ''; }
    }
    currentApp = null;
    var frame = document.getElementById('app-frame');
    var view = document.getElementById('app-view');
    var landing = document.getElementById('landing');
    var loading = document.getElementById('app-loading');
    view.classList.remove('show');
    setTimeout(function(){
      view.classList.add('hidden');
      frame.src = 'about:blank';
      loading.classList.remove('hide');
      frame.classList.remove('hidden-frame');
      landing.style.display = '';
      void landing.offsetWidth;
      requestAnimationFrame(function(){
        landing.classList.remove('fade-out');
        transitionLock = false;
      });
    }, 420);
  };

  /* ============ POPSTATE ============ */
  window.addEventListener('popstate', function(){
    if (transitionLock) return;
    var hash = (location.hash || '').replace('#', '');
    if (hash && APP_MAP[hash]) {
      if (currentApp !== hash) window.openApp(hash);
    } else {
      if (currentApp) window.goHome();
    }
  });

  /* ============ INITIAL HASH ============ */
  window.addEventListener('DOMContentLoaded', function(){
    var hash = (location.hash || '').replace('#', '');
    if (hash && APP_MAP[hash]) {
      setTimeout(function(){ window.openApp(hash); }, 350);
    }
  });

  /* ============ CHỐNG DOUBLE-TAP ZOOM ============ */
  var lastTouch = 0;
  document.addEventListener('touchend', function(e){
    var now = Date.now();
    if (now - lastTouch <= 320) e.preventDefault();
    lastTouch = now;
  }, { passive: false });

})();
</script>

<script type="module">

const firebaseConfig = {
  apiKey: "AIzaSyAtBNp9WBnyIkCiVjXfUpjH2d7-9dbg-JQ",
  authDomain: "dolphin-f6d67.firebaseapp.com",
  projectId: "dolphin-f6d67"
};

try {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  signInAnonymously(auth).then(() => {
    const ref = doc(db, 'master_config', 'announcement');

  function updateAnnouncement(data) {
    const bar = document.getElementById('announcementBar');
    const t1 = document.getElementById('announcementText');
    const t2 = document.getElementById('announcementText2');
    const track = document.getElementById('announcementTrack');
    if (!bar || !t1 || !t2 || !track) return;
    const active = data && data.active === true;
    const text = data && data.text ? String(data.text).trim() : '';
    if (!active || !text) { bar.classList.remove('show'); return; }
    const fullText = '📢 ' + text + '   •   📢 ' + text + '   •   ';
    t1.textContent = fullText;
    t2.textContent = fullText;
    bar.classList.add('show');
    requestAnimationFrame(() => {
      const w = t1.offsetWidth;
      if (w > 0) {
        const speed = 80;
        const duration = Math.max(15, Math.min(120, w / speed));
        track.style.animation = 'none';
        void track.offsetWidth;
        track.style.animation = 'announce-marquee ' + duration + 's linear infinite';
      }
    });
  }
} catch(e) { console.warn('[Announcement] Init error:', e); }
</script>

<!-- ════════ ORDER + CALL NOTIFICATION — với push CHAT ════════ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const notifFirebaseConfig = {
  apiKey: "AIzaSyAtBNp9WBnyIkCiVjXfUpjH2d7-9dbg-JQ",
  authDomain: "dolphin-f6d67.firebaseapp.com",
  projectId: "dolphin-f6d67"
};

const WATCH_ORDERS = [
  { name: 'bun_orders',    label: 'Bungalow',   icon: '🌴' },
  { name: 'lounge_orders', label: 'Lounge',     icon: '🍸' },
  { name: 'res_orders',    label: 'Restaurant', icon: '🍽️' }
];
const WATCH_CALLS = [
  { name: 'bun_calls',    label: 'Bungalow',   icon: '🌴' },
  { name: 'lounge_calls', label: 'Lounge',     icon: '🍸' },
  { name: 'res_calls',    label: 'Restaurant', icon: '🍽️' }
];

let notifAudioCtx = null;
let notifHideTimer = null;

function unlockNotifAudio(){
  try {
    if (!notifAudioCtx) notifAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (notifAudioCtx.state === 'suspended') notifAudioCtx.resume();
  } catch(e){}
}
['click','touchstart','keydown'].forEach(ev => {
  document.addEventListener(ev, unlockNotifAudio, { once: false, passive: true });
});

function playOrderBell(){
  try {
    if (!notifAudioCtx) notifAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (notifAudioCtx.state === 'suspended') notifAudioCtx.resume();
    const ctx = notifAudioCtx;
    const now = ctx.currentTime;
    const master = ctx.createGain();
    master.gain.value = 0.8;
    master.connect(ctx.destination);
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18;
    comp.ratio.value = 4;
    comp.connect(master);
    const delay = ctx.createDelay();
    delay.delayTime.value = 0.02;
    const delayGain = ctx.createGain();
    delayGain.gain.value = 0.3;
    delay.connect(delayGain);
    delayGain.connect(master);

    function strike(freq, time, gainVal, decay){
      [{r:1.00,g:1.00,d:1.0},{r:2.00,g:0.6,d:0.85},{r:2.76,g:0.4,d:0.7},{r:4.07,g:0.25,d:0.55},{r:5.43,g:0.15,d:0.4}].forEach(p => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq * p.r;
        osc.detune.value = (Math.random() - 0.5) * 4;
        const peak = gainVal * p.g;
        const dec = decay * p.d;
        g.gain.setValueAtTime(0.0001, time);
        g.gain.exponentialRampToValueAtTime(peak, time + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, time + dec);
        osc.connect(g); g.connect(comp); g.connect(delay);
        osc.start(time); osc.stop(time + dec + 0.05);
      });
    }

    const baseFreq = 1046.50;
    strike(baseFreq, now + 0.0, 0.5, 1.2);
    strike(baseFreq, now + 0.35, 0.5, 1.2);
    strike(baseFreq, now + 0.70, 0.5, 2.5);
    strike(baseFreq * 0.75, now + 0.70, 0.35, 2.5);
    strike(baseFreq * 0.5,  now + 0.72, 0.25, 2.5);

    if (navigator.vibrate) {
      try { navigator.vibrate([200,100,200,100,400]); } catch(e){}
    }
  } catch(e){ console.warn('[Notif] Bell error:', e); }
}

function showOrderNotif(cfg, data, type){
  const notif = document.getElementById('orderNotif');
  const title = document.getElementById('orderNotifTitle');
  const sub = document.getElementById('orderNotifSub');
  if (!notif || !title || !sub) return;

  const colLabel = cfg.icon + ' ' + cfg.label;
  const table = data.table || '--';
  const customer = data.customerName || '';

  if (type === 'call'){
    title.textContent = '🛎️ KHÁCH GỌI PHỤC VỤ!';
    sub.innerHTML = colLabel + ' · Bàn <span class="table-hl">' + table + '</span>' + (customer ? ' · ' + customer : '');
  } else {
    const itemCount = Array.isArray(data.items) ? data.items.length : 0;
    title.textContent = '🔔 CÓ ĐƠN MỚI!';
    sub.innerHTML = colLabel + ' · Bàn <span class="table-hl">' + table + '</span> · ' +
                    (itemCount > 0 ? itemCount + ' món' : 'đơn mới') +
                    (customer ? ' · ' + customer : '');
  }

  notif.dataset.collection = cfg.name;
  notif.dataset.table = table;
  notif.classList.add('show');
  if (notifHideTimer) clearTimeout(notifHideTimer);
  notifHideTimer = setTimeout(() => { closeOrderNotif(); }, 12000);
}

window.closeOrderNotif = function(){
  const notif = document.getElementById('orderNotif');
  if (notif) notif.classList.remove('show');
};

window.openOrderFromNotif = function(){
  const notif = document.getElementById('orderNotif');
  if (!notif) return;
  const collection = notif.dataset.collection;
  const map = {
    'bun_orders': 'bungalow', 'lounge_orders': 'lounge', 'res_orders': 'restaurant',
    'bun_calls': 'bungalow', 'lounge_calls': 'lounge', 'res_calls': 'restaurant'
  };
  const appKey = map[collection];
  if (appKey && window.openApp) window.openApp(appKey);
  closeOrderNotif();
};

function pushToChat(text, icon){
  if (window.ChatSystem && window.ChatSystem.pushSystemMessage){
    window.ChatSystem.pushSystemMessage(text, icon);
  }
}

try {
  const app = initializeApp(notifFirebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  signInAnonymously(auth).then(() => {
    WATCH_ORDERS.forEach(cfg => {
      const isInitial = { flag: true };
      onSnapshot(collection(db, cfg.name), snap => {
        if (isInitial.flag) { isInitial.flag = false; return; }
        snap.docChanges().forEach(ch => {
          if (ch.type === 'added'){
            const data = ch.doc.data();
            if (data.status === 'pending'){
              playOrderBell();
              showOrderNotif(cfg, data, 'order');
              const itemCount = Array.isArray(data.items) ? data.items.length : 0;
              pushToChat(
                cfg.label + ' · Bàn ' + (data.table || '--') + ' · ' +
                (itemCount > 0 ? itemCount + ' món' : 'đơn mới') +
                (data.customerName ? ' · ' + data.customerName : ''),
                '🔔'
              );
            }
          }
        });
      }, err => console.warn('[Notif] Order listen error', cfg.name, err));
    });

    WATCH_CALLS.forEach(cfg => {
      const isInitial = { flag: true };
      onSnapshot(collection(db, cfg.name), snap => {
        if (isInitial.flag) { isInitial.flag = false; return; }
        snap.docChanges().forEach(ch => {
          if (ch.type === 'added'){
            const data = ch.doc.data();
            if (data.status === 'pending'){
              playOrderBell();
              showOrderNotif(cfg, data, 'call');
              pushToChat(
                cfg.label + ' · Bàn ' + (data.table || '--') + ' gọi phục vụ' +
                (data.customerName ? ' · ' + data.customerName : ''),
                '🛎️'
              );
            }
          }
        });
      }, err => console.warn('[Notif] Call listen error', cfg.name, err));
    });
  }).catch(err => console.warn('[Notif] Auth error:', err));
} catch(e){ console.warn('[Notif] Init error:', e); }
</script>

<!-- ════════ VERSION CHECK + AUTO UPDATE ════════ -->
<script>
(function(){
  'use strict';
  var VERSION_KEY = 'dolphinAppVersion';
  var DISMISS_KEY = 'dolphinUpdateDismissed';
  var CHECK_INTERVAL = 5 * 60 * 1000;
  var UPDATE_URL = '/DolphinApp/version.json';
  var currentRemoteVersion = null;

  function getLocalVersion(){
    try { return localStorage.getItem(VERSION_KEY) || '0.0.0'; } catch(e){ return '0.0.0'; }
  }
  function setLocalVersion(v){ try { localStorage.setItem(VERSION_KEY, v); } catch(e){} }
  function isDismissed(version){
    try {
      var d = JSON.parse(localStorage.getItem(DISMISS_KEY) || 'null');
      if (!d) return false;
      if (Date.now() - d.time > 6 * 60 * 60 * 1000) return false;
      return d.version === version;
    } catch(e){ return false; }
  }
  function dismissCurrent(){
    try {
      localStorage.setItem(DISMISS_KEY, JSON.stringify({ version: currentRemoteVersion, time: Date.now() }));
    } catch(e){}
  }
  function checkForUpdate(){
    var url = UPDATE_URL + '?t=' + Date.now();
    fetch(url, { cache: 'no-store', headers: { 'Cache-Control': 'no-cache' } })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(data){
      if (!data || !data.version) return;
      var remoteVer = data.version;
      var localVer = getLocalVersion();
      currentRemoteVersion = remoteVer;
      if (localVer === '0.0.0') { setLocalVersion(remoteVer); return; }
      if (remoteVer !== localVer) {
        if (isDismissed(remoteVer) && !data.forceUpdate) return;
        showUpdateBanner(data);
      } else { hideUpdateBanner(); }
    })
    .catch(function(err){ console.warn('[Update] Check failed:', err); });
  }
  function showUpdateBanner(data){
    var banner = document.getElementById('updateBanner');
    var notesEl = document.getElementById('updateNotes');
    if (!banner || !notesEl) return;
    var notes = data.notes || 'Phiên bản mới đã sẵn sàng';
    notesEl.textContent = 'v' + data.version + ' · ' + notes;
    banner.classList.add('show');
    document.body.style.paddingTop = banner.offsetHeight + 'px';
  }
  function hideUpdateBanner(){
    var banner = document.getElementById('updateBanner');
    if (!banner) return;
    banner.classList.remove('show');
    document.body.style.paddingTop = '0';
  }
  window.performUpdate = function(){
    var btn = document.getElementById('updateBtn');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Đang cập nhật...'; }
    var actions = [
      ('caches' in window) ? caches.keys().then(function(names){
        return Promise.all(names.map(function(n){
          if (n.indexOf('dolphin-') === 0 || n.indexOf('workbox') === 0) return caches.delete(n);
        }));
      }) : Promise.resolve(),
      ('serviceWorker' in navigator) ? navigator.serviceWorker.getRegistrations().then(function(regs){
        return Promise.all(regs.map(function(r){ return r.unregister(); }));
      }) : Promise.resolve(),
      Promise.resolve().then(function(){
        try { localStorage.removeItem(VERSION_KEY); localStorage.removeItem(DISMISS_KEY); } catch(e){}
      })
    ];
    Promise.all(actions).then(function(){
      setTimeout(function(){
        if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({ type: 'SKIP_WAITING' });
        }
        window.location.reload(true);
      }, 600);
    }).catch(function(err){
      console.error('[Update] Error:', err);
      setTimeout(function(){ window.location.reload(true); }, 500);
    });
  };
  window.dismissUpdate = function(){ dismissCurrent(); hideUpdateBanner(); };
  function start(){
    setTimeout(checkForUpdate, 2000);
    setInterval(checkForUpdate, CHECK_INTERVAL);
    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'visible') setTimeout(checkForUpdate, 1000);
    });
    window.addEventListener('online', function(){ setTimeout(checkForUpdate, 500); });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else { start(); }
})();
</script>

<!-- ════════ ENHANCED LANDING ════════ -->
<script>
(function(){
  'use strict';
  function initParticles(){
    const landing = document.getElementById('landing');
    if (!landing) return;
    const isMobile = window.innerWidth < 768;
    const count = isMobile ? 12 : 22;
    for (let i = 0; i < count; i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 4 + Math.random() * 8;
      p.style.cssText = 'width:'+size+'px;height:'+size+'px;left:'+(Math.random()*100)+'%;top:'+(70+Math.random()*30)+'%;animation-duration:'+(12+Math.random()*10)+'s;animation-delay:-'+(Math.random()*15)+'s;opacity:'+(0.3+Math.random()*0.5);
      landing.appendChild(p);
    }
  }
  function updateTimeBackground(){
    const landing = document.getElementById('landing');
    if (!landing) return;
    try {
      const vnTime = new Intl.DateTimeFormat('en-US', { timeZone:'Asia/Ho_Chi_Minh', hour12:false, hour:'2-digit' }).format(new Date());
      const h = parseInt(vnTime, 10);
      landing.classList.remove('time-morning','time-day','time-evening','time-night');
      if (h >= 5 && h < 9) landing.classList.add('time-morning');
      else if (h >= 9 && h < 16) landing.classList.add('time-day');
      else if (h >= 16 && h < 19) landing.classList.add('time-evening');
      else landing.classList.add('time-night');
    } catch(e){}
  }
  function enhanceSun(){
    const sunGroup = document.querySelector('.sun');
    if (!sunGroup || sunGroup.dataset.enhanced === '1') return;
    sunGroup.dataset.enhanced = '1';
    const halo = document.createElementNS('http://www.w3.org/2000/svg','circle');
    halo.setAttribute('cx','1100');
    halo.setAttribute('cy','250');
    halo.setAttribute('r','250');
    halo.setAttribute('fill','url(#sunCorona)');
    halo.setAttribute('opacity','0.6');
    halo.setAttribute('class','sun-halo-2');
    sunGroup.insertBefore(halo, sunGroup.firstChild);
  }
  function init(){
    initParticles();
    enhanceSun();
    updateTimeBackground();
    setInterval(updateTimeBackground, 60000);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => setTimeout(init, 500));
  } else { setTimeout(init, 500); }
})();
</script>
