name: Halloween Background Tests
on:
  pull_request:
    paths:
      - 'halloween-background.css'
      - 'halloween-background.test.js'
      - 'assets/themes/halloween/**'
      - '.github/workflows/halloween-background-tests.yml'
      - 'index.html'
  push:
    branches: [main]
    paths:
      - 'halloween-background.css'
      - 'halloween-background.test.js'
      - 'assets/themes/halloween/**'
      - '.github/workflows/halloween-background-tests.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test halloween-background.test.js
