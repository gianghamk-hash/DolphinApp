/* KHÓA SCROLL TRANG MẸ KHI MỞ SNAKE */
html.game-locked, body.game-locked{
  overflow:hidden!important;overscroll-behavior:contain!important;touch-action:auto!important;
  position:fixed!important;top:0;left:0;right:0;bottom:0;width:100%;height:100%;
}

.tab-switcher{display:flex;gap:5px;padding:6px;background:rgba(10,30,28,.6);border-radius:14px;border:1px solid rgba(255,255,255,.08);margin-bottom:16px}
.tab-btn{flex:1;padding:10px 4px;border-radius:10px;font-weight:900;font-size:11.5px;letter-spacing:.03em;
  border:none;background:transparent;color:#7ec9be;cursor:pointer;font-family:inherit;transition:all .2s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tab-btn.active{background:linear-gradient(135deg,#FBD77A,#F4B842);color:#123634;box-shadow:0 4px 12px rgba(244,184,66,.4)}
.tab-btn:active{transform:scale(.97)}
.tab-btn span:first-child{font-size:16px}

  .tab-btn{font-size:13px;padding:12px 8px;flex-direction:row;gap:6px}
  .tab-btn span:first-child{font-size:15px}
}

.mode-switcher{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.mode-btn{padding:12px 10px;border-radius:12px;font-weight:900;font-size:12px;letter-spacing:.03em;
  border:2px solid rgba(55,137,123,.4);background:rgba(25,71,67,.5);color:#bfe9dc;
  cursor:pointer;font-family:inherit;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:3px}
.mode-btn.active{background:linear-gradient(135deg,#FBD77A,#F4B842);color:#123634;border-color:transparent;
  box-shadow:0 4px 14px rgba(244,184,66,.5)}
.mode-btn .mode-sub{font-size:9.5px;font-weight:700;opacity:.75;letter-spacing:.02em;font-style:italic}
.mode-btn.active .mode-sub{opacity:.85}
.track-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;
  background:rgba(10,30,28,.5);border:1px solid rgba(255,255,255,.08);
  cursor:pointer;transition:all .2s;margin-bottom:8px}
.track-row:active{transform:scale(.98);background:rgba(10,30,28,.8)}
.track-row.playing{background:linear-gradient(135deg,rgba(244,184,66,.18),rgba(244,184,66,.05));
  border-color:rgba(244,184,66,.6);box-shadow:0 4px 20px rgba(244,184,66,.25)}
.track-row .track-icon{font-size:26px;flex-shrink:0;width:36px;text-align:center;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.track-row .track-info{flex:1;min-width:0}
.track-row .track-label{font-weight:900;font-size:13px;color:#fff;margin-bottom:2px}
.track-row.playing .track-label{color:#FBD77A}
.track-row .track-sub{font-size:10.5px;color:#7ec9be;font-weight:700;letter-spacing:.02em}
.track-row .track-eq{display:none;gap:2px;align-items:flex-end;height:18px}
.track-row.playing .track-eq{display:flex}
.track-row .track-eq span{width:3px;background:#FBD77A;border-radius:2px;animation:eqbar .8s ease-in-out infinite}
.track-row .track-eq span:nth-child(1){animation-delay:0s}
.track-row .track-eq span:nth-child(2){animation-delay:.15s}
.track-row .track-eq span:nth-child(3){animation-delay:.3s}
.track-row .track-eq span:nth-child(4){animation-delay:.45s}
@keyframes eqbar{0%,100%{height:4px}50%{height:16px}}
.vol-slider{width:100%;height:5px;-webkit-appearance:none;background:linear-gradient(90deg,#FBD77A,#F4B842);
  border-radius:99px;outline:none;cursor:pointer}

  background:#fff;box-shadow:0 0 12px rgba(244,184,66,.9);cursor:pointer}

#miniPlayer{position:fixed;left:0;right:0;bottom:0;z-index:60;

#miniPlayer .mp-btn{width:40px;height:40px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#FBD77A,#F4B842);color:#123634;

  box-shadow:0 4px 12px rgba(244,184,66,.5)}
#miniPlayer .mp-btn:active{transform:scale(.92)}

.game-menu-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:16px}

@media(min-width:780px){.game-menu-grid{grid-template-columns:repeat(3,1fr)}}
.game-menu-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 16px;
  background:linear-gradient(135deg,rgba(26,74,69,.9),rgba(13,42,40,.9));
  border:2px solid rgba(244,184,66,.35);border-radius:16px;cursor:pointer;font-family:inherit;
  transition:all .25s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden;text-align:center}
.game-menu-btn:hover{transform:translateY(-3px);border-color:rgba(244,184,66,.7);box-shadow:0 8px 24px rgba(244,184,66,.25)}
.game-menu-btn:active{transform:scale(.97)}
.game-menu-btn .gm-icon{font-size:44px;line-height:1;filter:drop-shadow(0 4px 12px rgba(244,184,66,.5))}
.game-menu-btn .gm-title{font-size:16px;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:.05em}
.game-menu-btn .gm-sub{font-size:10.5px;color:#7ec9be;font-weight:700;font-style:italic}

.game-frame-wrap{position:relative;width:100%;height:calc(100vh - 220px);min-height:420px;
  border-radius:14px;overflow:hidden;border:2px solid rgba(244,184,66,.4);background:#0a1f1d;
  box-shadow:0 8px 30px rgba(0,0,0,.5);overscroll-behavior:contain;touch-action:manipulation}
.game-frame-wrap iframe{width:100%;height:100%;border:0;display:block;background:#0a1f1d;overscroll-behavior:contain;touch-action:auto!important;-webkit-overflow-scrolling:touch}
.game-back-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:12px;
  background:rgba(25,71,67,.6);border:1px solid rgba(55,137,123,.5);
  color:#bfe9dc;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;margin-bottom:10px}
.game-back-btn:active{transform:scale(.96)}
.game-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;
  background:#0a1f1d;z-index:2;transition:opacity .3s}
.game-loading.hide{opacity:0;pointer-events:none}
.game-loading .spin{width:48px;height:48px;border:3px solid rgba(244,184,66,.2);border-top-color:#FBD77A;
  border-radius:50%;animation:spin 1s linear infinite}

.lb-table{width:100%;font-size:12px;border-collapse:collapse}
.lb-table thead tr{border-bottom:2px solid rgba(244,184,66,.35);color:#FBD77A;font-weight:900;font-size:10px;text-transform:uppercase}

.lb-table th.num{text-align:right}

.lb-table td.rank{font-weight:900;color:#FBD77A;width:44px;font-size:12px}
.lb-table td.rank.top{font-size:16px}

.lb-table td.num{text-align:right}
.lb-table td.good{color:#86efac}
.lb-table td.bad{color:#fca5a5}
.lb-table td.gold{color:#FBD77A;font-weight:900;font-size:14px}

/* ═══════ ✨ LIQUID GLASS · DARK (nền đen) ═══════ */
:root{--lg-fill:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04) 55%,rgba(255,255,255,.08));--lg-fill-hi:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.07) 55%,rgba(255,255,255,.12));--lg-blur:blur(26px) saturate(190%) brightness(1.06);--lg-edge:rgba(255,255,255,.20);--lg-spec:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.06),inset 1px 0 0 rgba(255,255,255,.12);--lg-shadow:0 14px 40px -14px rgba(0,0,0,.8),0 2px 8px rgba(0,0,0,.35);--lg-ink2:rgba(220,240,235,.72);--spring:.45s cubic-bezier(.34,1.56,.64,1);--ease:.25s cubic-bezier(.2,.8,.2,1)}
html,body{background:#000!important}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{touch-action:manipulation}
button:focus-visible{outline:2px solid rgba(255,255,255,.85);outline-offset:2px}
body>.sticky{background:linear-gradient(180deg,rgba(0,0,0,.78),rgba(0,0,0,.5))!important;-webkit-backdrop-filter:var(--lg-blur);backdrop-filter:var(--lg-blur);border-bottom:1px solid rgba(255,255,255,.10)!important;padding-top:env(safe-area-inset-top);box-shadow:0 10px 30px -14px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.12)}
body>.sticky button:first-child{width:44px;height:44px;border-radius:50%!important;background:rgba(255,255,255,.09)!important;border:1px solid rgba(255,255,255,.16)!important;color:#fff!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px -8px rgba(0,0,0,.8);transition:transform var(--spring),background var(--ease)}
body>.sticky button:first-child:active{transform:scale(.86)}
.glass{background:var(--lg-fill);-webkit-backdrop-filter:var(--lg-blur);backdrop-filter:var(--lg-blur);border:1px solid var(--lg-edge);border-radius:24px!important;box-shadow:var(--lg-spec),var(--lg-shadow)}
.glass[style]{background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 55%,rgba(251,215,122,.10))!important;border:1px solid rgba(255,255,255,.26)!important}
.ic{display:inline-block;width:1.15em;height:1.15em;margin-right:.4em;vertical-align:-.2em;flex-shrink:0;background:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat}
.tab-btn .ic,.mode-btn .ic,.mp-btn .ic,.gm-icon .ic,.hero-tile .ic,body>.sticky .ic,.track-icon .ic{margin:0}
.hero-tile{display:flex;align-items:center;justify-content:center;width:64px;height:64px;margin:0 auto 12px;border-radius:21px;color:#ffe29a;background:linear-gradient(145deg,rgba(251,215,122,.30),rgba(251,215,122,.06));border:1px solid rgba(251,215,122,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 26px -10px rgba(244,184,66,.65),0 0 34px -10px rgba(251,215,122,.5)}
.hero-tile .ic{width:32px;height:32px}
.sec-ic{display:inline-flex;color:#FBD77A}
.brand-title{filter:drop-shadow(0 2px 14px rgba(251,215,122,.4))}

/* Thanh tab kiểu iOS */
.tab-switcher{padding:4px;gap:2px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);box-shadow:inset 0 2px 8px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.06)}
.tab-btn{min-height:46px;border-radius:99px;color:var(--lg-ink2);font-weight:800;transition:transform var(--spring),background var(--ease),color var(--ease),box-shadow var(--ease)}
.tab-btn .ic{width:19px;height:19px}

#lbGameTabs{border-radius:26px}

/* Chế độ nhạc */
.mode-btn{border:1px solid var(--lg-edge);border-radius:20px;background:var(--lg-fill);color:#fff;box-shadow:var(--lg-spec);-webkit-backdrop-filter:var(--lg-blur);backdrop-filter:var(--lg-blur);transition:transform var(--spring),background var(--ease)}
.mode-btn .ic{width:22px;height:22px}
.mode-btn:active{transform:scale(.95)}
.mode-btn.active{background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(228,232,236,.94));color:#0a0a0a;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 10px 24px -8px rgba(255,255,255,.3)}

/* Đang phát + danh sách bài */
#nowIcon{width:68px;height:68px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:34px!important;filter:none!important;background:linear-gradient(145deg,rgba(251,215,122,.28),rgba(251,215,122,.05));border:1px solid rgba(251,215,122,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 26px -10px rgba(244,184,66,.6);flex-shrink:0}

.track-row:active{background:rgba(255,255,255,.12);transform:scale(.97)}
.track-row.playing{background:linear-gradient(145deg,rgba(251,215,122,.22),rgba(251,215,122,.05));border-color:rgba(251,215,122,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 28px -10px rgba(251,215,122,.6)}

/* Mini player: viên kính nổi */
#miniPlayer{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;padding:10px 12px 10px 14px;border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.05) 55%,rgba(255,255,255,.10));border:1px solid rgba(255,255,255,.28);-webkit-backdrop-filter:blur(30px) saturate(200%);backdrop-filter:blur(30px) saturate(200%);box-shadow:var(--lg-spec),0 20px 50px -12px rgba(0,0,0,.9)}

.mp-btn{background:linear-gradient(180deg,#ffe59f,#f6bd45)!important;color:#1d1300!important;border:0!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -2px 6px rgba(160,95,0,.25),0 10px 24px -8px rgba(244,184,66,.7)!important;transition:transform var(--spring),filter var(--ease)}

.mp-btn:active{transform:scale(.88)}

/* Kho game */
.game-menu-btn{border:1px solid var(--lg-edge);border-radius:26px;padding:24px 16px;background:var(--lg-fill);-webkit-backdrop-filter:var(--lg-blur);backdrop-filter:var(--lg-blur);box-shadow:var(--lg-spec),var(--lg-shadow);transition:transform var(--spring),background var(--ease),box-shadow var(--ease)}
.game-menu-btn::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(120% 70% at 15% -10%,rgba(255,255,255,.16),transparent 55%)}

.game-menu-btn:active{transform:scale(.95)}
.game-menu-btn[style]{background:linear-gradient(145deg,rgba(244,114,182,.24),rgba(255,255,255,.04))!important;border-color:rgba(244,114,182,.5)!important}
.game-menu-btn .gm-icon{width:64px;height:64px;display:flex;align-items:center;justify-content:center;border-radius:21px;filter:none;color:#ffe29a;background:linear-gradient(145deg,rgba(251,215,122,.28),rgba(251,215,122,.05));border:1px solid rgba(251,215,122,.42);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 24px -10px rgba(244,184,66,.6)}
.game-menu-btn[style] .gm-icon{color:#ffb3d4;background:linear-gradient(145deg,rgba(244,114,182,.32),rgba(244,114,182,.06));border-color:rgba(244,114,182,.5)}
.game-menu-btn .gm-icon .ic{width:32px;height:32px}
.game-menu-btn .gm-title{letter-spacing:.04em}
.game-menu-btn .gm-sub{color:var(--lg-ink2);font-style:normal}
.game-back-btn{min-height:44px;padding:0 18px;border-radius:99px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3);-webkit-backdrop-filter:var(--lg-blur);backdrop-filter:var(--lg-blur);transition:transform var(--spring),background var(--ease)}
.game-back-btn .ic{margin:0 .4em 0 0}
.game-frame-wrap{background:#000;border:1px solid var(--lg-edge);border-radius:26px;box-shadow:var(--lg-spec),0 20px 50px -14px rgba(0,0,0,.9)}
.game-frame-wrap iframe,.game-loading,#gameIframeView.fullscreen{background:#000}
#gameIframeView.fullscreen .game-back-btn{background:rgba(0,0,0,.7);border-radius:0;border:0;border-bottom:1px solid rgba(255,255,255,.12);justify-content:flex-start}
.game-loading .spin{border-color:rgba(255,255,255,.15);border-top-color:#FBD77A}

/* Bảng xếp hạng */
.btn-outline{border-radius:99px;min-height:36px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3);transition:transform var(--spring),background var(--ease)}
.btn-outline:hover{background:rgba(255,255,255,.16)}
.btn-outline .ic{width:1em;height:1em;margin-right:.35em}
.lb-table thead tr{border-bottom:1px solid rgba(255,255,255,.2)}
.lb-table tbody tr{border-bottom:1px solid rgba(255,255,255,.07)}
.lb-table tbody tr.me{background:linear-gradient(90deg,rgba(251,215,122,.20),rgba(251,215,122,.04))}
.lb-table td.rank.top{font-size:12px}
.medal{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:12px;font-weight:900;color:#1d1300;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 12px -3px rgba(0,0,0,.6)}
.m1{background:linear-gradient(145deg,#ffe59f,#f4b842);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 0 16px -2px rgba(251,215,122,.7)}
.m2{background:linear-gradient(145deg,#f1f4f8,#aab4c2)}
.m3{background:linear-gradient(145deg,#f3c79c,#c27a3e)}
.text-center .ic,.lb-empty .ic{width:1.1em;height:1.1em}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass,.game-menu-btn,#miniPlayer{background:rgba(24,36,36,.95)}}

/* Mobile arcade launcher, inspired by an app drawer */
.arcade-menu{padding-bottom:calc(136px + env(safe-area-inset-bottom,0px))}
.arcade-featured{display:flex;align-items:center;gap:14px;width:100%;min-height:124px;text-align:left;padding:17px;border-radius:25px;margin-bottom:22px;cursor:pointer;font-family:inherit;color:#fff;border:1px solid rgba(246,200,119,.6);background:radial-gradient(circle at 14% 50%,rgba(251,154,83,.25),transparent 46%),linear-gradient(125deg,#31202d,#111c29 70%);box-shadow:0 12px 32px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.1)}
.featured-art{display:grid;place-items:center;width:78px;height:78px;flex:0 0 78px;font-size:46px;border-radius:22px;background:linear-gradient(140deg,#5a2d4b,#291a3b);border:1px solid rgba(255,203,130,.34);filter:drop-shadow(0 5px 12px rgba(0,0,0,.3))}
.featured-info{display:flex;flex-direction:column;gap:6px;min-width:0}
.featured-kicker{font-size:9px;letter-spacing:.13em;font-weight:900;color:#ffd58b}
.featured-title{font-size:clamp(16px,4vw,22px);font-weight:900;line-height:1.12;letter-spacing:.03em}
.featured-sub{font-size:11px;font-weight:700;color:#b7cbc9}
.featured-arrow{margin-left:auto;font-size:32px;color:#ffd58b}
.arcade-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:10px;row-gap:22px;padding:4px 0 15px}
.arcade-app{appearance:none;min-width:0;display:flex;flex-direction:column;align-items:center;gap:9px;padding:3px 0 7px;border:0;background:none;font-family:inherit;color:#f6f7fa;cursor:pointer}
.arcade-icon{width:min(21vw,82px);height:min(21vw,82px);min-width:58px;min-height:58px;max-width:82px;max-height:82px;border-radius:23%;display:flex;justify-content:center;align-items:center;gap:1px;font-weight:900;font-size:35px;line-height:1;box-shadow:0 8px 18px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.23);border:1px solid rgba(255,255,255,.16);transition:transform .15s}
.arcade-app:active .arcade-icon,.arcade-featured:active{transform:scale(.95)}
.arcade-app:focus-visible,.arcade-featured:focus-visible{outline:2px solid #fbd77a;outline-offset:4px}
.arcade-label{font-size:11px;font-weight:800;line-height:1.2;text-align:center;min-height:26px;max-width:100%;overflow-wrap:break-word}
.icon-caro{background:linear-gradient(145deg,#267d78,#133a56);color:#fff5d8}.icon-caro span{color:#ffca76;font-size:30px}
.icon-chess{background:linear-gradient(145deg,#373c5d,#111629);color:#ffe7af}
.icon-xiangqi{background:linear-gradient(145deg,#8e3934,#46141c);color:#ffe6b1}
.icon-ship{background:linear-gradient(145deg,#2a84b6,#12334d);color:#dcf7ff}
.icon-snake-coop{background:linear-gradient(145deg,#77448a,#3a235e)}
.icon-snake{background:linear-gradient(145deg,#3a854d,#153925);color:#d3ffa4}
.icon-2048{background:linear-gradient(145deg,#d98c42,#87502d);color:#fff6e3;font-size:22px}
@media(min-width:430px){.arcade-grid{grid-template-columns:repeat(4,minmax(0,1fr));column-gap:12px}}
@media(max-width:345px){.arcade-grid{column-gap:5px}.arcade-icon{min-width:56px;min-height:56px}.arcade-label{font-size:10px}.arcade-featured{padding:12px;gap:9px}.featured-art{width:64px;height:64px;flex-basis:64px;font-size:38px}}
@media(prefers-reduced-motion:reduce){.arcade-icon{transition:none}}
/* Android TFT opens in a viewport-height frame, with back navigation retained. */
#gameIframeView.tactics-apk-open{position:fixed!important;inset:0!important;z-index:9999!important;display:flex!important;flex-direction:column!important;overflow:hidden!important;background:#071824!important;padding:0!important;margin:0!important}
#gameIframeView.tactics-apk-open .game-frame-wrap{flex:1 1 0!important;min-height:0!important;height:auto!important;overflow:hidden!important}
#gameIframeView.tactics-apk-open iframe{width:100%!important;height:100%!important;touch-action:auto!important}
</style>

<body>

<div class="sticky top-0 z-30 bg-[#0a1f1d]/95 backdrop-blur-xl border-b border-emerald-800/40">
  <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
    <button onclick="goBack()" class="w-10 h-10 rounded-xl bg-teal-900/60 border border-teal-700/50 flex items-center justify-center text-teal-300 text-lg active:scale-95"><i class="ic ic-back"></i></button>
    <div class="text-center flex-1">
      <h1 class="brand-title text-lg leading-none">DOLPHIN</h1>
      <p class="text-[9px] text-teal-400 uppercase font-bold tracking-widest mt-1">Giải Trí</p>
    </div>
    <button class="w-10 h-10 rounded-xl opacity-0 pointer-events-none"></button>
  </div>
</div>

<div class="max-w-2xl mx-auto px-4 pt-5">

  <div class="tab-switcher">
    <button class="tab-btn active" data-tab="music" onclick="showTab('music')">
      <span><i class="ic ic-music"></i></span> NGHE NHẠC
    </button>
    <button class="tab-btn" data-tab="game" onclick="showTab('game')">
      <span><i class="ic ic-gamepad"></i></span> KHO GAME
    </button>
    <button class="tab-btn" data-tab="leaderboard" onclick="showTab('leaderboard')">
      <span><i class="ic ic-trophy"></i></span> XẾP HẠNG
    </button>
  </div>

  <div id="tab-music" class="tab-content">
    <div class="glass rounded-2xl p-5 mb-4" style="background:linear-gradient(135deg,rgba(26,74,69,.9),rgba(13,42,40,.9));border:2px solid rgba(244,184,66,.4)">
      <div class="flex items-center gap-4">
        <div id="nowIcon" style="font-size:52px;filter:drop-shadow(0 4px 12px rgba(244,184,66,.5))">🎵</div>
        <div class="flex-1 min-w-0">
          <div style="font-size:9.5px;color:#7ec9be;font-weight:800;letter-spacing:.15em;text-transform:uppercase">Đang phát</div>
          <div id="nowTitle" style="font-size:17px;font-weight:900;color:#FBD77A;margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Chưa phát</div>
          <div id="nowSub" style="font-size:11px;color:#bfe9dc;font-weight:700;opacity:.8">Chọn bài bên dưới</div>
        </div>
        <button id="bigPlayBtn" onclick="toggleMusic()" class="mp-btn" style="width:56px;height:56px;font-size:22px"><i class="ic ic-play"></i></button>
      </div>
      <div style="margin-top:16px;display:flex;align-items:center;gap:10px">
        <span style="font-size:16px;display:flex;color:#FBD77A"><i class="ic ic-volume"></i></span>
        <input id="musicVol" type="range" min="0" max="100" class="vol-slider" oninput="onVolChange(this.value)">
        <span id="musicVolPct" style="font-size:11px;color:#FBD77A;font-weight:900;min-width:36px;text-align:right">30%</span>
      </div>
    </div>

    <div class="mode-switcher">
      <button id="modeAuto" class="mode-btn" onclick="setMode('auto')">
        <span style="font-size:20px;display:flex"><i class="ic ic-music"></i></span>
        <span>Theo chủ đề</span>
        <span class="mode-sub">Tự đổi theo lễ</span>
      </button>
      <button id="modeManual" class="mode-btn" onclick="setMode('manual')">
        <span style="font-size:20px;display:flex"><i class="ic ic-target"></i></span>
        <span>Tự chọn</span>
        <span class="mode-sub">Cố định 1 bài</span>
      </button>
    </div>

    <div class="glass rounded-2xl p-4">
      <div style="font-size:12px;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;display:flex;align-items:center;gap:8px">
        <span class="sec-ic"><i class="ic ic-list"></i></span> DANH SÁCH BÀI HÁT
        <span style="font-size:10px;color:#7ec9be;font-weight:700;text-transform:none;letter-spacing:0;margin-left:auto;opacity:.7" id="trackCountLbl">15 bài</span>
      </div>
      <div id="trackList"></div>
    </div>
  </div>

  <div id="tab-game" class="tab-content hidden">
    <div id="gameMenuView" class="arcade-menu">
      <button class="arcade-featured" onclick="openGame('dolphin-tactics-online')" aria-label="Chơi Dolphin Tactics 3D">
        <span class="featured-art" aria-hidden="true">🐉</span>
        <span class="featured-info"><span class="featured-kicker">GAME NỔI BẬT · ONLINE</span><span class="featured-title">DOLPHIN TACTICS 3D</span><span class="featured-sub">4 người online · 30 tướng</span></span>
        <span class="featured-arrow" aria-hidden="true">›</span>
      </button>
      <div class="arcade-grid" aria-label="Danh sách trò chơi">
        <button class="arcade-app" onclick="openGame('caro')"><span class="arcade-icon icon-caro">✕<span>◯</span></span><span class="arcade-label">Cờ Caro</span></button>
        <button class="arcade-app" onclick="openGame('chess')"><span class="arcade-icon icon-chess">♛</span><span class="arcade-label">Cờ Vua</span></button>
        <button class="arcade-app" onclick="openGame('xiangqi')"><span class="arcade-icon icon-xiangqi">將</span><span class="arcade-label">Cờ Tướng</span></button>
        <button class="arcade-app" onclick="openGame('battleship')"><span class="arcade-icon icon-ship"><i class="ic ic-ship"></i></span><span class="arcade-label">Battleship</span></button>

    <div id="gameIframeView" class="hidden">

      <button class="tab-btn" data-lb="game2048" onclick="showLB('game2048')"><span><i class="ic ic-hash"></i></span> 2048</button>

      <div class="flex items-center justify-between mb-3">
        <h3 class="text-[11px] font-black text-white uppercase tracking-widest flex items-center gap-2">
          <span id="lbGameIcon"><i class="ic ic-snake"></i></span> <span id="lbGameTitle">RẮN SĂN MỒI</span>
        </h3>

        <i class="ic ic-bulb"></i> TFT online: thống kê trận thường · Hạng 1/2/3/4: 25/18/12/6 điểm · Không tính trận Offline

<div id="miniPlayer" class="hide">

<script>
(function(){
  'use strict';

  var currentGame = null;
  var GAME_URLS = {
    'dolphin-tactics-online':'games/tactics-online/index.html',
    'caro':              'games/caro.html',
    'chess':             'games/chess.html',
    'game2048':          'games/game2048.html',
    'battleship':        'games/battleship.html',
    'snake':             'games/snake.html',
    'snake-coop-online': 'games/snake-coop-online.html',
    'xiangqi':           'games/xiangqi.html'
  };
  var LOCK_SCROLL_GAMES = ['snake', 'snake-coop', 'snake-coop-online', 'xiangqi'];

  window.showTab = function(name){
    document.querySelectorAll('.tab-content').forEach(function(el){ el.classList.add('hidden'); });
    var target = document.getElementById('tab-' + name);
    if (target) target.classList.remove('hidden');
    document.querySelectorAll('.tab-switcher > .tab-btn').forEach(function(el){
      if (el.closest('#lbGameTabs')) return;
      el.classList.toggle('active', el.dataset.tab === name);
    });
    if (name !== 'game' && currentGame) closeGame();
    if (name === 'leaderboard' && typeof window.refreshLB === 'function') window.refreshLB();
    updateMiniPlayer();
  };

   window.openGame = function(gameKey){
    var url = GAME_URLS[gameKey];
    if (!url){ alert('Game không tồn tại: ' + gameKey); return; }
    currentGame = gameKey;
    // Embedded TFT needs a viewport-sized iframe from the moment it opens.
    // Keep the parent back button visible on the landing screen.
    var gameView=document.getElementById('gameIframeView');
    if(gameKey==='dolphin-tactics-online' && /DolphinStaff|DolphinManager/i.test(navigator.userAgent||'')){
      gameView.classList.add('fullscreen','tactics-apk-open');
      gameView.classList.remove('tactics-immersive');
    }
    // APK: landscape is reserved for TFT; all other app surfaces remain portrait.
    try { if (window.AndroidGame) {
      if (gameKey === 'dolphin-tactics-online') window.AndroidGame.enterLandscapeFullscreen();
      else window.AndroidGame.exitLandscapeFullscreen();
    }} catch(e) { console.warn('[Arcade] orientation',e); }

    // ✅ Khóa scroll + fullscreen cho Snake
    if (LOCK_SCROLL_GAMES.indexOf(gameKey) !== -1){
      document.documentElement.classList.add('game-locked');
      document.body.classList.add('game-locked');
      window.scrollTo(0, 0);
      document.getElementById('gameIframeView').classList.add('fullscreen');
    }

    document.getElementById('gameMenuView').classList.add('hidden');
    document.getElementById('gameIframeView').classList.remove('hidden');

    // ✅ Ẩn mini player ngay
    var mp = document.getElementById('miniPlayer');
    if (mp) mp.classList.add('hide');

    var frame = document.getElementById('gameFrame');
    var loading = document.getElementById('gameLoading');
    if (loading) loading.classList.remove('hide');
    if (!frame) return;
    var done = false;
    var onLoad = function(){
      if (done) return; done = true;
      frame.removeEventListener('load', onLoad);
      setTimeout(function(){ if (loading) loading.classList.add('hide'); }, 300);
    };
    frame.addEventListener('load', onLoad);
    frame.src = url;
    setTimeout(function(){
      if (done) return; done = true;
      if (loading) loading.classList.add('hide');
    }, 8000);
  };
  // Safe same-origin message from Dolphin Tactics embedded iframe; Android WebView fallback.
  window.addEventListener('message',function(ev){
    var frame=document.getElementById('gameFrame');
    if(!frame||ev.source!==frame.contentWindow||ev.origin!==location.origin)return;
    if(!ev.data||!['dolphin-tactics-fullscreen','dolphin-arcade-fullscreen'].includes(ev.data.type))return;
    if(ev.data.type==='dolphin-tactics-fullscreen' && currentGame!=='dolphin-tactics-online')return;
    var view=document.getElementById('gameIframeView');
    if(!view)return;
    var isTft=currentGame==='dolphin-tactics-online';
    var apkTft=isTft && /DolphinStaff|DolphinManager/i.test(navigator.userAgent||'');
    view.classList.toggle('fullscreen',apkTft||!!ev.data.enabled);
    // Preserve a visible parent exit button while still on the TFT lobby.
    view.classList.toggle('tactics-immersive',!!ev.data.enabled && !!ev.data.inGame);
    // Only the same-origin Tactics frame can request native immersive mode.
    // Android host must explicitly provide this bridge in its APK build.
    try {
      var androidBridge=window.AndroidGame;
      if(androidBridge){
        if(currentGame==='dolphin-tactics-online'){
          if(typeof androidBridge.enterLandscapeFullscreen==='function')androidBridge.enterLandscapeFullscreen();
        }
      }
    } catch(err){ console.warn('[Arcade] Native fullscreen bridge unavailable',err); }
  });
  window.closeGame = function(){
    if (!currentGame) return;
    try { window.AndroidGame?.exitLandscapeFullscreen?.(); } catch(e) { console.warn('[Arcade] portrait restore',e); }
    currentGame = null;
    var frame = document.getElementById('gameFrame');
    if (frame) frame.src = 'about:blank';
    document.getElementById('gameIframeView').classList.add('hidden');
    document.getElementById('gameIframeView').classList.remove('fullscreen'); // ✅ tắt fullscreen
    document.getElementById('gameIframeView').classList.remove('tactics-immersive','tactics-apk-open');
    document.getElementById('gameMenuView').classList.remove('hidden');
    document.documentElement.classList.remove('game-locked');
    document.body.classList.remove('game-locked');
    // ✅ Khôi phục mini player nếu nhạc đang phát
    if (typeof updateMiniPlayer === 'function') updateMiniPlayer();
  };

  function DS(){ return window.DolphinSound; }

  function renderMusicUI(){
    var ds = DS(); if (!ds) return;
    var tracks = ds.getTracks();
    if (!tracks.length) return;
    var currentKey = ds.getTrack();
    var isPlaying = ds.isPlaying();
    var mode = ds.getMode();
    var nowTrack = tracks.find(function(t){ return t.key === currentKey; }) || tracks[0];
    var nowIcon = document.getElementById('nowIcon');
    var nowTitle = document.getElementById('nowTitle');
    var nowSub = document.getElementById('nowSub');
    if (nowIcon) nowIcon.textContent = nowTrack.icon;
    if (nowTitle) nowTitle.textContent = nowTrack.label;
    if (nowSub) nowSub.textContent = nowTrack.sub + ' · ' + (isPlaying ? 'Đang phát' : 'Tạm dừng');
    var big = document.getElementById('bigPlayBtn');
    if (big) big.innerHTML = isPlaying ? '<i class="ic ic-pause"></i>' : '<i class="ic ic-play"></i>';
    var mAuto = document.getElementById('modeAuto');
    var mManual = document.getElementById('modeManual');
    if (mAuto) mAuto.classList.toggle('active', mode === 'auto');
    if (mManual) mManual.classList.toggle('active', mode === 'manual');
    var vol = document.getElementById('musicVol');
    var pct = document.getElementById('musicVolPct');
    var v = Math.round(ds.getVolume() * 100);
    if (vol && document.activeElement !== vol) vol.value = String(v);
    if (pct) pct.textContent = v + '%';
    var cnt = document.getElementById('trackCountLbl');
    if (cnt) cnt.textContent = tracks.length + ' bài';
    var list = document.getElementById('trackList');
    if (list){
      list.innerHTML = tracks.map(function(t){
        var playing = t.key === currentKey && isPlaying;
        var isCurrent = t.key === currentKey;
        return '<div class="track-row ' + (isCurrent ? 'playing' : '') + '" onclick="pickTrack(\'' + t.key + '\')">'
          + '<div class="track-icon">' + t.icon + '</div>'
          + '<div class="track-info">'
          + '<div class="track-label">' + t.label + '</div>'
          + '<div class="track-sub">' + t.sub + '</div>'
          + '</div>'
          + (playing ? '<div class="track-eq"><span></span><span></span><span></span><span></span></div>' : (isCurrent ? '<div style="font-size:18px;color:#FBD77A;display:flex"><i class="ic ic-pause"></i></div>' : ''))
          + '</div>';
      }).join('');
    }
    updateMiniPlayer();
  }

  window.__giaitriSyncMusicUI = renderMusicUI;
  window.pickTrack = function(key){ var ds = DS(); if (!ds) return; ds.setTrack(key); renderMusicUI(); };
  window.setMode = function(m){ var ds = DS(); if (!ds) return; ds.setMode(m); renderMusicUI(); };
  window.toggleMusic = function(){
    var ds = DS(); if (!ds) return;
    if (ds.isEnabled() && ds.isPlaying()) ds.disable(); else ds.enable();
    renderMusicUI();
  };
  window.onVolChange = function(v){
    var ds = DS(); if (!ds) return;
    ds.setVolume(parseInt(v, 10) / 100);
    var pct = document.getElementById('musicVolPct');
    if (pct) pct.textContent = v + '%';
  };
  window.nextTrack = function(){
    var ds = DS(); if (!ds) return;
    var tracks = ds.getTracks(); var cur = ds.getTrack();
    var idx = tracks.findIndex(function(t){ return t.key === cur; });
    if (idx < 0) idx = 0;
    ds.setTrack(tracks[(idx + 1) % tracks.length].key); renderMusicUI();
  };
  window.prevTrack = function(){
    var ds = DS(); if (!ds) return;
    var tracks = ds.getTracks(); var cur = ds.getTrack();
    var idx = tracks.findIndex(function(t){ return t.key === cur; });
    if (idx < 0) idx = 0;
    ds.setTrack(tracks[(idx - 1 + tracks.length) % tracks.length].key); renderMusicUI();
  };

  function updateMiniPlayer(){
    var mp = document.getElementById('miniPlayer');
    if (!mp) return;

    // ✅ Ẩn mini player khi đang mở bất kỳ game iframe nào
    if (currentGame){ mp.classList.add('hide'); return; }

    var ds = DS();
    if (!ds){ mp.classList.add('hide'); return; }
    var tabMusic = document.getElementById('tab-music');
    var isMusicTab = tabMusic && !tabMusic.classList.contains('hidden');
    var isPlaying = ds.isPlaying();
    if (isPlaying && !isMusicTab){
      var tracks = ds.getTracks();
      var cur = ds.getTrack();
      var t = tracks.find(function(x){ return x.key === cur; }) || tracks[0];
      var icon = document.getElementById('mpIcon');
      var title = document.getElementById('mpTitle');
      var sub = document.getElementById('mpSub');
      var btn = document.getElementById('mpPlayBtn');
      if (icon) icon.textContent = t.icon;
      if (title) title.textContent = t.label;
      if (sub) sub.textContent = t.sub;
      if (btn) btn.innerHTML = '<i class="ic ic-pause"></i>';
      mp.classList.remove('hide');
    } else {
      mp.classList.add('hide');
    }
  }

  setInterval(function(){
    var tabMusic = document.getElementById('tab-music');
    if (tabMusic && !tabMusic.classList.contains('hidden')) renderMusicUI();
    else updateMiniPlayer();
  }, 1500);

  function initMusicUI(){
    if (!window.DolphinSound){ setTimeout(initMusicUI, 150); return; }
    renderMusicUI();
  }
  setTimeout(initMusicUI, 400);
})();
</script>

<script>
(function(){
  'use strict';
  var currentLBGame = 'snake', renderVersion = 0;
  var LB_META = {
    snake:              { icon: '<i class="ic ic-snake"></i>',   title: 'RẮN SĂN MỒI',      type: 'score' },
    'snake-coop-online':{ icon: '<i class="ic ic-snake2"></i>',   title: 'RẮN ĐÔI ONLINE',   type: 'score' },
    battleship:         { icon: '<i class="ic ic-ship"></i>',   title: 'BATTLESHIP',        type: 'win' },
    chess:              { icon: '<i class="ic ic-crown"></i>',    title: 'CỜ VUA',            type: 'win' },
    game2048:           { icon: '<i class="ic ic-hash"></i>',   title: '2048',              type: 'score' },
    xiangqi:            { icon: '<i class="ic ic-shield"></i>',   title: 'CỜ TƯỚNG',          type: 'win' },
    caro:               { icon: '<i class="ic ic-gamepad"></i>',   title: 'CỜ CARO',           type: 'win' },
    'dolphin-tactics':{ icon: '⚔️', title: 'DOLPHIN TACTICS · XẾP HẠNG ONLINE', type: 'tft' }
  };

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  }); }

  function waitForLB(cb, tries){
    tries = tries || 0;
    if (window.DolphinLeaderboard) return cb();
    if (tries > 40) return cb();
    setTimeout(function(){ waitForLB(cb, tries + 1); }, 250);
  }

  window.showLB = function(game){
    currentLBGame = game;
    document.querySelectorAll('#lbGameTabs .tab-btn').forEach(function(b){
      b.classList.toggle('active', b.dataset.lb === game);
    });
    var meta = LB_META[game] || LB_META.snake;
    var icon = $('lbGameIcon'); if (icon) icon.innerHTML = meta.icon;
    var title = $('lbGameTitle'); if (title) title.textContent = meta.title;
    renderLB(game);
  };

  window.refreshLB = function(){
    if (window.DolphinLeaderboard) window.DolphinLeaderboard.invalidate(currentLBGame);
    renderLB(currentLBGame);
  };

  async function renderLB(game){
    var el = $('lbContent'), requestVersion = ++renderVersion;
    if (!el) return;
    el.innerHTML = '<div class="text-center py-8 text-teal-400 text-[12px] font-bold">Đang tải...</div>';
    waitForLB(async function(){
      var LB = window.DolphinLeaderboard;
      if (!LB){
        el.innerHTML = '<div class="text-center py-8 text-red-400 text-[12px] font-bold"><i class="ic ic-alert"></i> Chưa kết nối Firebase</div>';
        return;
      }
      var rows = await LB.getLeaderboard(game, 30);
      if(requestVersion !== renderVersion || game !== currentLBGame)return;
      if(LB.lastError && LB.lastError(game)){
        el.innerHTML = '<div role="alert" class="text-center py-8 text-red-400 text-[12px]">Chưa tải được dữ liệu: '+esc(LB.lastError(game))+'<br>Nhấn Làm mới để thử lại.</div>';return;
      }
      var meta = LB_META[game] || LB_META.snake;
      var myName = LB.getStaffName();

      if (!rows || !rows.length){
        el.innerHTML = '<div class="text-center py-10 text-teal-500 text-[12px] font-bold leading-relaxed">'
          + '<div style="font-size:40px;opacity:.6;margin-bottom:6px">' + meta.icon + '</div>'
          + 'Chưa có ai chơi game này<br>'
          + '<span style="font-size:10.5px;opacity:.7">Hãy là người đầu tiên!</span></div>';
        return;
      }

      var html = '<div style="overflow-x:auto"><table class="lb-table'+(meta.type === 'tft'?' tftRanks':'')+'"><thead><tr>';
      html += '<th>#</th><th>Người chơi</th>';
      if (meta.type === 'tft'){
        html += '<th class="num">Điểm</th><th class="num">Top 1</th><th class="num">Trận</th><th class="num">Hạng TB</th>';
      } else if (meta.type === 'win'){
        html += '<th style="text-align:center">Thắng</th>';
        html += '<th style="text-align:center">Thua</th>';
        html += '<th style="text-align:center">Tỉ lệ</th>';
      } else {
        html += '<th class="num">Cao nhất</th>';
        html += '<th class="num">Tổng</th>';
        html += '<th class="num">Ván</th>';
      }
      html += '</tr></thead><tbody>';

      rows.forEach(function(r, i){
        var isMe = r.player === myName;
        var medal = i < 3 ? '<span class="medal m' + (i + 1) + '">' + (i + 1) + '</span>' : String(i + 1);
        html += '<tr class="' + (isMe ? 'me' : '') + '">';
        html += '<td class="rank ' + (i < 3 ? 'top' : '') + '">' + medal + '</td>';
        html += '<td class="' + (isMe ? 'me' : '') + '">' + esc(r.player) + (isMe ? ' <span style="font-size:9px;opacity:.7">(BẠN)</span>' : '') + '</td>';
        if (meta.type === 'tft'){
          html += '<td class="num gold">' + (r.totalScore || 0) + '</td>';
          html += '<td class="num good">' + (r.wins || 0) + '</td>';
          html += '<td class="num">' + (r.totalGames || 0) + '</td>';
          html += '<td class="num">' + (r.totalGames ? ((r.totalPlacement || 0)/r.totalGames).toFixed(2) : '—') + '</td>';
        } else if (meta.type === 'win'){
          var total = (r.wins || 0) + (r.losses || 0);
          var rate = total > 0 ? Math.round((r.wins || 0) / total * 100) : 0;
          html += '<td class="num good">' + (r.wins || 0) + '</td>';
          html += '<td class="num bad">' + (r.losses || 0) + '</td>';
          html += '<td class="num gold">' + rate + '%</td>';
        } else {
          html += '<td class="num gold">' + (r.bestScore || 0) + '</td>';
          html += '<td class="num" style="color:#7ec9be">' + (r.totalScore || 0) + '</td>';
          html += '<td class="num" style="color:#7ec9be">' + (r.totalGames || 0) + '</td>';
        }
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      el.innerHTML = html;
    });
  }

  window.addEventListener('message',function(event){
    if(event.origin !== location.origin || event.source !== document.getElementById('gameFrame').contentWindow)return;
    if(event.data?.type === 'dolphin-tactics-open-ranking'){window.closeGame();window.showTab('leaderboard');window.showLB('dolphin-tactics');}
    if(event.data?.type === 'dolphin-tactics-result-synced'){window.DolphinLeaderboard?.invalidate('dolphin-tactics');if(currentLBGame === 'dolphin-tactics')renderLB(currentLBGame);}
  });
  window.addEventListener('storage',function(event){if(event.key === 'dolphin_tft_result_synced' && currentLBGame === 'dolphin-tactics')window.refreshLB();});
  window.addEventListener('online',function(){window.DolphinLeaderboard?.flushTacticsResults().then(function(){window.refreshLB();});});
  window.DolphinLeaderboard?.flushTacticsResults().then(function(){if(currentLBGame === 'dolphin-tactics')window.refreshLB();});
  if(location.hash === '#tft-ranking'){
    window.addEventListener('load',function(){showTab('leaderboard');showLB('dolphin-tactics');},{once:true});
  }
  setInterval(function(){
    var tab = document.getElementById('tab-leaderboard');
    if (tab && !tab.classList.contains('hidden')) renderLB(currentLBGame);
  }, 25000);
})();
</script>
