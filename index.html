<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#123634">
<title>Dolphin HaLong Cruise</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============ LOGO ============ */
.logo-img{
  animation: logoIn 1.2s cubic-bezier(.16,1,.3,1) both,
             logoBreathe 5s ease-in-out infinite 1.5s;
}
@keyframes logoIn{
  0%{opacity:0;transform:scale(.85) translateY(20px);filter:blur(10px) brightness(1.5)}
  100%{opacity:1;transform:scale(1) translateY(0);filter:blur(0) brightness(1.05)}
}
@keyframes logoBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@media(prefers-reduced-motion:reduce){ .logo-img{animation:none} }

/* ============ SKELETON ============ */
.area-card.skeleton{
  pointer-events:none;
  background:rgba(25,71,67,.35)!important;
  border:1px dashed rgba(244,184,66,.15)!important;
  position:relative;overflow:hidden;
}
.area-card.skeleton > *{ visibility:hidden!important; }
.area-card.skeleton::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(90deg,
    rgba(25,71,67,0) 0%,
    rgba(78,205,196,.14) 45%,
    rgba(244,184,66,.10) 55%,
    rgba(25,71,67,0) 100%);
  background-size:200% 100%;
  animation:skeletonShimmer 1.5s ease-in-out infinite;
  pointer-events:none;z-index:3;
}
@keyframes skeletonShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ============ NOTIF BADGE ============ */
.area-notif-badge{
  position:absolute;top:.6rem;left:.85rem;
  background:linear-gradient(135deg,#EF4444,#B91C1C);
  color:#fff;font-size:.6rem;font-weight:900;letter-spacing:.06em;
  padding:4px 9px;border-radius:99px;
  display:none;align-items:center;gap:5px;
  box-shadow:0 4px 12px rgba(239,68,68,.6),0 0 0 2px rgba(239,68,68,.25);
  z-index:6;text-transform:uppercase;font-family:'Nunito',sans-serif;
  animation:notifPulse 1.4s ease-in-out infinite;
}
.area-notif-badge.show{display:inline-flex}
.area-notif-badge .nb-dot{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff}
@keyframes notifPulse{
  0%,100%{transform:scale(1);box-shadow:0 4px 12px rgba(239,68,68,.6),0 0 0 2px rgba(239,68,68,.25)}
  50%{transform:scale(1.08);box-shadow:0 6px 20px rgba(239,68,68,.9),0 0 0 4px rgba(239,68,68,.35)}
}
@media(prefers-reduced-motion:reduce){ .area-notif-badge{animation:none} }

/* ============ HALONG CLOCK (cố định — không kéo thả) ============ */
#halongClock{
  position:relative;display:flex;align-items:center;gap:12px;
  max-width:min(92vw,560px);margin:0 auto clamp(1.25rem,2.5vw,2rem);
  padding:12px 20px;border-radius:18px;
  background:linear-gradient(135deg,rgba(15,61,56,.75),rgba(10,43,40,.85));
  border:2px solid rgba(244,184,66,.55);
  box-shadow:0 8px 32px rgba(0,0,0,.5),0 0 40px rgba(244,184,66,.25),
             inset 0 0 30px rgba(244,184,66,.06);
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  overflow:hidden;isolation:isolate;font-family:'Nunito',sans-serif;
}
#halongClock .hclock-glow{
  position:absolute;inset:-50%;pointer-events:none;z-index:-1;
  background:radial-gradient(circle at 30% 50%,rgba(244,184,66,.18),transparent 60%),
             radial-gradient(circle at 70% 50%,rgba(78,205,196,.12),transparent 60%);
}
#halongClock .hclock-icon{
  font-size:28px;line-height:1;flex-shrink:0;
  filter:drop-shadow(0 0 12px rgba(244,184,66,.8));
}
#halongClock .hclock-body{flex:1;min-width:0;text-align:left}
#halongClock .hclock-time{
  display:flex;align-items:baseline;gap:2px;
  font-weight:900;line-height:1;font-variant-numeric:tabular-nums;
  color:#FBD77A;letter-spacing:.02em;
  text-shadow:0 0 12px rgba(244,184,66,.65),0 0 24px rgba(244,184,66,.35);
  font-size:clamp(1.6rem,4.5vw,2.4rem);
}
#halongClock .hclock-h,
#halongClock .hclock-m,
#halongClock .hclock-s{
  font-family:'Fraunces','Nunito',serif;font-weight:900;
}
#halongClock .hclock-s{font-size:.55em;opacity:.85;margin-left:2px;color:#bfe9dc}
#halongClock .hclock-sep{opacity:.55;font-weight:700;font-size:.85em}
#halongClock .hclock-sep-s{font-size:.55em;opacity:.5}
#halongClock .hclock-date{
  font-size:clamp(.7rem,1.6vw,.82rem);
  color:#bfe9dc;font-weight:700;margin-top:5px;
  letter-spacing:.03em;opacity:.92;
}
#halongClock .hclock-loc{
  display:flex;align-items:center;gap:6px;
  padding-left:12px;border-left:1px solid rgba(244,184,66,.3);
  flex-shrink:0;text-align:left;
}
#halongClock .hclock-loc-icon{font-size:18px;filter:drop-shadow(0 0 6px rgba(244,184,66,.7))}
#halongClock .hclock-loc-text{
  font-size:clamp(.62rem,1.4vw,.72rem);
  font-weight:800;color:#FBD77A;letter-spacing:.04em;
  text-transform:uppercase;line-height:1.3;
  text-shadow:0 0 8px rgba(244,184,66,.5);
}
@media(max-width:480px){
  #halongClock{padding:10px 14px;gap:8px}
  #halongClock .hclock-icon{font-size:22px}
  #halongClock .hclock-loc{padding-left:8px}
  #halongClock .hclock-loc-text{font-size:.6rem}
}

/* ============ NÚT NHẠC FLOATING (kéo thả tự do) ============ */
#dolphinMusicBtn{
  position:fixed;top:14px;right:14px;z-index:9997;
  width:52px;height:52px;border-radius:50%;
  background:rgba(18,54,52,.92);
  border:2px solid rgba(244,184,66,.7);
  color:#FBD77A;font-size:22px;
  cursor:grab;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 6px 20px rgba(0,0,0,.5);
  transition:transform .15s,box-shadow .15s,background .2s;
  padding:0;
  user-select:none;-webkit-user-select:none;touch-action:none;
  -webkit-tap-highlight-color:transparent;
  font-family:inherit;
}
#dolphinMusicBtn:active{cursor:grabbing}
#dolphinMusicBtn.dragging{
  cursor:grabbing;
  transform:scale(1.12);
  box-shadow:0 12px 32px rgba(0,0,0,.7),0 0 0 4px rgba(244,184,66,.35);
  transition:none;
}
#dolphinMusicBtn.active{
  background:linear-gradient(135deg,#FBD77A,#F4B842);
  color:#123634;font-weight:900;
  box-shadow:0 0 20px rgba(244,184,66,.9);
  animation:musicPulse 1.6s ease-in-out infinite;
}
@keyframes musicPulse{
  0%,100%{box-shadow:0 0 20px rgba(244,184,66,.9),0 0 0 0 rgba(244,184,66,.5)}
  50%{box-shadow:0 0 28px rgba(244,184,66,1),0 0 0 6px rgba(244,184,66,.15)}
}
@media(prefers-reduced-motion:reduce){ #dolphinMusicBtn.active{animation:none} }

/* ============ MUSIC POPUP ============ */
#dolphinMusicPopup{
  display:none;
  position:fixed;
  background:rgba(18,54,52,.97);
  border:2px solid rgba(244,184,66,.5);
  border-radius:14px;padding:14px;
  box-shadow:0 12px 40px rgba(0,0,0,.75),0 0 30px rgba(244,184,66,.2);
  min-width:250px;max-width:88vw;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  z-index:9998;
  animation:popupIn .2s ease-out;
  font-family:'Nunito',sans-serif;
}
@keyframes popupIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
#dolphinMusicPopup.show{display:block}
#dolphinMusicPopup .dmp-title{
  font-size:11px;font-weight:900;color:#FBD77A;
  text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;
  display:flex;align-items:center;gap:6px;
}
#dolphinMusicPopup .dmp-row{
  display:flex;align-items:center;gap:10px;margin-bottom:10px;
}
#dolphinMusicPopup .dmp-row input[type=range]{
  flex:1;height:4px;-webkit-appearance:none;appearance:none;
  background:linear-gradient(90deg,#FBD77A,#F4B842);
  border-radius:99px;outline:none;cursor:pointer;
}
#dolphinMusicPopup .dmp-row input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:#fff;box-shadow:0 0 10px rgba(244,184,66,.9);cursor:pointer;
}
#dolphinMusicPopup .dmp-pct{
  font-size:11px;color:#FBD77A;font-weight:900;min-width:36px;text-align:right;
}
#dolphinMusicPopup .dmp-hint{
  font-size:10px;color:#bfe9dc;opacity:.75;text-align:center;line-height:1.45;
  margin-bottom:10px;
}
#dolphinMusicPopup .dmp-hint b{color:#FBD77A}
#dolphinMusicPopup .dmp-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;padding:9px;
  border-radius:9px;font-weight:800;font-size:11px;
  cursor:pointer;font-family:inherit;
  transition:background .15s,transform .1s;
  margin-top:8px;
  border:1px solid transparent;
}
#dolphinMusicPopup .dmp-btn:active{transform:scale(.97)}
#dolphinMusicPopup .dmp-btn-refresh{
  background:rgba(55,137,123,.4);
  border-color:rgba(55,137,123,.6);
  color:#bfe9dc;
}
#dolphinMusicPopup .dmp-btn-refresh:hover{background:rgba(55,137,123,.6)}
#dolphinMusicPopup .dmp-btn-refresh:disabled{opacity:.5;cursor:wait}
#dolphinMusicPopup .dmp-btn-reset{
  background:rgba(244,184,66,.12);
  border-color:rgba(244,184,66,.4);
  color:#FBD77A;
}
#dolphinMusicPopup .dmp-btn-reset:hover{background:rgba(244,184,66,.25)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:#123634;color:#fff;font-family:'Nunito',sans-serif}
#landing > div:first-child{
  padding-top: calc(2rem + env(safe-area-inset-top, 0px)) !important;
  padding-bottom: calc(2rem + env(safe-area-inset-bottom, 0px)) !important;
}

/* ============ WELCOME ============ */
.welcome-lbl{
  text-align:center;font-size:clamp(.95rem,2vw,1.25rem);font-weight:900;
  color:#e6f7f2;margin:0 0 clamp(1.25rem,3vw,2rem);
  text-shadow:0 2px 10px rgba(0,0,0,.7);letter-spacing:.04em;line-height:1.5;
}
.welcome-lbl .wlc-vi{
  display:block;color:#FBD77A;font-family:'Fraunces',serif;
  font-size:clamp(1.05rem,2.4vw,1.5rem);letter-spacing:.06em;margin-bottom:.35em;
}
.welcome-lbl .wlc-vi #wlcStaffName{
  display:inline-block;color:#fff;
  text-shadow:0 0 24px rgba(244,184,66,.8),0 0 40px rgba(244,184,66,.5),0 2px 6px rgba(0,0,0,.6);
  font-weight:900;letter-spacing:.08em;margin:0 .15em;
  animation:staffGlow 2.5s ease-in-out infinite;
}
@keyframes staffGlow{
  0%,100%{text-shadow:0 0 24px rgba(244,184,66,.8),0 0 40px rgba(244,184,66,.5),0 2px 6px rgba(0,0,0,.6)}
  50%{text-shadow:0 0 36px rgba(244,184,66,1),0 0 60px rgba(244,184,66,.8),0 2px 6px rgba(0,0,0,.6)}
}
.welcome-lbl .wlc-en{
  display:block;font-size:.85em;color:#bfe9dc;font-weight:800;
  margin-top:.55em;letter-spacing:.14em;text-transform:uppercase;opacity:.92;
}

/* ============ AREA CARDS ============ */
.area-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(.75rem,2vw,1.25rem)}
@media(min-width:900px){.area-grid{grid-template-columns:repeat(4,1fr)}}

.area-card{
  position:relative;padding:1.8rem 1rem 1.5rem;text-align:center;cursor:pointer;
  transition:transform .45s cubic-bezier(.16,1,.3,1);
  isolation:isolate;font-family:'Nunito',sans-serif;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:100%;min-height:190px;gap:.4rem;
  -webkit-appearance:none;appearance:none;outline:none;
  background:transparent;border:none;
}
.area-card:hover{transform:translateY(-8px) scale(1.03)}
.area-card:active{transform:translateY(-2px) scale(.99)}
.area-card:hover .area-icon{transform:scale(1.2) rotate(-8deg)}
.area-icon{
  font-size:clamp(2.6rem,6vw,3.6rem);line-height:1;
  display:block;margin-bottom:.85rem;
  transition:transform .5s cubic-bezier(.16,1,.3,1);
  filter:drop-shadow(0 8px 16px rgba(0,0,0,.5));
  position:relative;z-index:2;
}
.area-card:hover .area-icon{
  filter:drop-shadow(0 8px 16px rgba(0,0,0,.5)) drop-shadow(0 0 20px var(--theme-glow, rgba(244,184,66,.9)));
}
.area-title-en{
  font-weight:900;font-size:clamp(.85rem,1.9vw,1.1rem);
  letter-spacing:.06em;text-transform:uppercase;
  color:#fff;margin:0;transition:color 1s ease, text-shadow 1s ease;
  line-height:1.15;position:relative;z-index:2;
}
.area-title-vi{
  font-weight:700;font-size:clamp(.7rem,1.5vw,.9rem);
  color:#bfe9dc;margin:0;letter-spacing:.04em;
  opacity:.9;font-style:italic;transition:color 1s ease;
  position:relative;z-index:2;
}
.area-badge{
  position:absolute;top:.75rem;right:.85rem;
  background:linear-gradient(135deg,#FBD77A,#D99A2B);
  color:#123634;font-size:.55rem;font-weight:900;letter-spacing:.12em;
  padding:3px 8px;border-radius:99px;text-transform:uppercase;
  box-shadow:0 3px 10px rgba(244,184,66,.5);z-index:5;
}

@keyframes float-up{0%{transform:translateY(28px);opacity:0}100%{transform:translateY(0);opacity:1}}
.fade-up{animation:float-up .85s cubic-bezier(.16,1,.3,1) both}
.d-1{animation-delay:.08s}.d-2{animation-delay:.22s}

/* ============ ANNOUNCEMENT ============ */
#announcementBar{
  display:none;max-width:900px;margin:0 auto 1.5rem;
  background:linear-gradient(135deg,#0f3d38 0%,#0a2b28 100%);
  border:2px solid #FBD77A;border-radius:14px;padding:14px 0;
  position:relative;overflow:hidden;
  box-shadow:0 6px 28px rgba(244,184,66,.45),inset 0 0 30px rgba(244,184,66,.08);
}
#announcementBar.show{display:block;animation:announce-fade-in .6s ease-out}
@keyframes announce-fade-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.announcement-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:22px;z-index:5;filter:drop-shadow(0 0 10px rgba(244,184,66,1));
}
.announcement-viewport{overflow:hidden;padding-left:48px;padding-right:20px;position:relative}
.announcement-track{
  display:inline-flex;white-space:nowrap;
  animation:announce-marquee 25s linear infinite;will-change:transform;
}
.announcement-text{
  padding-right:100px;color:#FFE58F;font-weight:900;font-size:14px;letter-spacing:.04em;
  text-shadow:0 0 4px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.7),0 0 16px rgba(255,229,143,.6);
  font-family:'Nunito',sans-serif;-webkit-text-stroke:0.3px rgba(0,0,0,.3);
}
@keyframes announce-marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@media(min-width:768px){
  .announcement-text{font-size:17px;padding-right:160px}
  .announcement-icon{font-size:26px;left:18px}
  .announcement-viewport{padding-left:60px}
  #announcementBar{padding:16px 0}
}
@media(prefers-reduced-motion:reduce){.announcement-track{animation-duration:60s}}

/* ============ UPDATE BANNER ============ */
#updateBanner{
  display:none;position:fixed;top:0;left:0;right:0;z-index:9999;
  background:linear-gradient(135deg,#1a4a45 0%,#123634 100%);
  border-bottom:3px solid #FBD77A;padding:12px 16px;
  box-shadow:0 8px 32px rgba(244,184,66,.5);
  animation:update-slide-down .5s cubic-bezier(.16,1,.3,1);font-family:'Nunito',sans-serif;
}
#updateBanner.show{display:block}
@keyframes update-slide-down{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
.update-content{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.update-icon{font-size:32px;filter:drop-shadow(0 0 12px rgba(244,184,66,.9))}
.update-info{flex:1;min-width:180px}
.update-title{font-size:15px;font-weight:900;color:#FFE58F;text-transform:uppercase;
  letter-spacing:.04em;text-shadow:0 0 8px rgba(0,0,0,.9);margin-bottom:2px}
.update-notes{font-size:11.5px;color:#bfe9dc;font-weight:600;line-height:1.4;opacity:.9}
.update-actions{display:flex;gap:8px;flex-wrap:wrap}
.update-btn{background:linear-gradient(135deg,#FBD77A,#F4B842);color:#123634;font-weight:900;
  font-size:13px;text-transform:uppercase;letter-spacing:.05em;padding:12px 22px;
  border-radius:12px;border:none;cursor:pointer;
  box-shadow:0 4px 16px rgba(244,184,66,.5);font-family:inherit;white-space:nowrap}
.update-btn:active{transform:scale(.96)}
.update-btn:disabled{opacity:.5;cursor:wait}
.update-skip{background:transparent;color:#98dccb;font-weight:700;font-size:11.5px;
  padding:12px 14px;border-radius:12px;border:1px solid rgba(152,220,203,.3);
  cursor:pointer;font-family:inherit;white-space:nowrap}
@media(min-width:768px){.update-btn{padding:14px 28px;font-size:14px}}
@media(max-width:480px){
  #updateBanner{padding:10px 12px}
  .update-actions{width:100%}
  .update-btn,.update-skip{flex:1;text-align:center}
}

/* ============ TRANSITIONS ============ */
#landing{
  transition:opacity .55s ease,transform .7s cubic-bezier(.16,1,.3,1);
  position:fixed;inset:0;z-index:50;overflow-y:auto;overflow-x:hidden;
  background:transparent !important;
}
#landing.fade-out{opacity:0;transform:scale(1.06);pointer-events:none}
#app-view{opacity:0;transition:opacity .45s ease;position:fixed;inset:0;z-index:40;background:#123634}
#app-view.show{opacity:1}
#app-view.hidden{display:none}
#app-frame{width:100%;height:100%;border:0;display:block;background:#123634;position:absolute;inset:0;z-index:1}
#app-frame.hidden-frame{opacity:0}
#app-loading{
  position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:1rem;background:#123634;transition:opacity .4s;pointer-events:none;
}
#app-loading.hide{opacity:0}
.loader-ring{
  width:56px;height:56px;border:4px solid rgba(244,184,66,.2);
  border-top-color:#F4B842;border-radius:50%;animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{color:#FBD77A;font-weight:800;font-size:.85rem;letter-spacing:.15em;text-transform:uppercase}

/* ============ HOME CONTROLS ============ */
#home-controls{
  position:fixed;bottom:20px;right:15px;z-index:1000;
  display:flex;flex-direction:column-reverse;gap:8px;align-items:center;
  user-select:none;-webkit-user-select:none;touch-action:none;
}
#home-controls.dragging{opacity:.85}
#home-controls.dragging #btn-home{
  transform:scale(1.08);
  box-shadow:0 10px 30px rgba(0,0,0,.7), 0 0 0 4px rgba(244,184,66,.35);
}
#btn-home{
  width:52px;height:52px;border-radius:50%;background:rgba(18,54,52,.9);
  border:2px solid rgba(244,184,66,.7);color:#FBD77A;display:flex;align-items:center;justify-content:center;
  cursor:grab;backdrop-filter:blur(12px);
  box-shadow:0 6px 20px rgba(0,0,0,.5);transition:transform .15s,box-shadow .15s;
  padding:0;touch-action:none;-webkit-tap-highlight-color:transparent;
}
#btn-home svg{width:24px;height:24px;pointer-events:none}
#btn-toggle{
  width:34px;height:34px;border-radius:50%;background:rgba(18,54,52,.8);
  border:1px solid rgba(244,184,66,.4);color:rgba(251,215,122,.95);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  backdrop-filter:blur(8px);
  box-shadow:0 3px 10px rgba(0,0,0,.3);font-size:14px;
  padding:0;line-height:1;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
#home-controls.minimized #btn-home{
  width:18px;height:18px;opacity:.5;
  border-color:rgba(244,184,66,.5);box-shadow:0 3px 10px rgba(0,0,0,.4);
}
#home-controls.minimized #btn-home svg{display:none}
#home-controls.minimized #btn-toggle{display:none}
#home-controls.minimized #btn-home::after{
  content:'';width:8px;height:8px;border-radius:50%;
  background:#FBD77A;box-shadow:0 0 10px rgba(244,184,66,.9);
}

/* ============ ORDER NOTIFICATION ============ */
#orderNotif{
  display:none;position:fixed;top:20px;left:50%;
  transform:translateX(-50%) translateY(-120%);z-index:9998;
  background:linear-gradient(135deg,#B91C1C 0%,#7F1D1D 100%);

<!-- ═══════ MUSIC BUTTON — DRAG + POPUP ═══════ -->
<script>
(function(){
  'use strict';
  var BTN = null, POPUP = null;
  var POS_KEY = 'dolphinMusicBtnPos';
  var popupOpen = false;

  function $(id){ return document.getElementById(id); }
  function loadPos(){
    try { var s = localStorage.getItem(POS_KEY); return s ? JSON.parse(s) : null; }
    catch(e){ return null; }
  }
  function savePos(x, y){
    try { localStorage.setItem(POS_KEY, JSON.stringify({ x: x, y: y })); } catch(e){}
  }
  function clearPos(){
    try { localStorage.removeItem(POS_KEY); } catch(e){}
  }
  function clampPos(x, y){
    var w = BTN.offsetWidth, h = BTN.offsetHeight;
    var vw = window.innerWidth, vh = window.innerHeight;
    x = Math.max(6, Math.min(x, vw - w - 6));
    y = Math.max(6, Math.min(y, vh - h - 6));
    return { x: x, y: y };
  }
  function applyPos(x, y){
    var c = clampPos(x, y);
    BTN.style.left = c.x + 'px';
    BTN.style.top = c.y + 'px';
    BTN.style.right = 'auto';
    BTN.style.bottom = 'auto';
  }
  function resetPos(){
    clearPos();
    BTN.style.left = '';
    BTN.style.top = '';
    BTN.style.right = '14px';
    BTN.style.top = '14px';
    BTN.style.bottom = 'auto';
  }

  function positionPopup(){
    if (!POPUP || !BTN) return;
    var rect = BTN.getBoundingClientRect();
    var pw = POPUP.offsetWidth || 250;
    var ph = POPUP.offsetHeight || 200;
    var vw = window.innerWidth, vh = window.innerHeight;
    var px = rect.left + rect.width - pw;
    var py = rect.top + rect.height + 10;
    if (px < 8) px = 8;
    if (px + pw > vw - 8) px = vw - pw - 8;
    if (py + ph > vh - 8) py = rect.top - ph - 10;
    if (py < 8) py = 8;
    POPUP.style.left = px + 'px';
    POPUP.style.top = py + 'px';
    POPUP.style.right = 'auto';
    POPUP.style.bottom = 'auto';
  }

  function openPopup(){
    POPUP.classList.add('show');
    popupOpen = true;
    positionPopup();
    syncPopupUI();
  }
  function closePopup(){
    POPUP.classList.remove('show');
    popupOpen = false;
  }

  function syncBtn(){
    if (!BTN || !window.DolphinSound) return;
    var on = window.DolphinSound.isEnabled();
    BTN.textContent = on ? '🔊' : '🔇';
    BTN.classList.toggle('active', on);
  }

  function syncPopupUI(){
    if (!window.DolphinSound) return;
    var v = Math.round(window.DolphinSound.getVolume() * 100);
    var inp = $('dmpVol');
    var pct = $('dmpVolPct');
    if (inp && document.activeElement !== inp) inp.value = v;
    if (pct) pct.textContent = v + '%';
  }

  window.__giaitriSyncMusicUI = function(){
    syncBtn();
    if (popupOpen) syncPopupUI();
  };

  function getPoint(e){
    if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e.changedTouches && e.changedTouches[0]) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }

  function init(){
    BTN = $('dolphinMusicBtn');
    POPUP = $('dolphinMusicPopup');
    if (!BTN || !POPUP) return;

    var saved = loadPos();
    if (saved) applyPos(saved.x, saved.y);

    var volInp = $('dmpVol');
    if (volInp){
      volInp.addEventListener('input', function(){
        if (!window.DolphinSound) return;
        var v = parseInt(this.value, 10);
        window.DolphinSound.setVolume(v / 100);
        var pct = $('dmpVolPct');
        if (pct) pct.textContent = v + '%';
      });
    }

    var refreshBtn = $('dmpRefresh');
    if (refreshBtn){
      refreshBtn.addEventListener('click', function(e){
        e.stopPropagation();
        if (!window.DolphinSound || !window.DolphinSound.refreshTracks) return;
        refreshBtn.disabled = true;
        refreshBtn.innerHTML = '<span>⏳</span><span>Đang cập nhật...</span>';
        window.DolphinSound.refreshTracks().then(function(tracks){
          refreshBtn.disabled = false;
          refreshBtn.innerHTML = '<span>🔄</span><span>Cập nhật danh sách nhạc</span>';
          if (window.showToast){
            window.showToast('Đã cập nhật ' + (tracks ? tracks.length : 0) + ' bài', '✅');
          }
        }).catch(function(){
          refreshBtn.disabled = false;
          refreshBtn.innerHTML = '<span>🔄</span><span>Cập nhật danh sách nhạc</span>';
          if (window.showToast) window.showToast('Cập nhật thất bại', '❌');
        });
      });
    }

    var resetBtn = $('dmpReset');
    if (resetBtn){
      resetBtn.addEventListener('click', function(e){
        e.stopPropagation();
        resetPos();
        if (popupOpen) positionPopup();
        if (window.showToast) window.showToast('Đã về vị trí mặc định', '↺');
      });
    }

    var drag = { active: false, moved: false, startX: 0, startY: 0, origX: 0, origY: 0 };

    function onStart(e){
      var pt = getPoint(e);
      drag.active = true;
      drag.moved = false;
      drag.startX = pt.x;
      drag.startY = pt.y;
      var rect = BTN.getBoundingClientRect();
      drag.origX = rect.left;
      drag.origY = rect.top;
      BTN.style.transition = 'none';
    }
    function onMove(e){
      if (!drag.active) return;
      var pt = getPoint(e);
      var dx = pt.x - drag.startX;
      var dy = pt.y - drag.startY;
      if (!drag.moved && (Math.abs(dx) + Math.abs(dy)) < 8) return;
      drag.moved = true;
      if (e.cancelable) e.preventDefault();
      var c = clampPos(drag.origX + dx, drag.origY + dy);
      BTN.style.left = c.x + 'px';
      BTN.style.top = c.y + 'px';
      BTN.style.right = 'auto';
      BTN.classList.add('dragging');
    }
    function onEnd(){
      if (!drag.active) return;
      drag.active = false;
      BTN.style.transition = '';
      BTN.classList.remove('dragging');
      if (!drag.moved) return;
      savePos(BTN.offsetLeft, BTN.offsetTop);
      if (popupOpen) positionPopup();
    }

    BTN.addEventListener('touchstart', onStart, { passive: true });
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);
    document.addEventListener('touchcancel', onEnd);

    BTN.addEventListener('mousedown', function(e){
      e.preventDefault();
      onStart(e);
    });
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);

    BTN.addEventListener('click', function(e){
      if (drag.moved){ e.preventDefault(); e.stopPropagation(); drag.moved = false; return; }
      e.stopPropagation();
      if (window.DolphinSound && !window.DolphinSound.isEnabled()){
        window.DolphinSound.enable();
        syncBtn();
      }
      if (popupOpen) closePopup();
      else openPopup();
    });

    document.addEventListener('click', function(e){
      if (!popupOpen) return;
      if (e.target.closest('#dolphinMusicPopup')) return;
      if (e.target.closest('#dolphinMusicBtn')) return;
      closePopup();
    });

    window.addEventListener('resize', function(){
      var pos = loadPos();
      if (pos) applyPos(pos.x, pos.y);
      if (popupOpen) positionPopup();
    });

    syncBtn();
    setInterval(syncBtn, 1500);
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

<!-- ═══════ APP LOGIC ═══════ -->
<script>
(function(){
  'use strict';

  var APP_MAP = {
    lounge:     'dolphin-lounge.html',
    bungalow:   'dolphin-bungalow.html',
    restaurant: 'dolphin-restaurant.html',
    show:       'dolphin-show.html',
    giaitri:    'giaitri/index.html',
    dashboard:  'manager/dashboard.html',
    ranking:    'ranking/index.html'
  };

  var currentApp = null;
  var transitionLock = false;

  var HOME_KEY = 'dolphinHomeBtnHidden';
  function applyHomeBtnState(){
    var ctrl = document.getElementById('home-controls');
    if (!ctrl) return;
    ctrl.classList.toggle('minimized', localStorage.getItem(HOME_KEY) === '1');
  }
  window.toggleHomeBtn = function(){
    var ctrl = document.getElementById('home-controls');
    if (!ctrl) return;
    var h = !ctrl.classList.contains('minimized');
    localStorage.setItem(HOME_KEY, h ? '1' : '0');
    ctrl.classList.toggle('minimized', h);
  };

  var DRAG_POS_KEY = 'dolphinHomeBtnPos';
  var ctrl = null;

  function saveHomePos(x, y){
    try { localStorage.setItem(DRAG_POS_KEY, JSON.stringify({ x: x, y: y })); } catch(e){}
  }
  function loadHomePos(){
    try { var s = localStorage.getItem(DRAG_POS_KEY); return s ? JSON.parse(s) : null; }
    catch(e){ return null; }
  }
  function applyHomePos(x, y){
    if (!ctrl) return;
    ctrl.style.left = x + 'px';
    ctrl.style.top = y + 'px';
    ctrl.style.right = 'auto';
    ctrl.style.bottom = 'auto';
  }
  function clampHomePos(x, y){
    var vw = window.innerWidth, vh = window.innerHeight;
    var w = ctrl.offsetWidth || 60, h = ctrl.offsetHeight || 100;
    x = Math.max(4, Math.min(x, vw - w - 4));
    y = Math.max(4, Math.min(y, vh - h - 4));
    return { x: x, y: y };
  }
  function snapHomeToEdge(){
    if (!ctrl) return;
    var vw = window.innerWidth, w = ctrl.offsetWidth || 60;
    var cur = { x: ctrl.offsetLeft, y: ctrl.offsetTop };
    var snapLeft = cur.x < (vw - w) / 2;
    var nx = snapLeft ? 12 : (vw - w - 12);
    var ny = clampHomePos(nx, cur.y).y;
    ctrl.style.transition = 'left .3s cubic-bezier(.16,1,.3,1), top .3s cubic-bezier(.16,1,.3,1)';
    applyHomePos(nx, ny);
    setTimeout(function(){ ctrl.style.transition = ''; }, 320);
    saveHomePos(nx, ny);
  }
  function initHomeDrag(){
    ctrl = document.getElementById('home-controls');
    if (!ctrl) return;
    var saved = loadHomePos();
    if (saved){
      var c = clampHomePos(saved.x, saved.y);
      applyHomePos(c.x, c.y);
    }
    var btnHome = document.getElementById('btn-home');
    if (!btnHome) return;
    var drag = { active: false, moved: false, startX: 0, startY: 0, origX: 0, origY: 0 };
    function getPoint(e){
      if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      if (e.changedTouches && e.changedTouches[0]) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }
    function onStart(e){
      if (e.target.closest('#btn-toggle')) return;
      var pt = getPoint(e);
      drag.active = true; drag.moved = false;
      drag.startX = pt.x; drag.startY = pt.y;
      drag.origX = ctrl.offsetLeft; drag.origY = ctrl.offsetTop;
      ctrl.classList.add('dragging');
      ctrl.style.transition = '';
    }
    function onMove(e){
      if (!drag.active) return;
      var pt = getPoint(e);
      var dx = pt.x - drag.startX, dy = pt.y - drag.startY;
      if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 8) return;
      drag.moved = true;
      if (e.cancelable) e.preventDefault();
      var c = clampHomePos(drag.origX + dx, drag.origY + dy);
      applyHomePos(c.x, c.y);
    }
    function onEnd(){
      if (!drag.active) return;
      drag.active = false;
      ctrl.classList.remove('dragging');
      if (!drag.moved) return;
      snapHomeToEdge();
    }
    btnHome.addEventListener('touchstart', onStart, { passive: true });
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);
    document.addEventListener('touchcancel', onEnd);
    btnHome.addEventListener('mousedown', function(e){ onStart(e); e.preventDefault(); });
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    window.addEventListener('resize', function(){
      var pos = loadHomePos();
      if (pos){ var c = clampHomePos(pos.x, pos.y); applyHomePos(c.x, c.y); }
    });
    btnHome.addEventListener('click', function(e){
      if (drag.moved) { e.preventDefault(); e.stopPropagation(); drag.moved = false; }
    }, true);
  }

  applyHomeBtnState();
  setTimeout(initHomeDrag, 100);

  (function(){
    var cards = document.querySelectorAll('.area-card');
    if (!cards.length) return;
    cards.forEach(function(c){ c.classList.add('skeleton'); });
    setTimeout(function(){
      cards.forEach(function(c){
        c.classList.remove('skeleton');
        c.style.opacity = '0';
        c.style.transform = 'translateY(8px)';
        c.style.transition = 'opacity .5s ease, transform .5s cubic-bezier(.16,1,.3,1)';
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){
            c.style.opacity = '1';
            c.style.transform = '';
          });
        });
      });
    }, 600);
  })();

  window.clearAreaBadge = function(area){
    var el = document.getElementById('badge-' + area);
    if (el) el.classList.remove('show');
  };

  if (navigator.userAgent.indexOf('DolphinManager') >= 0) {
    var cardDash = document.getElementById('card-dashboard');
    if (cardDash) cardDash.style.display = 'flex';
  }

  window.openApp = function(area){
    if (transitionLock) return;
    if (!APP_MAP[area]) return;
    doOpenApp(area);
  };

  function doOpenApp(area){
    if (transitionLock) return;
    var baseUrl = APP_MAP[area];
    if (!baseUrl) return;

    try { if (window.DolphinSound) window.DolphinSound.pause(); } catch(e){}

    var themeKey = (window.ThemeSystem && window.ThemeSystem.getCurrent)
                   ? window.ThemeSystem.getCurrent() : 'default';
    var sep = baseUrl.indexOf('?') === -1 ? '?' : '&';
    var url = baseUrl + sep + 'theme=' + themeKey;

    transitionLock = true;
    if (location.hash !== '#' + area) {
      try { history.pushState({area: area}, '', '#' + area); } catch(e) { location.hash = area; }
    }
    currentApp = area;
    if (window.clearAreaBadge) window.clearAreaBadge(area);

    var frame = document.getElementById('app-frame');
    var view = document.getElementById('app-view');
    var landing = document.getElementById('landing');
    var loading = document.getElementById('app-loading');
    loading.classList.remove('hide');
    frame.classList.add('hidden-frame');
    var done = false;
    var onLoaded = function(){
      if (done) return; done = true;
      frame.removeEventListener('load', onLoaded);
      setTimeout(function(){
        loading.classList.add('hide');
        frame.classList.remove('hidden-frame');
        transitionLock = false;
      }, 300);
    };
    frame.addEventListener('load', onLoaded);
    frame.src = url;
    setTimeout(function(){
      if (done) return; done = true;
      loading.classList.add('hide');
      frame.classList.remove('hidden-frame');
      transitionLock = false;
    }, 10000);
    landing.classList.add('fade-out');
    document.body.classList.add('app-mode');
    setTimeout(function(){
      landing.style.display = 'none';
      view.classList.remove('hidden');
      void view.offsetWidth;
      requestAnimationFrame(function(){ view.classList.add('show'); });
    }, 420);
  }

  window.goHome = function(){
    if (transitionLock) return;
    transitionLock = true;

    try { if (window.DolphinSound) window.DolphinSound.resume(); } catch(e){}

    if (window.renderGreeting) window.renderGreeting();
    if (location.hash) {
      try { history.pushState({}, '', location.pathname + location.search); }
      catch(e){ location.hash = ''; }
    }
    currentApp = null;
    var frame = document.getElementById('app-frame');
    var view = document.getElementById('app-view');
    var landing = document.getElementById('landing');
    var loading = document.getElementById('app-loading');
    view.classList.remove('show');
    document.body.classList.remove('app-mode');
    setTimeout(function(){
      view.classList.add('hidden');
      frame.src = 'about:blank';
      loading.classList.remove('hide');
      frame.classList.remove('hidden-frame');
      landing.style.display = '';
      void landing.offsetWidth;
      requestAnimationFrame(function(){
        landing.classList.remove('fade-out');
        transitionLock = false;
      });
    }, 420);
  };

  function renderGreeting(){
    try {
      var name = (localStorage.getItem('dolphinStaffName') || '').trim();
      var nameEl = document.getElementById('wlcStaffName');
      var subEl  = document.getElementById('wlcGreetingSub');
      var greetEl = document.getElementById('wlcGreeting');
      if (!nameEl || !subEl || !greetEl) return;
      if (name){
        var display = name.charAt(0).toUpperCase() + name.slice(1);
        var hour = parseInt(new Intl.DateTimeFormat('en-US', {
          timeZone:'Asia/Ho_Chi_Minh', hour:'2-digit', hour12:false
        }).format(new Date()), 10);
        var greeting, emoji;
        if (hour >= 5 && hour < 11)       { greeting = 'CHÀO BUỔI SÁNG';  emoji = '🌅'; }
        else if (hour >= 11 && hour < 14) { greeting = 'CHÀO BUỔI TRƯA';   emoji = '☀️'; }
        else if (hour >= 14 && hour < 18) { greeting = 'CHÀO BUỔI CHIỀU';  emoji = '🌤️'; }
        else if (hour >= 18 && hour < 22) { greeting = 'CHÀO BUỔI TỐI';    emoji = '🌆'; }
        else                              { greeting = 'CHÀO BUỔI ĐÊM';    emoji = '🌙'; }
        greetEl.innerHTML = greeting + ' <span id="wlcStaffName" style="color:#FBD77A;text-shadow:0 0 20px rgba(244,184,66,.7);font-weight:900;">' + display + '</span> ' + emoji;
      } else {
        nameEl.textContent = 'BẠN';
      }
    } catch(e){}
  }
  window.renderGreeting = renderGreeting;
  renderGreeting();

  window.addEventListener('popstate', function(){
    if (transitionLock) return;
    var hash = (location.hash || '').replace('#', '');
    if (hash && APP_MAP[hash]) {
      if (currentApp !== hash) window.openApp(hash);
    } else {
      if (currentApp) window.goHome();
    }
  });

  window.addEventListener('DOMContentLoaded', function(){
    renderGreeting();
    var hash = (location.hash || '').replace('#', '');
    if (hash && APP_MAP[hash]) setTimeout(function(){ window.openApp(hash); }, 350);
  });

  var lastTouch = 0;
  document.addEventListener('touchend', function(e){
    var now = Date.now();
    if (now - lastTouch <= 320) e.preventDefault();
    lastTouch = now;
  }, { passive: false });

})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/DolphinApp/service-worker.js', {
      scope: '/DolphinApp/', updateViaCache: 'none'
    }).then(function(reg){
      setInterval(function(){
        reg.update();
        if (reg.active) reg.active.postMessage({ type: 'CHECK_UPDATE' });
      }, 5 * 60 * 1000);
      document.addEventListener('visibilitychange', function(){
        if (document.visibilityState === 'visible'){
          reg.update();
          if (reg.active) reg.active.postMessage({ type: 'CHECK_UPDATE' });
        }
      });
      reg.addEventListener('updatefound', function(){
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function(){
          if (nw.state === 'installed' && navigator.serviceWorker.controller){
            nw.postMessage({ type: 'SKIP_WAITING' });
          }
        });
      });
    }).catch(function(err){ console.warn('❌ SW failed:', err); });

    navigator.serviceWorker.addEventListener('message', function(e){
      var data = e.data || {};
      if (data.type === 'NEW_VERSION'){
        var banner = document.getElementById('updateBanner');
        if (banner){
          var t = banner.querySelector('.update-title');
          var n = banner.querySelector('.update-notes');
          if (t) t.textContent = '🎉 Phiên bản ' + (data.newVersion || 'mới') + ' sẵn sàng!';
          if (n) n.textContent = 'Bấm "Cập nhật ngay" để nhận tính năng mới.';
          banner.classList.add('show');
        }
      }
    });

    var pendingUpdate = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if (pendingUpdate) return;
      pendingUpdate = true;
      var banner = document.getElementById('updateBanner');
      if (banner) banner.classList.add('show');
    });
  });
}
</script>

<script>
function initHalongClock(){
  var elH = document.getElementById('hclockH');
  var elM = document.getElementById('hclockM');
  var elS = document.getElementById('hclockS');
  var elDate = document.getElementById('hclockDate');
  if (!elH || !elM || !elS || !elDate) return;
  var fmtTime = new Intl.DateTimeFormat('en-GB', {
    timeZone:'Asia/Ho_Chi_Minh', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
  });
  var fmtDate = new Intl.DateTimeFormat('en-GB', {
    timeZone:'Asia/Ho_Chi_Minh', day:'2-digit', month:'2-digit', year:'numeric', weekday:'short'
  });
  function tick(){
    var now = new Date();
    var p = fmtTime.formatToParts(now);
    var h = '00', m = '00', s = '00';
    p.forEach(function(x){
      if (x.type === 'hour') h = x.value;
      if (x.type === 'minute') m = x.value;
      if (x.type === 'second') s = x.value;
    });
    elH.textContent = h; elM.textContent = m; elS.textContent = s;
    var dp = fmtDate.formatToParts(now);
    var d = '01', mo = '01', y = '2026', dow = '';
    dp.forEach(function(x){
      if (x.type === 'day') d = x.value;
      if (x.type === 'month') mo = x.value;
      if (x.type === 'year') y = x.value;
      if (x.type === 'weekday') dow = x.value;
    });
    var map = { Sun:'Chủ Nhật', Mon:'Thứ Hai', Tue:'Thứ Ba', Wed:'Thứ Tư', Thu:'Thứ Năm', Fri:'Thứ Sáu', Sat:'Thứ Bảy' };
    elDate.textContent = (map[dow] || dow) + ', ' + d + ' tháng ' + mo + ', ' + y;
  }
  tick();
  setInterval(tick, 1000);
}
if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', function(){ setTimeout(initHalongClock, 200); });
} else {
  setTimeout(initHalongClock, 200);
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const cfg = {
  apiKey: "AIzaSyAtBNp9WBnyIkCiVjXfUpjH2d7-9dbg-JQ",
  authDomain: "dolphin-f6d67.firebaseapp.com",
  projectId: "dolphin-f6d67"
};
const WATCH_ORDERS = [
  { name: 'bun_orders', label: 'Bungalow', icon: '🌴' },
  { name: 'lounge_orders', label: 'Lounge', icon: '🍸' },
  { name: 'res_orders', label: 'Restaurant', icon: '🍽️' }
];
const WATCH_CALLS = [
  { name: 'bun_calls', label: 'Bungalow', icon: '🌴' },
  { name: 'lounge_calls', label: 'Lounge', icon: '🍸' },
  { name: 'res_calls', label: 'Restaurant', icon: '🍽️' }
];
let audioCtx = null, hideTimer = null;
function unlock(){ try { if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch(e){} }
['click','touchstart','keydown'].forEach(ev => document.addEventListener(ev, unlock, { passive: true }));

function bell(){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const ctx = audioCtx, now = ctx.currentTime;
    const master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination);
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 4; comp.connect(master);
    const delay = ctx.createDelay(); delay.delayTime.value = 0.02;
    const dg = ctx.createGain(); dg.gain.value = 0.3; delay.connect(dg); dg.connect(master);
    function strike(freq, time, g, dec){
      [{r:1,g:1,d:1},{r:2,g:0.6,d:0.85},{r:2.76,g:0.4,d:0.7},{r:4.07,g:0.25,d:0.55},{r:5.43,g:0.15,d:0.4}].forEach(p => {
        const o = ctx.createOscillator(), gg = ctx.createGain();
        o.type = 'sine'; o.frequency.value = freq * p.r;
        o.detune.value = (Math.random() - 0.5) * 4;
        const peak = g * p.g, d = dec * p.d;
        gg.gain.setValueAtTime(0.0001, time);
        gg.gain.exponentialRampToValueAtTime(peak, time + 0.005);
        gg.gain.exponentialRampToValueAtTime(0.0001, time + d);
        o.connect(gg); gg.connect(comp); gg.connect(delay);
        o.start(time); o.stop(time + d + 0.05);
      });
    }
    const base = 1046.5;
    strike(base, now + 0.0, 0.5, 1.2);
    strike(base, now + 0.35, 0.5, 1.2);
    strike(base, now + 0.70, 0.5, 2.5);
    strike(base * 0.75, now + 0.70, 0.35, 2.5);
    strike(base * 0.5, now + 0.72, 0.25, 2.5);
    if (navigator.vibrate){ try { navigator.vibrate([200,100,200,100,400]); } catch(e){} }
  } catch(e){ console.warn('[Notif]', e); }
}

function showNotif(cfg, data, type){
  const n = document.getElementById('orderNotif');
  const t = document.getElementById('orderNotifTitle');
  const s = document.getElementById('orderNotifSub');
  if (!n || !t || !s) return;
  const col = cfg.icon + ' ' + cfg.label;
  const table = data.table || '--';
  const customer = data.customerName || '';
  if (type === 'call'){
    t.textContent = '🛎️ KHÁCH GỌI PHỤC VỤ!';
    s.innerHTML = col + ' · Bàn <span class="table-hl">' + table + '</span>' + (customer ? ' · ' + customer : '');
  } else {
    const c = Array.isArray(data.items) ? data.items.length : 0;
    t.textContent = '🔔 CÓ ĐƠN MỚI!';
    s.innerHTML = col + ' · Bàn <span class="table-hl">' + table + '</span> · ' + (c > 0 ? c + ' món' : 'đơn mới') + (customer ? ' · ' + customer : '');
  }
  n.dataset.collection = cfg.name;
  n.classList.add('show');
  if (hideTimer) clearTimeout(hideTimer);
  hideTimer = setTimeout(() => { window.closeOrderNotif(); }, 12000);
}

window.closeOrderNotif = function(){ var n = document.getElementById('orderNotif'); if (n) n.classList.remove('show'); };
window.openOrderFromNotif = function(){
  var n = document.getElementById('orderNotif');
  if (!n) return;
  var map = {
    'bun_orders': 'bungalow', 'lounge_orders': 'lounge', 'res_orders': 'restaurant',
    'bun_calls': 'bungalow', 'lounge_calls': 'lounge', 'res_calls': 'restaurant'
  };
  var k = map[n.dataset.collection];
  if (k && window.openApp) window.openApp(k);
  window.closeOrderNotif();
};

try {
  const app = initializeApp(cfg, 'notif-app');
  const auth = getAuth(app);
  const db = getFirestore(app);
  signInAnonymously(auth).then(() => {
    WATCH_ORDERS.forEach(c => {
      const init = { f: true };
      onSnapshot(collection(db, c.name), snap => {
        if (init.f){ init.f = false; return; }
        snap.docChanges().forEach(ch => {
          if (ch.type === 'added'){
            const d = ch.doc.data();
            if (d.status === 'pending'){ bell(); showNotif(c, d, 'order'); }
          }
        });
      }, err => console.warn('[Notif]', c.name, err));
    });
    WATCH_CALLS.forEach(c => {
      const init = { f: true };
      onSnapshot(collection(db, c.name), snap => {
        if (init.f){ init.f = false; return; }
        snap.docChanges().forEach(ch => {
          if (ch.type === 'added'){
            const d = ch.doc.data();
            if (d.status === 'pending'){ bell(); showNotif(c, d, 'call'); }
          }
        });
      }, err => console.warn('[Notif]', c.name, err));
    });
  }).catch(err => console.warn('[Notif]', err));
} catch(e){ console.warn('[Notif]', e); }
</script>

  authDomain: "dolphin-f6d67.firebaseapp.com",
