name: Dolphin Guest F&B booking notes regression
on:
  pull_request:
    paths:
      - 'functions/guest-table*'
      - 'functions/guest-sheet-bridge.js'
      - 'apps-script/**'
      - 'dolphin-guests.html'
      - 'dolphin-guest-table-input.js'
      - 'scripts/dolphin-guest-table-input.test.cjs'
      - 'dolphin-guest-special-rules.js'
      - 'dolphin-table-signs.js'
      - 'assets/dolphin-table-sign-word.png'
      - 'scripts/dolphin-guest-special.test.cjs'
      - 'scripts/dolphin-table-signs.test.cjs'
      - 'scripts/dolphin-table-signs-print-browser.cjs'
      - '.github/workflows/dolphin-guest-special-tests.yml'
      - 'service-worker.js'
  push:
    branches: [main]
    paths:
      - 'functions/guest-table*'
      - 'functions/guest-sheet-bridge.js'
      - 'apps-script/**'
      - 'dolphin-guests.html'
      - 'dolphin-guest-table-input.js'
      - 'scripts/dolphin-guest-table-input.test.cjs'
      - 'dolphin-guest-special-rules.js'
      - 'dolphin-table-signs.js'
      - 'assets/dolphin-table-sign-word.png'
      - 'scripts/dolphin-guest-special.test.cjs'
      - 'scripts/dolphin-table-signs.test.cjs'
      - 'scripts/dolphin-table-signs-print-browser.cjs'
      - '.github/workflows/dolphin-guest-special-tests.yml'
jobs:
  guest-special-fnb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate booking-note parser syntax
        run: node --check dolphin-guest-special-rules.js
      - name: Validate Word-based table-sign printer JS
        run: node --check dolphin-table-signs.js
      - name: Verify eight-area sign grouping, exact Letter layout, artwork and escaping
        run: node --test scripts/dolphin-table-signs.test.cjs
      - name: Verify Pakora, Coconut Welcome, Trà Ấn and special BKK display
        run: node --test scripts/dolphin-guest-special.test.cjs

      - name: Verify authenticated Sheets assignment and conflict handling
        run: node --test functions/guest-table-sheet.test.cjs scripts/dolphin-guest-table-input.test.cjs
      - name: Install print layout verification dependencies
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          python3 -m pip install pypdf
      - name: Verify actual A4 PDF pagination and joined bookings
        run: node scripts/dolphin-table-signs-print-browser.cjs
