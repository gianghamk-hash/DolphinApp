<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123634">
<title>Danh sách khách</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d2b28;--bg2:#0a1f1d;
  --glass:rgba(25,71,67,.48);--glass2:rgba(25,71,67,.68);
  --line:rgba(244,184,66,.14);--line2:rgba(244,184,66,.3);
  --gold:#FBD77A;--gold2:#F4B842;--mint:#bfe9dc;--mint2:#7ec9be;
  --red:#fca5a5;--grn:#86efac;--rose:#fb7185;
  --sh:0 6px 20px -10px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.12);
  --sh-h:0 14px 32px -12px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.18);
  --tr:.28s cubic-bezier(.16,1,.3,1)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%);min-height:100%}
body{color:#fff;font-family:Nunito,system-ui,sans-serif;padding:calc(10px + env(safe-area-inset-top)) 14px calc(80px + env(safe-area-inset-bottom));max-width:1100px;margin:0 auto;-webkit-font-smoothing:antialiased}

/* HEADER */
.hd{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,rgba(13,43,40,.98),rgba(13,43,40,.82));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding:12px 0 14px;margin:-14px -14px 16px;padding-left:14px;padding-right:14px}
.hd-r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hd-r1 h1{font-size:1.05rem;margin:0;color:var(--gold);font-weight:900;letter-spacing:.02em;white-space:nowrap}
.hd-r1 .sp{flex:1}
.hd-meta{font-size:.68rem;color:var(--mint2);opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--glass);border:1px solid var(--line);color:var(--mint);font-size:1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--tr);padding:0}
.icon-btn:hover{background:var(--glass2);border-color:var(--line2);color:var(--gold);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.94)}

.hd-r2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.date-wrap{display:flex;align-items:center;gap:2px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:4px;flex:0 1 auto;transition:border-color var(--tr)}
.date-wrap:hover{border-color:var(--line2)}
.date-wrap button{width:28px;height:28px;border-radius:8px;background:transparent;border:0;color:var(--mint);font-size:1rem;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.date-wrap button:hover{background:rgba(244,184,66,.14);color:var(--gold)}
.date-wrap input[type=date]{background:transparent;border:0;color:#fff;padding:5px 6px;font:inherit;font-size:.82rem;font-weight:800;min-width:0;color-scheme:dark;cursor:pointer}
.date-wrap input[type=date]:focus{outline:none}
.today-btn{padding:8px 13px;border-radius:12px;background:var(--glass);border:1px solid var(--line);color:var(--mint);font:inherit;font-size:.78rem;font-weight:800;cursor:pointer;white-space:nowrap;transition:all var(--tr)}
.today-btn:hover{border-color:var(--line2);color:var(--gold)}
.today-btn.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0d2b28;border-color:transparent;box-shadow:0 4px 14px -4px rgba(244,184,66,.5)}

.search-wrap{position:relative;flex:1 1 180px;min-width:0}
.search-wrap input{width:100%;background:var(--glass);border:1px solid var(--line);color:#fff;border-radius:12px;padding:10px 12px 10px 34px;font:inherit;font-size:.82rem;transition:all var(--tr)}
.search-wrap input:focus{outline:none;border-color:var(--gold);background:var(--glass2);box-shadow:0 0 0 3px rgba(244,184,66,.12)}
.search-wrap::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:.85rem;opacity:.65;pointer-events:none}

.tour-seg{display:flex;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex:0 0 auto}
.tour-seg button{padding:7px 13px;border-radius:9px;background:transparent;border:0;color:var(--mint);font:inherit;font-size:.78rem;font-weight:800;cursor:pointer;white-space:nowrap;transition:all var(--tr)}
.tour-seg button:hover{color:var(--gold)}
.tour-seg button.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0d2b28;box-shadow:0 3px 10px -2px rgba(244,184,66,.5)}

/* FILTER */
.seg-main{display:flex;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:5px;gap:4px;margin-bottom:10px}
.seg-main button{flex:1;padding:12px 8px;border-radius:12px;background:transparent;border:0;color:var(--mint);font:inherit;font-size:.88rem;font-weight:800;cursor:pointer;transition:all var(--tr);white-space:nowrap;letter-spacing:.01em}
.seg-main button:hover{color:var(--gold)}
.seg-main button.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0d2b28;font-weight:900;box-shadow:0 4px 14px -4px rgba(244,184,66,.55)}

.sub-row{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:thin}
.sub-row::-webkit-scrollbar{height:3px}
.sub-row::-webkit-scrollbar-thumb{background:rgba(244,184,66,.3);border-radius:99px}
.sub-chip{padding:8px 14px;border-radius:10px;background:transparent;border:1px solid transparent;color:var(--mint2);font:inherit;font-size:.79rem;font-weight:800;cursor:pointer;white-space:nowrap;transition:all .2s;position:relative}
.sub-chip:hover{color:var(--gold);background:rgba(244,184,66,.08)}
.sub-chip.on{color:var(--gold);background:rgba(244,184,66,.14);border-color:var(--line2);box-shadow:0 2px 8px -4px rgba(244,184,66,.4)}
.sub-chip.reset{color:var(--mint2);opacity:.75;font-style:italic}

/* TABS */
.tabs-main{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.tabs-main .tab{padding:10px 16px;border-radius:99px;background:var(--glass);border:1px solid var(--line);color:var(--mint);font:inherit;font-size:.83rem;font-weight:800;cursor:pointer;white-space:nowrap;transition:all .2s}
.tabs-main .tab:hover{border-color:var(--line2);color:var(--gold);transform:translateY(-1px)}
.tabs-main .tab.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0d2b28;border-color:transparent;box-shadow:0 6px 16px -6px rgba(244,184,66,.5)}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.st{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;transition:all var(--tr);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--sh)}
.st:hover{border-color:var(--line2);background:var(--glass2);transform:translateY(-2px);box-shadow:var(--sh-h)}
.st .st-ic{font-size:1.4rem;line-height:1;flex-shrink:0;filter:drop-shadow(0 2px 6px rgba(244,184,66,.25))}
.st .st-body{min-width:0;flex:1}
.st .st-num{font-size:1.35rem;color:var(--gold);font-weight:900;line-height:1;display:block;letter-spacing:-.01em}
.st .st-lbl{font-size:.68rem;color:var(--mint2);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:4px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.warn .st-num{color:var(--red)}

/* FLOOR / AREA */
.floor{margin:22px 0 12px;font-size:.9rem;font-weight:900;color:var(--gold);display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:1px solid var(--line);letter-spacing:.03em}
.floor span:last-child{font-size:.72rem;color:var(--mint2);font-weight:700;opacity:.85}
.area{margin:16px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.area h3{margin:0;font-size:.88rem;color:#fff;font-weight:800;letter-spacing:.02em}
.area::before{content:'';width:4px;height:14px;background:linear-gradient(180deg,var(--gold),var(--gold2));border-radius:2px;flex-shrink:0}
.area small{color:var(--mint2);font-weight:700;font-size:.74rem}

/* CARD KHÁCH */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.bk{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px 15px;display:flex;flex-direction:column;gap:10px;transition:all var(--tr);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--sh);position:relative;overflow:hidden}
.bk:hover{transform:translateY(-3px);border-color:var(--line2);background:var(--glass2);box-shadow:var(--sh-h)}
.bk .h{display:flex;gap:8px;align-items:center}
.bk .tb{font-weight:900;font-size:1rem;color:var(--gold);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.bk .pax{margin-left:auto;font-weight:900;font-size:.72rem;background:linear-gradient(135deg,rgba(244,184,66,.16),rgba(244,184,66,.08));border:1px solid var(--line2);color:var(--gold);border-radius:99px;padding:4px 10px;white-space:nowrap}
.bk .nm{font-weight:900;font-size:.95rem;color:#fff;overflow-wrap:anywhere;line-height:1.3}
.bk .meta{font-size:.72rem;color:var(--mint2);display:flex;flex-wrap:wrap;gap:8px;align-items:center;line-height:1.4}
.bk .meta span{display:inline-flex;align-items:center;gap:3px}

.tags{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.tag{font-size:.76rem;font-weight:700;border-radius:11px;padding:7px 11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);overflow-wrap:anywhere;line-height:1.45;word-break:break-word;display:flex;gap:7px;align-items:flex-start}
.tag b{color:#fff;font-weight:900;flex-shrink:0}
.tag.d{background:rgba(134,239,172,.1);border-color:rgba(134,239,172,.28);color:var(--grn)}
.tag.m{background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.3);color:var(--rose)}
.tag.o{background:rgba(251,215,122,.1);border-color:rgba(251,215,122,.28);color:var(--gold)}

/* EMPTY/ERROR */
.empty{text-align:center;color:var(--mint2);padding:40px 16px;line-height:1.6;border:1px dashed var(--line);border-radius:16px;background:var(--glass);font-size:.88rem}
.err{background:rgba(185,28,28,.22);border:1px solid rgba(239,68,68,.4);border-radius:16px;padding:16px;margin:10px 0;font-size:.85rem;line-height:1.55}
.big{text-align:center;padding:56px 16px;border:2px dashed var(--line);border-radius:20px;background:var(--glass)}
.big b{display:block;font-size:1.5rem;color:var(--gold);margin-bottom:8px;letter-spacing:.02em}
.big span{color:var(--mint);font-size:.88rem}

/* PUSH UI */
.push{display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;margin-top:6px}
.push select{padding:8px 11px;font-size:.8rem;background:rgba(0,0,0,.28);border:1px solid var(--line);color:#fff;border-radius:10px;flex:1 1 auto;min-width:0;transition:border-color .18s;font-family:inherit}
.push select:focus{outline:none;border-color:var(--gold)}
.push .btn{padding:8px 13px;font-size:.76rem;flex:0 0 auto}
.push .msg{flex:1 1 100%;font-size:.71rem;color:var(--mint2);line-height:1.45}
.push .msg.ok{color:var(--grn)}.push .msg.warn{color:var(--red)}

/* BUTTONS */
.btn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0d2b28;border:0;border-radius:11px;padding:10px 15px;font-weight:900;font-size:.83rem;cursor:pointer;transition:all .15s;font-family:inherit;letter-spacing:.01em}
.btn:hover{filter:brightness(1.08);box-shadow:0 6px 18px -6px rgba(244,184,66,.55);transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;filter:none;transform:none}
.btn-ghost{background:var(--glass);border:1px solid var(--line);color:var(--mint);border-radius:11px;padding:10px 15px;font-weight:800;font-size:.82rem;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-ghost:hover{border-color:var(--line2);color:var(--gold);background:var(--glass2)}

/* MODAL */
#dlg,#pushDlg{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:20px;z-index:80;animation:fadeIn .25s ease-out}
#dlg.show,#pushDlg.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.dbox{background:linear-gradient(160deg,#1a4a45,#0d2a28);border:1.5px solid var(--gold);border-radius:22px;padding:22px;max-width:390px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.7),0 0 60px rgba(244,184,66,.18);animation:popIn .32s cubic-bezier(.16,1,.3,1)}
@keyframes popIn{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.dbox p{margin:0 0 16px;white-space:pre-line;font-weight:700;line-height:1.55;overflow-wrap:anywhere;font-size:.9rem}
.drow{display:flex;gap:10px;justify-content:flex-end}

#pushDlg .dbox{max-width:430px;max-height:92vh;overflow-y:auto}
.pkf{margin-bottom:14px}
.pkf label{display:block;font-size:.72rem;font-weight:800;color:var(--mint2);margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em}
.pkf input,.pkf select{width:100%;background:rgba(0,0,0,.32);border:1px solid var(--line);color:#fff;border-radius:11px;padding:11px 13px;font:inherit;font-size:.88rem;transition:all .18s;font-family:inherit}
.pkf input:focus,.pkf select:focus{outline:none;border-color:var(--gold);background:rgba(0,0,0,.5);box-shadow:0 0 0 3px rgba(244,184,66,.12)}
.pkf input[readonly]{opacity:.6;cursor:not-allowed}
.pkf .hint{font-size:.71rem;color:var(--mint2);opacity:.85;margin-top:7px;line-height:1.5}
.pkf .hint.warn{color:var(--red);font-weight:700;opacity:1;background:rgba(185,28,28,.18);border:1px solid rgba(239,68,68,.4);border-radius:10px;padding:9px 11px}
.pkf .req{color:var(--red);font-weight:900}
.pkf#pkFocWrap{background:rgba(185,28,28,.15);border:1px solid rgba(239,68,68,.35);border-radius:12px;padding:12px 14px;margin-top:-4px}
.pkf#pkFocWrap label{color:var(--red)!important}
.pkf#pkFocWrap input{border-color:rgba(239,68,68,.45);background:rgba(0,0,0,.4)}
.pkf#pkFocWrap input:focus{border-color:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.15)}
.pkhd{font-size:1rem;font-weight:900;color:var(--gold);margin-bottom:18px;letter-spacing:.02em}

/* TOAST */
#toast{position:fixed;left:50%;top:calc(20px + env(safe-area-inset-top));transform:translate(-50%,-160%);background:linear-gradient(135deg,#1a4a45,#0d2a28);border:1.5px solid var(--gold);border-radius:14px;padding:12px 20px;font-weight:800;font-size:.85rem;z-index:90;max-width:90vw;box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 30px rgba(244,184,66,.28);transition:transform .42s cubic-bezier(.16,1,.3,1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.show{transform:translate(-50%,0)}

/* RESPONSIVE */
@media(max-width:640px){
  body{padding-left:12px;padding-right:12px}
  .hd{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}
  .hd-meta{display:none}
  .date-wrap input[type=date]{font-size:.78rem;width:110px}
  .grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .seg-main button{font-size:.82rem;padding:11px 6px}
}
@media(max-width:380px){
  .hd-r1 h1{font-size:.95rem}
  .tour-seg button,.today-btn{padding:7px 10px;font-size:.72rem}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="hd">
  <div class="hd-r1">
    <h1>🐬 Danh sách khách</h1>
    <span class="sp"></span>
    <span class="hd-meta" id="upd"></span>
    <span class="hd-meta" id="sheetName"></span>
    <button class="icon-btn" id="reload" title="Tải lại">🔄</button>
  </div>

  <div class="hd-r2">
    <div class="tour-seg">
      <button id="tAm" data-tour="am">☀️ Sáng</button>
      <button id="tDn" data-tour="dn">🌙 Tối</button>
    </div>
    <div class="date-wrap">
      <button id="dPrev" aria-label="Ngày trước">‹</button>
      <input type="date" id="date" aria-label="Chọn ngày">
      <button id="dNext" aria-label="Ngày sau">›</button>
    </div>
    <button class="today-btn" id="dToday">Hôm nay</button>
    <div class="search-wrap">
      <input id="q" placeholder="Tìm tên, mã, đại lý, bàn...">
    </div>
  </div>
</div>

<div class="seg-main" id="segMain">
  <button data-f="all">📋 Tất cả</button>
  <button data-f="Tầng 1">1️⃣ Tầng 1</button>
  <button data-f="Tầng 2">2️⃣ Tầng 2</button>
</div>
<div class="sub-row" id="subRow"></div>

<div class="tabs-main" id="tabs"></div>

<div id="out"></div>

<div id="toast" role="status"></div>

<div id="pushDlg" role="dialog" aria-modal="true">
  <div class="dbox">
    <div class="pkhd">📤 Gửi vào Bungalow <span id="pkRoom" style="color:var(--gold)"></span></div>
    <div class="pkf">
      <label>Tên khách</label>
      <input id="pkName" readonly>
    </div>
    <div class="pkf">
      <label>Số bàn NH</label>
      <input id="pkTable" readonly>
    </div>
    <div class="pkf">
      <label>Phương thức thanh toán <span class="req">*</span></label>
      <select id="pkPayment" onchange="togglePkFocReason()">
        <option value="">-- Chọn --</option>
        <option value="Tiền mặt">💵 Tiền mặt</option>
        <option value="Chuyển khoản">🏦 Chuyển khoản</option>
        <option value="Visa">💳 Visa</option>
        <option value="TA chưa thanh toán">⏳ TA chưa thanh toán</option>
        <option value="TA đã thanh toán">✅ TA đã thanh toán</option>
        <option value="FOC">🎁 FOC (Miễn phí)</option>
      </select>
    </div>
    <div class="pkf" id="pkFocWrap" style="display:none">
      <label>🎁 Lý do FOC <span class="req">*</span></label>
      <input id="pkFocReason" placeholder="VD: Khách VIP, đối tác, bù lỗi dịch vụ...">
    </div>
    <div class="pkf">
      <label>NV mở phòng <span class="req">*</span></label>
      <input id="pkStaff" placeholder="Tên NV...">
      <div id="pkStaffLock" class="hint warn" style="display:none">🔒 Đã khóa — phòng đã được mở bởi <b id="pkStaffLockName"></b></div>
    </div>
    <div id="pkWarn" class="pkf hint warn" style="display:none;margin-bottom:12px"></div>
    <div class="drow">
      <button type="button" class="btn-ghost" id="pkNo">Hủy</button>
      <button type="button" class="btn" id="pkYes">✓ Xác nhận gửi</button>
    </div>
  </div>
</div>

<div id="dlg" role="dialog" aria-modal="true">
  <div class="dbox">
    <p id="dlgMsg"></p>
    <div class="drow">
      <button class="btn-ghost" id="dlgNo">Hủy</button>
      <button class="btn" id="dlgYes">Xác nhận</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var SHEET_ID='1aZ34XVKqWwxMlOPSu6X0vApLT5DFxjDpza9fDRaXM2Q';
var BASE_NAME='__khong_ton_tai__';
var ROOMS=['201','202','203','204','301','302','303','304','305','306','401','402','403','404','405','406'];
var REFRESH_MS=60000;
var $=function(id){return document.getElementById(id)};
var store={
  get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

var LAYOUT=[
  {f:'Tầng 1', a:['A','B','C','D','E']},
  {f:'Tầng 2', a:['J','Q','Lounge']}
];

var B=[],tab='ov',query='';
var floor=store.get('dg_floor','all');
var area=store.get('dg_area',null);
function vnToday(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh'}).format(new Date())}
function vnHour(){return parseInt(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Ho_Chi_Minh',hour:'2-digit',hour12:false}).format(new Date()),10)%24}
var curDate=vnToday(),tour=vnHour()<15?'am':'dn',status='loading',foundName='',pick={},pushing=false;
function dm(d){var p=d.split('-');return p[2]+'.'+p[1]}
function shiftDay(d,n){var t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)}
function candidates(){
  var x=dm(curDate);
  return tour==='am'?['DOLPHIN '+x,'Dolphin '+x,'DOLPHIN DAY '+x]
    :['DINNER DOLPHIN '+x,'Dinner DOLPHIN '+x,'DOLPHIN DINNER '+x,'Dinner Dolphin '+x,'DOLPHIN Dinner '+x,'Dolphin Dinner '+x];
}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show')},3000)}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function csv(t){
  var r=[],row=[],f='',q=false,i,c;
  for(i=0;i<t.length;i++){c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'){row.push(f);r.push(row);row=[];f=''}
    else if(c!=='\r')f+=c;
  }
  row.push(f);r.push(row);return r;
}
function normalizeTables(s){return (s||'').replace(/LOUNGE\s*/gi,'L')}
function tables(s){
  var out=[],re=/([A-Z])(\d+)(?:\s*[-–]\s*[A-Z]?(\d+))?/gi,m,a,b,n;
  while((m=re.exec(s))){
    a=+m[2];b=m[3]?+m[3]:a;
    for(n=Math.min(a,b);n<=Math.max(a,b)&&n<=Math.min(a,b)+60;n++)out.push(m[1].toUpperCase()+n);
  }
  return out;
}
function areaName(letter){if(letter==='L')return 'Lounge';return letter}
function seg(s){return (s||'').split(/\n+|\s{3,}|\s\+\s(?=-)/).map(function(x){return x.replace(/^[\s\-–=>+]+/,'').trim()}).filter(Boolean)}
var BUNG=/bungalow/i,LOB=/tôm hùm|lobster/i;
var DIET=/chay|veg|không ăn|ko ăn|kiêng|no (beef|pork|cabbage|seafood|spicy|meat)|halal|dị ứng|allerg|không dùng/i;
function dietType(s){
  if(/non[\s-]?veg/i.test(s))return 'Non-veg';
  if(/chay/i.test(s))return 'Chay Việt';
  if(/veg/i.test(s))return 'Veg';
  return 'Kiêng ăn';
}
function parse(rows){
  return rows.filter(function(r){return /^\d+$/.test((r[0]||'').trim())&&((r[3]||'').trim()||(r[1]||'').trim())}).map(function(r){
    var c=r.map(function(x){return (x||'').trim()});
    var rawTbl=normalizeTables(c[6]);
    var tb=tables(rawTbl);
    var b={stt:c[0],code:c[1],agent:c[2],name:c[3],pax:parseInt(c[4],10)||0,nat:c[5],tbl:c[6],tb:tb,
      areas:tb.map(function(t){return areaName(t[0])}).filter(function(v,i,a){return a.indexOf(v)===i}),
      bung:[],lob:[],diet:[]};
    var segs=seg(c[7]).concat(seg(c[8]).filter(function(x){return BUNG.test(x)}));
    segs.forEach(function(s){
      if(BUNG.test(s)){
        var n=s.match(/(\d+)\s*bungalow/i),num=s.match(/bungalow\s*(deck\s*\d+|\d+)/i),cnt=n?+n[1]:1,room=num?num[1]:'';
        if(n&&ROOMS.indexOf(n[1])>-1){room=n[1];cnt=1}
        if(cnt<1||cnt>10)cnt=1;
        b.bung.push({s:s,n:cnt,num:room});
      }
      if(LOB.test(s)){b.lob.push(s)}
      else if(DIET.test(s)){b.diet.push({t:dietType(s),s:s})}
    });
    return b;
  });
}
function scopeOk(b){
  if(floor==='all') return true;
  var fl=LAYOUT.filter(function(x){return x.f===floor})[0];
  if(!fl) return true;
  if(!fl.a.some(function(a){return b.areas.indexOf(a)>-1})) return false;
  if(area) return b.areas.indexOf(area)>-1;
  return true;
}
function match(b){
  if(!scopeOk(b))return false;
  if(!query)return true;
  return (b.code+' '+b.name+' '+b.agent+' '+b.tbl+' '+b.nat).toLowerCase().indexOf(query)>-1;
}

function bungTxt(x){return x.s||'Bungalow'}
function tagHtml(b){
  var h='';
  b.diet.forEach(function(d){h+='<span class="tag d">🥗 <b>'+esc(d.t)+'</b> '+esc(d.s)+'</span>'});
  b.lob.forEach(function(t){h+='<span class="tag m">🦞 '+esc(t)+'</span>'});
  b.bung.forEach(function(x){h+='<span class="tag o">🌴 '+esc(bungTxt(x))+'</span>'});
  return h?'<div class="tags">'+h+'</div>':'';
}
function card(b){
  var meta='';
  if(b.agent) meta+='<span>🏢 '+esc(b.agent)+'</span>';
  if(b.nat) meta+='<span>🌍 '+esc(b.nat)+'</span>';
  if(b.code) meta+='<span>🎫 '+esc(b.code)+'</span>';
  return '<div class="bk">'+
    '<div class="h"><span class="tb">'+esc(b.tbl||'Chưa xếp')+'</span><span class="pax">'+b.pax+' khách</span></div>'+
    '<div class="nm">'+esc(b.name)+'</div>'+
    '<div class="meta">'+meta+'</div>'+
    tagHtml(b)+'</div>';
}
function statBox(icon,num,lbl,warn){return '<div class="st'+(warn?' warn':'')+'"><div class="st-ic">'+icon+'</div><div class="st-body"><span class="st-num">'+num+'</span><span class="st-lbl">'+lbl+'</span></div></div>'}
function nBung(L){return L.reduce(function(n,b){return n+b.bung.reduce(function(m,x){return m+x.n},0)},0)}

function viewOverview(L){
  var areas={},tot=0,tset={},known={};
  LAYOUT.forEach(function(f){f.a.forEach(function(a){known[a]=1})});
  L.forEach(function(b){
    var t=b.tb.length?b.tb:['?'],per=b.pax/t.length;
    t.forEach(function(x){
      var an=areaName(x[0]);
      var A=areas[an]||(areas[an]={pax:0,tbl:{},bks:[]});
      A.pax+=per;A.tbl[x]=1;tset[x]=1;
    });
    (b.areas.length?b.areas:['?']).forEach(function(a){
      var A=areas[a]||(areas[a]={pax:0,tbl:{},bks:[]});
      if(A.bks.indexOf(b)<0) A.bks.push(b);
    });
    tot+=b.pax;
  });
  var h='<div class="stats">'+
    statBox('👥',tot,'tổng khách')+
    statBox('📋',L.length,'booking')+
    statBox('🪑',Object.keys(tset).length,'bàn')+
    statBox('🌴',nBung(L),'bungalow đã đặt')+'</div>';

  function areaLabel(a){if(a==='?') return 'Chưa xếp bàn';return 'Khu '+a}
  function areaBlock(a){
    var A=areas[a];
    if(!A||!A.bks.length) return '';
    var r='<div class="area"><h3>'+esc(areaLabel(a))+'</h3><small>'+Math.round(A.pax)+' khách · '+Object.keys(A.tbl).length+' bàn</small></div>';
    r+='<div class="grid">';
    A.bks.slice().sort(function(x,y){return x.tbl.localeCompare(y.tbl,'vi',{numeric:true})}).forEach(function(b){r+=card(b)});
    return r+'</div>';
  }

  LAYOUT.forEach(function(fl){
    if(floor!=='all' && fl.f!==floor) return;
    var list=fl.a.filter(function(a){return !area||area===a});
    var visible=list.filter(function(a){return areas[a]&&areas[a].bks.length});
    if(!visible.length) return;
    var fp=0; visible.forEach(function(a){fp+=areas[a].pax});
    h+='<div class="floor"><span>'+esc(fl.f)+'</span><span>'+Math.round(fp)+' khách tại bàn</span></div>';
    visible.forEach(function(a){h+=areaBlock(a)});
  });

  if(floor==='all' && !area){
    var other=Object.keys(areas).filter(function(a){return !known[a]&&areas[a].bks.length}).sort();
    if(other.length){
      h+='<div class="floor"><span>Khu chưa xếp tầng</span><span></span></div>';
      other.forEach(function(a){h+=areaBlock(a)});
    }
  }
  return h;
}
function viewSpecial(L){
  var S=L.filter(function(b){return b.diet.length||b.lob.length});
  var cnt={'Chay Việt':0,'Veg':0,'Non-veg':0,'Kiêng ăn':0},lob=0;
  S.forEach(function(b){b.diet.forEach(function(d){cnt[d.t]++});lob+=b.lob.length});
  var h='<div class="stats">'+
    statBox('🥗',cnt['Chay Việt'],'Chay Việt')+
    statBox('🥬',cnt['Veg'],'Veg')+
    statBox('🍖',cnt['Non-veg'],'Non-veg')+
    statBox('🚫',cnt['Kiêng ăn'],'Kiêng khác')+
    statBox('🦞',lob,'Tôm hùm')+'</div>';
  if(!S.length)return h+'<div class="empty">Không có khách nào có yêu cầu ăn đặc biệt hoặc tôm hùm.</div>';
  h+='<div class="grid">';
  S.forEach(function(b){h+=card(b)});
  return h+'</div>';
}
function pushKey(b,i,j){return curDate+'|'+tour+'|'+b.stt+'|'+i+'|'+j}
function pushBlock(b,i,j,x){
  var k=pushKey(b,i,j),room=pick[k]!==undefined?pick[k]:(ROOMS.indexOf(x.num)>-1?x.num:'');
  pick[k]=room;
  var BS=window.BunSync,ex=room&&BS&&BS.rooms[room];
  var isToday=curDate===vnToday(),ready=BS&&BS.ready,msg='',cls='';
  if(!BS||(!ready&&!BS.error)){msg='⏳ Đang kết nối...'}
  else if(BS.error){msg='❌ Không kết nối';cls='warn'}
  else if(!isToday){msg='Chỉ gửi cho hôm nay';cls='warn'}
  else if(ex&&ex.customerName){
    if(ex.customerName===b.name&&ex.restaurantTable===b.tbl){msg='✅ Đã có trong app';cls='ok'}
    else{msg='⚠️ P.'+room+' đang có khách: '+ex.customerName;cls='warn'}
  }else if(room)msg='P.'+room+' đang trống';
  var opts='<option value="">— chọn phòng —</option>'+ROOMS.map(function(r){return '<option'+(r===room?' selected':'')+'>'+r+'</option>'}).join('');
  var dis=(!ready||BS.error||!isToday||!room)?' disabled':'';
  return '<div class="push"><select data-pk="'+esc(k)+'">'+opts+'</select>'+
    '<button class="btn" data-push="'+esc(k)+'"'+dis+'>📤 Gửi</button>'+(msg?'<div class="msg '+cls+'">'+esc(msg)+'</div>':'')+'</div>';
}
function viewBung(L){
  var S=L.filter(function(b){return b.bung.length});
  var h='<div class="stats">'+
    statBox('📋',S.length,'booking có bungalow')+
    statBox('🌴',nBung(L),'tổng bungalow')+'</div>';
  if(!S.length)return h+'<div class="empty">Chưa có khách nào đặt bungalow trong danh sách này.</div>';
  h+='<div class="grid">';
  S.forEach(function(b){
    var p='';
    b.bung.forEach(function(x,i){for(var j=0;j<Math.min(x.n,6);j++)p+=pushBlock(b,i,j,x)});
    h+=card(b).replace(/<\/div>$/,p+'</div>');
  });
  return h+'</div>';
}

var pushCtx=null;
function doPush(k){
  var m=k.split('|'),b=B.filter(function(x){return x.stt===m[2]})[0],room=pick[k],BS=window.BunSync;
  if(pushing||!b||!room||!BS||!BS.ready)return;
  if(curDate!==vnToday()){toast('Chỉ gửi được cho ngày hôm nay');return}
  var ex=BS.rooms[room];
  var before=(ex&&ex.customerName)||'';
  var beforeStaff=(ex&&ex.openedByStaff)||'';
  var beforePayment=(ex&&ex.paymentMethod)||'';
  var who='';try{who=localStorage.getItem('dolphinStaffName')||''}catch(e){}
  pushCtx={b:b,room:room,before:before};
  $('pkRoom').textContent='P.'+room;
  $('pkName').value=b.name||'';
  $('pkTable').value=b.tbl||'';
  $('pkPayment').value=beforePayment;
  $('pkFocReason').value=(ex&&ex.focReason)||'';
  togglePkFocReason();
  var inp=$('pkStaff'),lock=$('pkStaffLock'),lockName=$('pkStaffLockName');
  if(beforeStaff){
    inp.value=beforeStaff;inp.readOnly=true;inp.style.opacity=.6;
    lock.style.display='block';lockName.textContent=beforeStaff;
  }else{
    inp.value=who;inp.readOnly=false;inp.style.opacity=1;lock.style.display='none';
  }
  var w=$('pkWarn');
  if(before){w.style.display='block';w.textContent='⚠️ P.'+room+' đang có khách "'+before+'". Gửi sẽ ghi đè thông tin cũ.'}
  else w.style.display='none';
  $('pushDlg').classList.add('show');
  setTimeout(function(){if(!inp.readOnly)inp.focus()},120);
}
function closePushDlg(){
  $('pushDlg').classList.remove('show');
  var w=$('pkFocWrap');if(w)w.style.display='none';
  var i=$('pkFocReason');if(i)i.value='';
  pushCtx=null;
}
window.togglePkFocReason=function(){
  var sel=$('pkPayment'),wrap=$('pkFocWrap');
  if(!sel||!wrap)return;
  var isFoc=sel.value==='FOC';
  wrap.style.display=isFoc?'block':'none';
  if(isFoc){var inp=$('pkFocReason');if(inp)setTimeout(function(){inp.focus()},50)}
};
function submitPush(){
  if(!pushCtx||pushing)return;
  var pm=($('pkPayment').value||'').trim();
  var fr=($('pkFocReason').value||'').trim();
  var sn=($('pkStaff').value||'').trim();
  if(!pm){toast('Chọn phương thức thanh toán');$('pkPayment').focus();return}
  if(pm==='FOC'&&!fr){toast('Nhập lý do FOC');$('pkFocReason').focus();return}
  if(!sn){toast('Nhập tên NV mở phòng');$('pkStaff').focus();return}
  var BS=window.BunSync;
  if(!BS||!BS.ready){toast('App Bungalow chưa kết nối');return}
  var cur=BS.rooms[pushCtx.room],now=(cur&&cur.customerName)||'';
  if(now!==pushCtx.before){toast('P.'+pushCtx.room+' vừa thay đổi');closePushDlg();return}
  pushing=true;
  var who='';try{who=localStorage.getItem('dolphinStaffName')||''}catch(e){}
  var data={
    customerName:pushCtx.b.name||'',
    restaurantTable:pushCtx.b.tbl||'',
    paymentMethod:pm,
    focReason:pm==='FOC'?fr:'',
    openedByStaff:sn,
    updatedBy:who||sn||'Sheet',
    updatedAt:Date.now(),
    source:'google-sheet',
    sheetCode:pushCtx.b.code||''
  };
  var roomN=pushCtx.room;
  BS.push(roomN,data).then(function(){
    toast('✅ Đã gửi vào P.'+roomN);
    closePushDlg();
  }).catch(function(e){toast('❌ Lỗi gửi: '+(e&&e.message||e))})
    .then(function(){pushing=false});
}

function renderFilter(){
  document.querySelectorAll('#segMain button').forEach(function(b){b.classList.toggle('on',b.dataset.f===floor)});
  var h='';
  if(floor!=='all'){
    var fl=LAYOUT.filter(function(x){return x.f===floor})[0];
    if(fl){
      var hasBk={};
      B.forEach(function(b){b.areas.forEach(function(a){hasBk[a]=1})});
      var sub=fl.a.filter(function(a){return hasBk[a]});
      if(sub.length){
        if(area) h+='<button class="sub-chip reset" data-a="all">⟲ Tất cả khu</button>';
        h+=sub.map(function(a){return '<button class="sub-chip'+(area===a?' on':'')+'" data-a="'+esc(a)+'">Khu '+esc(a)+'</button>'}).join('');
      }
    }
  }
  $('subRow').innerHTML=h;
  $('subRow').style.display=h?'flex':'none';
}

function render(){
  var L=B.filter(match);
  var h;
  var dd=curDate.split('-').reverse().join('/');
  if(status==='loading'&&!B.length)h='<div class="empty">⏳ Đang tải danh sách...</div>';
  else if(status==='error')h=$('out').innerHTML;
  else if(status==='missing')h=tour==='dn'
    ?'<div class="big"><b>🚢 TÀU ĐỖ — KHÔNG CHẠY</b><span>Không có tour tối ngày '+dd+'.</span></div>'
    :'<div class="big"><b>📄 Chưa có danh sách tour sáng</b><span>Ngày '+dd+' chưa có sheet "DOLPHIN '+dm(curDate)+'".</span></div>';
  else if(!B.length)h='<div class="empty">Sheet "'+esc(foundName)+'" chưa có khách.</div>';
  else h=tab==='ov'?viewOverview(L):tab==='sp'?viewSpecial(L):viewBung(L);
  $('out').innerHTML=h;
  $('tAm').classList.toggle('on',tour==='am');
  $('tDn').classList.toggle('on',tour==='dn');
  $('dToday').classList.toggle('on',curDate===vnToday());
  $('sheetName').textContent=(foundName?'📄 '+foundName:'')+(titlesKnown?'':'  ⚠️ Tab ẩn'+(titlesErr?' — '+titlesErr:''));
  var T=[['ov','🏠 Tổng quan'],['sp','🥗 Ăn đặc biệt · Tôm hùm'],['bg','🌴 Bungalow']];
  $('tabs').innerHTML=T.map(function(t){return '<button class="tab'+(tab===t[0]?' on':'')+'" data-t="'+t[0]+'">'+t[1]+'</button>'}).join('');
  renderFilter();
}

function gv(name){return 'https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent(name)+'&_='+Date.now()}
function getTab(name){
  return fetch(gv(name)).then(function(r){return r.ok?r.text():null}).then(function(t){
    if(t&&/^\s*<(!doctype|html)/i.test(t))throw new Error('Sheet chưa được chia sẻ công khai');
    return t;
  });
}
var loadSeq=0,titlesKnown=true;
var API_KEY='AIzaSyAtBNp9WBnyIkCiVjXfUpjH2d7-9dbg-JQ';
var titlesErr='';
function getTitles(){
  var u='https://sheets.googleapis.com/v4/spreadsheets/'+SHEET_ID+'?fields=sheets.properties(title,hidden)&key='+API_KEY;
  return fetch(u).then(function(r){
    if(r.ok)return r.json();
    return r.json().then(function(j){throw new Error((j.error&&j.error.message)||('HTTP '+r.status))},function(){throw new Error('HTTP '+r.status)});
  }).then(function(j){
    return (j.sheets||[]).map(function(x){return x.properties}).filter(function(p){return !p.hidden}).map(function(p){return p.title});
  });
}
function pickTitle(titles){
  var x=dm(curDate);
  return titles.filter(function(t){
    var l=t.toLowerCase().replace(/\s+/g,' ').trim();
    if(!/dolphin/.test(l)||/\bcap\b/.test(l)||l.slice(-x.length)!==x)return false;
    return tour==='dn'?/dinner/.test(l):!/dinner/.test(l);
  })[0]||null;
}
function findByGuess(){
  var cand=candidates();
  var probe='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&_='+Date.now();
  return fetch(probe).then(function(r){return r.text()},function(){throw new Error('Không kết nối được tới Google Sheets')}).then(function(t){
    if(/^\s*<(!doctype|html)/i.test(t))throw new Error('Sheet chưa được chia sẻ công khai');
    return getTab(BASE_NAME).catch(function(){return null});
  }).then(function(base){
    function find(i){
      if(i>=cand.length)return Promise.resolve(null);
      return getTab(cand[i]).catch(function(){return null}).then(function(t){return(t!==null&&t!==base)?{name:cand[i],text:t}:find(i+1)});
    }
    return find(0);
  });
}
function load(){
  var my=++loadSeq,btn=$('reload');btn.disabled=true;status='loading';
  return getTitles().then(function(t){titlesErr='';return t},function(e){titlesErr=e.message||'';return null}).then(function(titles){
    titlesKnown=!!titles;
    if(!titles)return findByGuess();
    var name=pickTitle(titles);
    return name?getTab(name).then(function(t){return t===null?null:{name:name,text:t}}):null;
  }).then(function(f){
    if(my!==loadSeq)return;
    if(!f){status='missing';B=[];foundName=''}
    else{status='ok';foundName=f.name;B=parse(csv(f.text))}
    $('upd').textContent='Cập nhật '+new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
  }).catch(function(e){
    if(my!==loadSeq)return;
    status='error';B=[];foundName='';
    $('out').innerHTML='<div class="err">⚠️ Không tải được dữ liệu ('+esc(e.message)+').<br>Kiểm tra: Google Sheet đang để <b>"Bất kỳ ai có đường liên kết đều xem được"</b> và mạng còn hoạt động.</div>';
  }).then(function(){if(my===loadSeq){btn.disabled=false;render()}});
}

function setDate(d){if(!d)return;curDate=d;$('date').value=d;reset();load()}
function setTour(t){tour=t;reset();load()}
$('date').value=curDate;

$('dPrev').onclick=function(){setDate(shiftDay(curDate,-1))};
$('dNext').onclick=function(){setDate(shiftDay(curDate,1))};

$('tabs').onclick=function(e){var t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;render()}};

$('segMain').onclick=function(e){
  var b=e.target.closest('[data-f]');
  if(!b)return;
  floor=b.dataset.f;
  area=null;
  store.set('dg_floor',floor);
  store.set('dg_area',null);
  render();
};
$('subRow').onclick=function(e){
  var b=e.target.closest('[data-a]');
  if(!b)return;
  var v=b.dataset.a;
  area=(v==='all'||!v)?null:v;
  store.set('dg_area',area);
  render();
};

$('out').onchange=function(e){var k=e.target.dataset&&e.target.dataset.pk;if(k){pick[k]=e.target.value;render()}};
$('out').onclick=function(e){var t=e.target.closest('[data-push]');if(t)doPush(t.dataset.push)};
function typing(){var a=document.activeElement;return !!(a&&a.closest&&a.closest('.push'))}
window.addEventListener('bunrooms',function(){if(tab==='bg'&&status==='ok'&&!typing())render()});

$('pkNo').onclick=closePushDlg;
$('pkYes').onclick=submitPush;
$('pushDlg').addEventListener('click',function(e){if(e.target===this)closePushDlg()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('pushDlg').classList.contains('show'))closePushDlg()});

load();
setInterval(function(){if(!document.hidden&&!typing())load()},REFRESH_MS);
})();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyAtBNp9WBnyIkCiVjXfUpjH2d7-9dbg-JQ",authDomain:"dolphin-f6d67.firebaseapp.com",projectId:"dolphin-f6d67"});
const db=getFirestore(app);
const BS=window.BunSync={rooms:{},ready:false,error:null,push:(room,data)=>setDoc(doc(db,'bun_tables',room),data,{merge:true})};
const fire=()=>window.dispatchEvent(new Event('bunrooms'));
signInAnonymously(getAuth(app)).then(()=>{
  onSnapshot(collection(db,'bun_tables'),s=>{const r={};s.forEach(d=>r[d.id]=d.data());BS.rooms=r;BS.ready=true;BS.error=null;fire()},e=>{BS.error=e.message;fire()});
}).catch(e=>{BS.error=e.message;fire()});
</script>
