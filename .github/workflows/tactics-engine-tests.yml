name: Dolphin Tactics Engine Tests
on:
  pull_request:
    paths:
      - "functions/tactics/**"
      - "functions/index.js"
      - "functions/package.json"
      - "giaitri/games/tactics-online/**"
      - "dolphin-multiplayer.js"
  push:
    paths:
      - "functions/tactics/**"
      - "functions/index.js"
      - "functions/package.json"
      - "giaitri/games/tactics-online/**"
      - "dolphin-multiplayer.js"
jobs:
  engine-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate engine and tests
        run: |
          cd functions && npm test
          node --test ../giaitri/games/tactics-online/hero-identity.test.js ../giaitri/games/tactics-online/weapon-animation.test.js ../giaitri/games/tactics-online/combat-performance.test.js ../giaitri/games/tactics-online/combat-timeline.test.js ../giaitri/games/tactics-online/hero-quality.test.js ../giaitri/games/tactics-online/model-loader.test.js
      - name: Validate atomic online rooms and worker simulation
        run: node --test giaitri/games/tactics-online/online-transport.test.js giaitri/games/tactics-online/simulation-client.test.js giaitri/games/tactics-online/tactics-ui.test.js
