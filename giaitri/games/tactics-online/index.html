function tickReplay(){

 });

  const eventIndex=replay.index++;

  if(e.type==='mana'&&node){const stat=battleHealth.get(e.actor)||{hp:1,max:1};stat.mana=e.amount;stat.manaMax=e.max||1;battleHealth.set(e.actor,stat);Visuals.updateBars(node,Math.max(0,stat.hp/stat.max),Math.max(0,Math.min(1,stat.mana/stat.manaMax)));}

  if(e.type==='stun'&&target){CombatFX.pulse(stageScene,target,'stun',.65);playCombatSound('stun');}
  if(e.type==='burn'&&target){CombatFX.pulse(stageScene,target,'burn',.6);playCombatSound('burn');}

  if(e.type==='move'&&node){
   Animator.play(node,'run',performance.now(),{to:new THREE.Vector3((e.x-3.5)*.94,0,((replay.mirror?7-e.y:e.y)-3.5)*.86)});
  }

   if(node){if(!CombatCues.consume(eventIndex))Animator.play(node,e.type==='cast'?'cast':'attack');if(e.type==='cast'){Animator.burst(stageScene,node,'cast');CombatFX.pulse(stageScene,target,e.skill||'spell',1);}Visuals.strike(stageScene,node,target,e.type==='cast',visualFX);}

  }

 }

 if(pinchDistance>0&&d>0){zoomLevel=Math.max(.7,Math.min(2.4,zoomLevel*d/pinchDistance));if(camera){camera.zoom=zoomLevel;camera.updateProjectionMatrix();}lastPinchAt=Date.now();}
 pinchDistance=d;syncBattleHudScale();e.preventDefault();
},{passive:false});
function endPinch(e){pinchPointers.delete(e.pointerId);if(pinchPointers.size<2)pinchDistance=0;}
$('stage').addEventListener('pointerup',endPinch);
$('stage').addEventListener('pointercancel',endPinch);
$('stage').addEventListener('pointerdown',e=>{
 if(pinchPointers.size>1||Date.now()-lastPinchAt<350)return;
 if(e.target===renderer?.domElement&&state?.roundPhase==='COMBAT'){inspectCombatUnit(e.clientX,e.clientY);return;}
  if(e.target!==renderer?.domElement||!state||state.roundPhase!=='PREPARATION')return;
 const id=boardUnitAt(e.clientX,e.clientY);
 if(id)dragUnit={id,source:'board',x:e.clientX,y:e.clientY};
});
$('bench').addEventListener('pointerdown',e=>{

 if(!button||!state||state.roundPhase!=='PREPARATION')return;

function clearUnitDragFeedback(){document.querySelectorAll('#bench .isDragSource,#bench .isDropTarget,.benchBar.isDropTarget').forEach(node=>node.classList.remove('isDragSource','isDropTarget'));}
document.addEventListener('pointermove',e=>{if(!dragUnit)return;document.querySelectorAll('#bench .isDropTarget,.benchBar.isDropTarget').forEach(node=>node.classList.remove('isDropTarget'));if(Math.hypot(e.clientX-dragUnit.x,e.clientY-dragUnit.y)<15)return;const hit=document.elementFromPoint(e.clientX,e.clientY),b=hit?.closest?.('#bench [data-bench]');if(b)b.classList.add('isDropTarget');else if(hit?.closest?.('.benchBar'))$('bench').closest('.benchBar')?.classList.add('isDropTarget');},{passive:true});
document.addEventListener('pointercancel',()=>{dragUnit=null;clearUnitDragFeedback();});
document.addEventListener('pointerup',e=>{
  clearUnitDragFeedback();
 if(Date.now()-lastPinchAt<350){dragUnit=null;return;}
 if(!dragUnit)return;
 const drag=dragUnit;dragUnit=null;
 if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<20||state?.roundPhase!=='PREPARATION')return;
 const element=document.elementFromPoint(e.clientX,e.clientY);
 const benchButton=element?.closest?.('#bench [data-bench]');
 if(benchButton){
  const slot=benchButton.dataset.bench;
  if(drag.source==='board'){send({type:'MOVE',unitId:drag.id,to:'bench',index:String(slot)});selected=null;}
  return;
 }
 // If dropped onto the bench strip between buttons, choose the first empty bench slot.
 const benchRect=$('bench').getBoundingClientRect();
 if(drag.source==='board'&&e.clientX>=benchRect.left&&e.clientX<=benchRect.right&&e.clientY>=benchRect.top&&e.clientY<=benchRect.bottom){
  const p=state.players[uid],free=Array.from({length:8},(_,i)=>String(i)).find(i=>!p.bench[i]);
  if(free!==undefined){send({type:'MOVE',unitId:drag.id,to:'bench',index:free});selected=null;}
  else info('Hàng chờ đầy: thả vào một ô có tướng để hoán đổi.');
  return;
 }
 const tile=boardHit(e.clientX,e.clientY);
 if(tile&&tile.row>=4){
  send({type:'MOVE',unitId:drag.id,to:'board',index:'r'+(tile.row-4)+'c'+tile.col});
  selected=null;
 }
});
// Inventory drag-and-drop shares the existing EQUIP engine command and validations.
const trayRoot=$('touchItemTray');
trayRoot.addEventListener('pointerdown',e=>{
 const tile=e.target.closest('[data-item-index]');
 if(!tile||tile.disabled||state?.roundPhase!=='PREPARATION'||state.players?.[uid]?.ready)return;
 const index=Number(tile.dataset.itemIndex),item=state.players?.[uid]?.inventory?.[index];
 if(!item)return;
 e.preventDefault();
 const ghost=tile.cloneNode(true);ghost.removeAttribute('data-item-index');ghost.classList.add('touchGearGhost');
 document.body.appendChild(ghost);
 itemDrag={pointer:e.pointerId,item,startX:e.clientX,startY:e.clientY,ghost};
 ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
 try{tile.setPointerCapture(e.pointerId);}catch(_){}
});
document.addEventListener('pointermove',e=>{
 if(!itemDrag||itemDrag.pointer!==e.pointerId)return;
 e.preventDefault();itemDrag.ghost.style.left=e.clientX+'px';itemDrag.ghost.style.top=e.clientY+'px';
});
function finishGearDrag(e){
 if(!itemDrag||itemDrag.pointer!==e.pointerId)return;
 const drag=itemDrag;itemDrag=null;drag.ghost.remove();
 if(e.type==='pointercancel')return;
 const p=state?.players?.[uid];
 if(!p||state.roundPhase!=='PREPARATION'||p.ready||!p.inventory.includes(drag.item))return;
 let target=boardUnitAt(e.clientX,e.clientY);
 if(!target){
  const b=document.elementFromPoint(e.clientX,e.clientY)?.closest?.('#bench [data-bench]');
  if(b)target=p.bench[Number(b.dataset.bench)];
 }
 if(!target||!p.units[target]){info('Thả trang bị lên tướng trên bàn cờ hoặc hàng chờ.');return;}
 const parts=p.units[target].items||[];
  const recipeAvailable=parts.some(x=>E.RECIPE[[x,drag.item].sort().join('+')]);
  if(parts.length>=3&&!recipeAvailable){info('Tướng chỉ có tối đa 3 ô trang bị.');return;}
  const match=parts.find(x=>E.RECIPE[[x,drag.item].sort().join('+')]);
  const crafted=match&&E.RECIPE[[match,drag.item].sort().join('+')];
  const before=E.combatStats(p,p.units[target],E.activeTraits(p));
  const proposed={...p.units[target],items:crafted?parts.map(x=>x===match?crafted.id:x):[...parts,drag.item]};
  const after=E.combatStats(p,proposed,E.activeTraits(p));
  const delta=['hp','attack','armor','magicResist','abilityPower','mana'].map(k=>{const v=Math.round((after[k]-before[k])*10)/10;return v?(STAT_LABELS[k]||k)+': '+(v>0?'+':'')+v:null}).filter(Boolean).join(', ');
  if(crafted&&!window.confirm('Ghép '+(itemDef(match)?.name||match)+' + '+(itemDef(drag.item)?.name||drag.item)+' → '+crafted.name+'?\\n'+(crafted.description||EFFECT_LABELS[crafted.effect]||'')+'\\n'+delta))return;
  Promise.resolve(send({type:'EQUIP',unitId:target,component:drag.item})).then(()=>{
   const sparkle=document.createElement('div');sparkle.className='equipSuccessFx';sparkle.textContent='✨ TRANG BỊ';sparkle.style.left=e.clientX+'px';sparkle.style.top=e.clientY+'px';document.body.appendChild(sparkle);setTimeout(()=>sparkle.remove(),850);
  }).catch(showError);
}
document.addEventListener('pointerup',finishGearDrag);
document.addEventListener('pointercancel',finishGearDrag);
function syncPortraitHeader(){const head=$('appShell')?.querySelector('header');if(head)$('appShell').style.setProperty('--tft-header-height',Math.ceil(head.getBoundingClientRect().height)+'px');}
window.addEventListener('resize',syncPortraitHeader,{passive:true});
if(window.ResizeObserver){const header=$('appShell')?.querySelector('header');if(header)new ResizeObserver(syncPortraitHeader).observe(header);}
syncPortraitHeader();
function setup3D(){
 stageScene=new THREE.Scene();stageScene.background=new THREE.Color(0x0a2635);
 camera=new THREE.OrthographicCamera(-4,4,4,-4,.1,80);camera.position.set(0,10,10);camera.up.set(0,1,0);camera.lookAt(0,0,0);
 renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});
 const pixelRatioCeiling=Math.min(window.devicePixelRatio||1,1.35);
 let renderPixelRatio=pixelRatioCeiling,qualityWindowStart=0,qualitySamples=0,qualityFrameTime=0,lastFrameStamp=0;
 renderer.setPixelRatio(renderPixelRatio);
 $('stage').prepend(renderer.domElement);stageScene.add(new THREE.HemisphereLight(0xc1f4ff,0x214052,2.5));
 const light=new THREE.DirectionalLight(0xffe2a9,1.6);light.position.set(2,10,3);stageScene.add(light);
 board=new THREE.Group();characters=new THREE.Group();stageScene.add(board,characters);
 let ground=new THREE.Mesh(new THREE.CylinderGeometry(5.3,5.45,.48,8),new THREE.MeshStandardMaterial({color:0x123848,metalness:.52,roughness:.39}));ground.position.y=-.3;stageScene.add(ground);
 for(let i=0;i<8;i++){const angle=i*Math.PI/4;const pedestal=new THREE.Mesh(new THREE.CylinderGeometry(.18,.29,.55,6),new THREE.MeshStandardMaterial({color:0x2f7180}));pedestal.position.set(Math.cos(angle)*5.4,.06,Math.sin(angle)*5.4);stageScene.add(pedestal);
 const crystal=new THREE.Mesh(new THREE.OctahedronGeometry(.18),new THREE.MeshBasicMaterial({color:i%2?0xffbb77:0x5ff1df}));crystal.position.set(Math.cos(angle)*5.4,.46,Math.sin(angle)*5.4);stageScene.add(crystal);}
 const centralLine=new THREE.Mesh(new THREE.BoxGeometry(7.5,.03,.05),new THREE.MeshBasicMaterial({color:0xf8d686}));centralLine.position.y=.1;stageScene.add(centralLine);
 for(let row=0;row<8;row++)for(let col=0;col<8;col++){
  const m=new THREE.Mesh(new THREE.BoxGeometry(.89,.11,.81),new THREE.MeshStandardMaterial({color:(row+col)%2?(row<4?0x153d53:0x236779):(row<4?0x1d5369:0x307d8e),metalness:.27,roughness:.46,emissive:row<4?0x04202d:0x06312f,emissiveIntensity:.24}));
  m.position.set((col-3.5)*.94,0,(row-3.5)*.86);m.userData.tile={col,row};board.add(m);
 }
 function resize(){let rect=$('stage').getBoundingClientRect();renderer.setSize(rect.width,rect.height,false);const aspect=rect.width/Math.max(1,rect.height),span=Math.max(5.2,5.4/aspect);camera.left=-span*aspect;camera.right=span*aspect;camera.top=span;camera.bottom=-span;camera.zoom=zoomLevel;camera.updateProjectionMatrix();}
 addEventListener('resize',()=>{resize();syncBattleHudScale();});if(window.ResizeObserver)new ResizeObserver(()=>{resize();syncBattleHudScale();}).observe($('stage'));resize();syncBattleHudScale();
 renderer.domElement.addEventListener('pointerup',e=>{
  if(!state||state.roundPhase!=='PREPARATION'||Date.now()-lastPinchAt<350||pinchPointers.size>1)return;
  const rect=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);raycaster.setFromCamera(mouse,camera);
  let unit=raycaster.intersectObjects(characters.children,true)[0];
  if(unit){let target=unit.object;while(target&&!target.userData.unitId)target=target.parent;if(target){selected=target.userData.unitId;paintControls();openUnitPopup(e.clientX,e.clientY,selected);return;}}
  let tile=raycaster.intersectObjects(board.children,false)[0];
  if(tile&&selected){const {col,row}=tile.object.userData.tile;if(row>=4){send({type:'MOVE',unitId:selected,to:'board',index:'r'+(row-4)+'c'+col});selected=null;}}
 });
 let last=0;
 function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden){lastFrameStamp=now;return;}
  if(lastFrameStamp){
   const elapsed=now-lastFrameStamp;
   if(elapsed>0&&elapsed<180){qualityFrameTime+=elapsed;qualitySamples++;}
  }
  lastFrameStamp=now;
  // Adaptive resolution, with a long sampling window to avoid rapid quality oscillation.
  if(!qualityWindowStart)qualityWindowStart=now;
  if(now-qualityWindowStart>=6000){
   if(qualitySamples>=70){
    const avg=qualityFrameTime/qualitySamples;
    const next=avg>43?Math.max(.85,renderPixelRatio-.15):avg<30?Math.min(pixelRatioCeiling,renderPixelRatio+.1):renderPixelRatio;
    if(Math.abs(next-renderPixelRatio)>.01){renderPixelRatio=next;renderer.setPixelRatio(renderPixelRatio);}
   }
   qualityWindowStart=now;qualitySamples=0;qualityFrameTime=0;
  }
  if(now-last<33)return;
  last=now;tickReplay();Animator.tick(stageScene,characterById,now);CombatFX.tick(now);Visuals.animateFX(stageScene,visualFX,now);renderer.render(stageScene,camera);
 }
 requestAnimationFrame(frame);
}
setInterval(()=>{
 if(!state||state.status!=='in_game')return;

 $('timer').textContent=Math.max(0,Math.ceil((state.phaseEndsAt-now)/1000))+'s';
 if(!host||!hostState||now<hostState.phaseEndsAt||advancing)return;
 advancing=true;
 dispatch(async()=>{
  if(!hostState||hostState.status!=='in_game')return;
  E.advance(hostState,Date.now());
  if(offline&&hostState.status==='in_game'&&hostState.roundPhase==='PREPARATION')offlineAI(Date.now());
  await publish();
 }).finally(()=>{advancing=false;});
},500);
