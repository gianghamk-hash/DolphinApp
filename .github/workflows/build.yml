name: Build Dolphin APKs (Staff + Manager)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: staff
            app_name: "Dolphin Staff"
            package_id: "com.dolphin.cruise.staff"
            ua_extra: "DolphinStaff/1.0"
            artifact_name: "DolphinStaff-APK"
          - variant: manager
            app_name: "Dolphin Manager"
            package_id: "com.dolphin.cruise.manager"
            ua_extra: "DolphinManager/1.0"
            artifact_name: "DolphinManager-APK"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Create Android project structure
        env:
          APP_NAME: ${{ matrix.app_name }}
          PKG_ID: ${{ matrix.package_id }}
          UA_EXTRA: ${{ matrix.ua_extra }}
        run: |
          mkdir -p app/src/main/java/com/dolphin/cruise
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/assets

          cat > settings.gradle << 'EOF_SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DolphinApp"
          include ':app'
          EOF_SETTINGS

          cat > build.gradle << 'EOF_ROOT'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF_ROOT

          cat > gradle.properties << 'EOF_PROPS'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.caching=true
          org.gradle.parallel=true
          EOF_PROPS

          cat > app/build.gradle << EOF_APP
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.dolphin.cruise'
              compileSdk 34
              defaultConfig {
                  applicationId "${PKG_ID}"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  release {
                      storeFile file("\${rootDir}/dolphin.keystore")
                      storePassword "dolphin123"
                      keyAlias "dolphin"
                      keyPassword "dolphin123"
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF_APP

          cat > app/src/main/AndroidManifest.xml << 'EOF_MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_MANIFEST

          cat > app/src/main/res/layout/activity_main.xml << 'EOF_LAYOUT'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#123634">
              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
              <ProgressBar
                  android:id="@+id/progressBar"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center" />
          </FrameLayout>
          EOF_LAYOUT

          cat > app/src/main/res/values/strings.xml << EOF_STRINGS
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">${APP_NAME}</string>
          </resources>
          EOF_STRINGS

          cat > app/src/main/java/com/dolphin/cruise/MainActivity.java << EOF_JAVA
          package com.dolphin.cruise;

          import android.annotation.SuppressLint;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ProgressBar;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;

          import java.io.ByteArrayInputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.util.HashMap;
          import java.util.Map;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;
              private ProgressBar progressBar;
              private long lastBackPress = 0L;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webview);
                  progressBar = findViewById(R.id.progressBar);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  s.setUserAgentString(s.getUserAgentString() + " ${UA_EXTRA}");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String host = uri.getHost();
                          if ("appassets.androidplatform.net".equals(host)) {
                              String path = uri.getPath();
                              if (path != null && path.startsWith("/assets/")) {
                                  String assetPath = path.substring("/assets/".length());
                                  try {
                                      InputStream is = getAssets().open(assetPath);
                                      Map<String, String> headers = new HashMap<>();
                                      headers.put("Access-Control-Allow-Origin", "*");
                                      return new WebResourceResponse(
                                              guessMime(assetPath), "utf-8", 200, "OK", headers, is);
                                  } catch (IOException e) {
                                      return new WebResourceResponse(
                                              "text/plain", "utf-8", 404, "Not Found",
                                              new HashMap<String, String>(),
                                              new ByteArrayInputStream("Not found".getBytes()));
                                  }
                              }
                          }
                          return null;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          if (progressBar != null) progressBar.setVisibility(View.GONE);
                      }
                  });

                  // 🌐 Load từ GitHub Pages → OTA update tự động
                  webView.loadUrl("https://gianghamk-hash.github.io/DolphinApp/index.html");
              }

              private static String guessMime(String path) {
                  if (path.endsWith(".html") || path.endsWith(".htm")) return "text/html";
                  if (path.endsWith(".js")) return "application/javascript";
                  if (path.endsWith(".css")) return "text/css";
                  if (path.endsWith(".json")) return "application/json";
                  if (path.endsWith(".png")) return "image/png";
                  if (path.endsWith(".jpg") || path.endsWith(".jpeg")) return "image/jpeg";
                  if (path.endsWith(".svg")) return "image/svg+xml";
                  return "application/octet-stream";
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                      return;
                  }
                  long now = System.currentTimeMillis();
                  if (now - lastBackPress < 2000) {
                      super.onBackPressed();
                  } else {
                      lastBackPress = now;
                      Toast.makeText(this, "Nhan lan nua de thoat", Toast.LENGTH_SHORT).show();
                  }
              }
          }
          EOF_JAVA

          sed -i 's/^          //' settings.gradle build.gradle gradle.properties app/build.gradle
          sed -i 's/^          //' app/src/main/AndroidManifest.xml
          sed -i 's/^          //' app/src/main/res/layout/activity_main.xml
          sed -i 's/^          //' app/src/main/res/values/strings.xml
          sed -i 's/^          //' app/src/main/java/com/dolphin/cruise/MainActivity.java

          cp index.html dolphin-bungalow.html dolphin-lounge.html dolphin-restaurant.html dolphin-show.html app/src/main/assets/
          cp master.js app/src/main/assets/
          mkdir -p app/src/main/assets/manager
          cp manager/dashboard.html app/src/main/assets/manager/

      - name: Generate icons
        run: |
          sudo apt-get install -y imagemagick
          if [ ! -f "icon-source.png" ]; then
            echo "ERROR: icon-source.png not found!"
            exit 1
          fi
          convert icon-source.png -resize 1024x1024^ -gravity center -extent 1024x1024 /tmp/icon_1024.png
          convert /tmp/icon_1024.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert /tmp/icon_1024.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert /tmp/icon_1024.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert /tmp/icon_1024.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert /tmp/icon_1024.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert /tmp/icon_1024.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          convert /tmp/icon_1024.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          convert /tmp/icon_1024.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          convert /tmp/icon_1024.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          convert /tmp/icon_1024.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Auto-update version.json
        run: |
          # Lấy commit hash (7 ký tự)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          
          # Lấy ngày giờ ISO
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Lấy commit message (1 dòng đầu, escape dấu ")
          COMMIT_MSG=$(git log -1 --pretty=%s | sed 's/"/\\"/g' | head -c 200)
          
          # Đọc version cũ từ version.json
          OLD_VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['version'])" 2>/dev/null || echo "1.0.0")
          
          # Tách major.minor.patch
          MAJOR=$(echo $OLD_VERSION | cut -d. -f1)
          MINOR=$(echo $OLD_VERSION | cut -d. -f2)
          PATCH=$(echo $OLD_VERSION | cut -d. -f3)
          
          # Tăng patch +1
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          
          # Tạo version.json mới
          cat > version.json << EOF_VERSION
          {
            "version": "${NEW_VERSION}",
            "buildDate": "${BUILD_TIME}",
            "commit": "${COMMIT_HASH}",
            "notes": "${COMMIT_MSG}",
            "forceUpdate": false
          }
          EOF_VERSION
          
          echo "=== Version updated ==="
          cat version.json

      - name: Commit version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update version [skip ci]"
          git push || true

      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore dolphin.keystore -alias dolphin -keyalg RSA -keysize 2048 -validity 10000 -storepass dolphin123 -keypass dolphin123 -dname "CN=Dolphin, O=Dolphin, C=VN"

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
