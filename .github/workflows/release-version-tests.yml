name: Release version checks
on:
  pull_request:
    paths:
      - 'bump-version.js'
      - 'scripts/bump-version.test.cjs'
      - '.github/workflows/auto-bump.yml'
      - '.github/workflows/release-version-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/bump-version.test.cjs
