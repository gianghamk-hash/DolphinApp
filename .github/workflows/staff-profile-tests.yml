name: Staff profile checks
on:
  pull_request:
    paths: ['dolphin-profile.html','crew-character-card.js','crew-character-card.css','scripts/crew-character-card.test.cjs','scripts/crew-character-card-browser.cjs','dolphin-bungalow.html','dolphin-lounge.html','dolphin-show.html','dolphin-restaurant.html','scripts/staff-operational-auth.test.cjs','staff-profile.css','staff-prestige-profile.js','functions/staff-daily-core.cjs','functions/staff-daily-missions.js','functions/staff-daily-core.test.cjs','functions/staff-daily-missions.test.cjs','functions/staff-daily-arcade.test.cjs','crew-arcade-proof.js','functions/crew-arcade-proof.cjs','crew-arcade-missions.js','giaitri/games/snake.html','giaitri/games/game2048.html','staff-admin-profile.js','functions/staff-approval-push.js','staff-prestige-client.js','dolphin-avatars*','avatar-system.js','staff-profile.js','staff-id.js','staff-access.js','staff-access.css','scripts/staff-access.test.cjs','scripts/crew-v5.test.cjs','scripts/crew-effect-library.test.cjs','scripts/staff-approval-ui.test.cjs','scripts/staff-recovery.test.cjs','scripts/crew-daily-missions-ui.test.cjs','scripts/staff-access-browser.cjs','scripts/staff-approval-browser.cjs','dolphin-navigation.js','service-worker.js','index.html','staff-sync*','staff-online.js','functions/staff-profile.js','functions/staff-manager-adjustments.js','functions/staff-manager-adjustments.test.cjs','manager-apk-profile.js','functions/staff-prestige.js','functions/staff-prestige.test.cjs','functions/staff-xp-rank-sync.js','functions/staff-xp-rank-sync.test.cjs','functions/staff-xp-actions.js','functions/staff-xp-actions.test.cjs','functions/staff-avatar-catalog.json','functions/staff-id.test.js','functions/index.js','scripts/avatar-sync-browser.cjs','scripts/crew-cosmetics.test.cjs','crew-cosmetics.css','royal-leaders.js','scripts/landing-level-podium.test.cjs','scripts/landing-level-podium-browser.cjs','ranking/staff-prestige-ranking.js','ranking/index.html','.github/workflows/staff-profile-tests.yml']
  push:
    branches: [main]
    paths: ['dolphin-profile.html','crew-character-card.js','crew-character-card.css','scripts/crew-character-card.test.cjs','scripts/crew-character-card-browser.cjs','dolphin-bungalow.html','dolphin-lounge.html','dolphin-show.html','dolphin-restaurant.html','scripts/staff-operational-auth.test.cjs','staff-profile.css','staff-prestige-profile.js','functions/staff-daily-core.cjs','functions/staff-daily-missions.js','functions/staff-daily-core.test.cjs','functions/staff-daily-missions.test.cjs','functions/staff-daily-arcade.test.cjs','crew-arcade-proof.js','functions/crew-arcade-proof.cjs','crew-arcade-missions.js','giaitri/games/snake.html','giaitri/games/game2048.html','staff-admin-profile.js','functions/staff-approval-push.js','staff-prestige-client.js','dolphin-avatars*','avatar-system.js','staff-profile.js','staff-id.js','staff-access.js','staff-access.css','scripts/staff-access.test.cjs','scripts/crew-v5.test.cjs','scripts/crew-effect-library.test.cjs','scripts/staff-approval-ui.test.cjs','scripts/staff-access-browser.cjs','scripts/staff-approval-browser.cjs','dolphin-navigation.js','service-worker.js','index.html','staff-sync*','staff-online.js','functions/staff-profile.js','functions/staff-manager-adjustments.js','functions/staff-manager-adjustments.test.cjs','manager-apk-profile.js','functions/staff-prestige.js','functions/staff-prestige.test.cjs','functions/staff-xp-rank-sync.js','functions/staff-xp-rank-sync.test.cjs','functions/staff-xp-actions.js','functions/staff-xp-actions.test.cjs','functions/staff-avatar-catalog.json','functions/staff-id.test.js','functions/index.js','scripts/avatar-sync-browser.cjs','scripts/crew-cosmetics.test.cjs','crew-cosmetics.css','royal-leaders.js','scripts/landing-level-podium.test.cjs','scripts/landing-level-podium-browser.cjs','ranking/staff-prestige-ranking.js','ranking/index.html','.github/workflows/staff-profile-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --test functions/manager-apk.test.cjs functions/staff-manager-adjustments.test.cjs
          node --check manager-apk-profile.js
          node --check staff-profile.js
          node --check crew-character-card.js
          node --check staff-id.js
          node --check staff-access.js
          node --check staff-admin-profile.js
          node --check functions/staff-approval-push.js
          node --check scripts/staff-access-browser.cjs
          node --check scripts/staff-approval-browser.cjs
          node --check dolphin-navigation.js
          node --check functions/staff-xp-actions.js
          node --check staff-sync.js
          node --check staff-online.js
          node --check ranking/staff-prestige-ranking.js
          node --check royal-leaders.js
          node --check scripts/landing-level-podium-browser.cjs
          node --check scripts/avatar-sync-browser.cjs
          node --check functions/staff-profile.js
          node --check functions/staff-daily-missions.js
          node --check dolphin-avatars.js
          node --test functions/staff-prestige.test.cjs functions/staff-xp-rank-sync.test.cjs scripts/landing-level-podium.test.cjs functions/staff-xp-actions.test.cjs functions/staff-daily-core.test.cjs functions/staff-daily-missions.test.cjs functions/staff-daily-arcade.test.cjs functions/staff-id.test.js staff-sync.test.js dolphin-avatars.test.cjs scripts/crew-cosmetics.test.cjs scripts/staff-access.test.cjs scripts/crew-v5.test.cjs scripts/crew-effect-library.test.cjs scripts/staff-approval-ui.test.cjs scripts/staff-recovery.test.cjs scripts/crew-daily-missions-ui.test.cjs
          node --test scripts/staff-operational-auth.test.cjs scripts/crew-character-card.test.cjs
          node scripts/check-service-pages.cjs
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/staff-access-browser.cjs
      - run: node scripts/manager-apk-browser.cjs
      - run: node scripts/staff-approval-browser.cjs
      - run: node scripts/landing-level-podium-browser.cjs
      - run: node scripts/crew-character-card-browser.cjs
      - run: node scripts/avatar-sync-browser.cjs
        env:
          AVATAR_QA_OUTPUT: ${{ runner.temp }}/dolphin-avatar-qa
