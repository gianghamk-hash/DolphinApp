name: Staff Identity Source Checks
on:
  pull_request:
    paths: ['functions/index.js','staff/**','.github/workflows/staff-identity-check.yml']
  push:
    branches: [main]
    paths: ['functions/index.js','staff/**','.github/workflows/staff-identity-check.yml']
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check functions/index.js
      - run: node --check staff/portal.js
