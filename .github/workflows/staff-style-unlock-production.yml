name: Deploy Crew Club Level Rewards
on:
  push:
    branches: [main, feat/crew-club-level-cosmetics-20261101]
    paths:
      - '.github/workflows/staff-style-unlock-production.yml'
      - 'functions/staff-xp-engine.cjs'
      - 'functions/staff-daily-core.cjs'
      - 'functions/staff-daily-missions.js'
      - 'functions/staff-daily-core.test.cjs'
      - 'functions/staff-daily-missions.test.cjs'
      - 'functions/staff-daily-arcade.test.cjs'
      - 'crew-arcade-proof.js'
      - 'functions/crew-arcade-proof.cjs'
      - 'scripts/verify-firebase-source-boundary.cjs'
      - 'crew-arcade-missions.js'
      - 'giaitri/games/snake.html'
      - 'giaitri/games/game2048.html'
      - 'functions/staff-xp-rank-sync.js'
      - 'functions/staff-xp-rank-sync.test.cjs'
      - 'functions/staff-xp-actions.js'
      - 'functions/staff-xp-actions.test.cjs'
      - 'functions/staff-profile.js'
      - 'functions/staff-prestige.js'
      - 'functions/staff-prestige.test.cjs'
permissions:
  contents: read
concurrency:
  group: firebase-crew-xp-serialized-production
  cancel-in-progress: false
jobs:
  production:
    if: github.repository == 'gianghamk-hash/DolphinApp'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Firebase credentials and project
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOLPHIN }}
          STAFF_ADMIN_UIDS: ${{ secrets.STAFF_ADMIN_UIDS }}
        run: |
          test -n "$FIREBASE_CREDENTIALS" && test -n "$STAFF_ADMIN_UIDS"
          node -e "const fs=require('fs');if(JSON.parse(fs.readFileSync('.firebaserc','utf8')).projects.default!=='dolphin-f6d67')process.exit(1)"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOLPHIN }}
          project_id: dolphin-f6d67
          export_environment_variables: true
      - name: Test Style and Level rules
        run: |
          npm install --prefix functions --no-audit --no-fund
          node --check functions/staff-xp-engine.cjs
          node --check functions/staff-profile.js
          node --check functions/staff-prestige.js
          node scripts/verify-firebase-source-boundary.cjs
          node --check functions/crew-arcade-proof.cjs
          node --check functions/staff-daily-missions.js
          node -e "const api=require('./functions/index.js');if(typeof api.staffStartArcadeMission!=='function'||typeof api.staffFinishArcadeMission!=='function')throw Error('Missing Cloud Functions arcade exports')"
          node --check functions/staff-daily-core.cjs
          node --check staff-prestige-profile.js
          node --check dolphin-avatars.js
          node scripts/check-service-pages.cjs
          node --test functions/staff-xp-rank-sync.test.cjs scripts/crew-v5.test.cjs functions/staff-prestige.test.cjs functions/staff-xp-engine.test.cjs functions/staff-daily-core.test.cjs functions/staff-daily-missions.test.cjs functions/staff-daily-arcade.test.cjs functions/staff-xp-actions.test.cjs
      - name: Keep legacy XP triggers disabled
        env:
          STAFF_ADMIN_UIDS: ${{ secrets.STAFF_ADMIN_UIDS }}
        run: |
          node - <<'NODE'
          const fs=require('fs'),admins=process.env.STAFF_ADMIN_UIDS||'';
          if(!/^[a-zA-Z0-9,_-]+$/.test(admins))throw Error('Invalid admin list');
          fs.writeFileSync('functions/.env.dolphin-f6d67','STAFF_ADMIN_UIDS='+admins+'\nSTAFF_AUTO_XP_ENABLED=false\nSTAFF_SECURE_AUTO_XP_ENABLED=true\n',{mode:0o600});
          NODE
      - name: Deploy authenticated profile cosmetics and XP ranking callables
        run: |
          npm install -g firebase-tools
          firebase deploy --project dolphin-f6d67 --non-interactive --only firestore:rules
          firebase deploy --project dolphin-f6d67 --non-interactive --only functions:staffCheckInDaily,functions:staffUpdateMyProfile,functions:staffSetPersonalStyle,functions:staffSetOwnRankingVisibility,functions:staffGetMyProgress,functions:staffGetPrestige,functions:staffGetAvatarDirectory,functions:staffAdjustOwnTestXP,functions:staffSyncSavedActivityXP,functions:staffSyncMyRecentXP,functions:staffRecordLiveAction,functions:staffStartArcadeMission,functions:staffFinishArcadeMission
      - name: Remove temporary environment
        if: always()
        run: rm -f functions/.env.dolphin-f6d67
