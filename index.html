<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Dolphin HaLong Cruise</title>
<script>
(function(){try{var ua=navigator.userAgent||'';if(ua.indexOf('DolphinManager')>=0||window.DOLPHIN_APP_TYPE==='manager'){document.documentElement.setAttribute('data-app','manager')}}catch(e){}})();
</script>
<style>
html[data-app="manager"] #notifPermBtn,
html[data-app="manager"] #dolphinMusicBtn,
html[data-app="manager"] #dolphinMusicPopup{
  display:none!important;visibility:hidden!important;pointer-events:none!important;opacity:0!important;
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#050505;
  --bg-panel:rgba(20,20,20,.6);
  --gold:var(--theme-accent,#D4AF37);
  --gold-glow:var(--theme-glow,rgba(212,175,55,.4));
  --text-main:#F4F4F5;
  --text-muted:#94A3B8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--bg-deep);color:var(--text-main);font-family:'Nunito',sans-serif;
  background-image:
    radial-gradient(circle at 15% 50%, rgba(212,175,55,.04), transparent 25%),
    radial-gradient(circle at 85% 30%, rgba(14,165,233,.04), transparent 25%);
  background-attachment:fixed;
}

/* LOGO */
.logo-img{animation:logoIn 1.2s cubic-bezier(.16,1,.3,1) both,logoBreathe 6s ease-in-out infinite 1.5s}
@keyframes logoIn{0%{opacity:0;transform:scale(.9) translateY(20px);filter:blur(10px) brightness(1.2)}100%{opacity:1;transform:scale(1) translateY(0);filter:blur(0) brightness(1.05)}}
@keyframes logoBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
@media(prefers-reduced-motion:reduce){.logo-img{animation:none}}

/* SKELETON */
.area-card.skeleton{pointer-events:none;background:rgba(255,255,255,.02)!important;border:1px dashed rgba(255,255,255,.1)!important;position:relative;overflow:hidden}
.area-card.skeleton>*{visibility:hidden!important}
.area-card.skeleton::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.05) 45%,rgba(255,255,255,.08) 55%,transparent 100%);background-size:200% 100%;animation:skeletonShimmer 1.5s ease-in-out infinite;pointer-events:none;z-index:3}
@keyframes skeletonShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* NOTIF BADGE */
.area-notif-badge{position:absolute;top:1rem;right:1rem;background:linear-gradient(135deg,#EF4444,#B91C1C);color:#fff;font-size:.65rem;font-weight:900;letter-spacing:.06em;padding:4px 10px;border-radius:99px;display:none;align-items:center;gap:5px;box-shadow:0 4px 12px rgba(239,68,68,.4);z-index:6;font-family:'Nunito',sans-serif;animation:notifPulse 2s ease-in-out infinite}
.area-notif-badge.show{display:inline-flex}
.area-notif-badge .nb-dot{width:6px;height:6px;border-radius:50%;background:#fff}
@keyframes notifPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* CLOCK */
#halongClock{position:relative;display:flex;align-items:center;gap:16px;max-width:min(92vw,600px);margin:0 auto 1.5rem;padding:16px 24px;border-radius:24px;background:var(--bg-panel);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);box-shadow:0 20px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1);overflow:hidden;isolation:isolate;font-family:'Nunito',sans-serif;transition:transform .3s ease,border-color .5s ease,box-shadow .5s ease}
#halongClock:hover{transform:translateY(-2px)}
#halongClock .hclock-icon{font-size:32px;line-height:1;flex-shrink:0;filter:drop-shadow(0 0 12px var(--gold-glow))}
#halongClock .hclock-body{flex:1;min-width:0;text-align:left}
#halongClock .hclock-time{display:flex;align-items:baseline;gap:4px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--gold);letter-spacing:.02em;font-size:clamp(1.8rem,5vw,2.6rem);transition:color .5s ease}
#halongClock .hclock-h,#halongClock .hclock-m,#halongClock .hclock-s{font-family:'Fraunces',serif;font-weight:900}
#halongClock .hclock-s{font-size:.55em;opacity:.7;margin-left:2px;color:var(--text-muted)}
#halongClock .hclock-sep{opacity:.4;font-weight:700;font-size:.85em}
#halongClock .hclock-date{font-size:clamp(.75rem,1.8vw,.9rem);color:var(--text-muted);font-weight:700;margin-top:6px;letter-spacing:.05em}
#halongClock .hclock-loc{display:flex;align-items:center;gap:8px;padding-left:16px;border-left:1px solid rgba(255,255,255,.1);flex-shrink:0;text-align:left}
#halongClock .hclock-loc-icon{font-size:20px;filter:drop-shadow(0 0 8px var(--gold-glow))}
#halongClock .hclock-loc-text{font-size:clamp(.65rem,1.5vw,.8rem);font-weight:800;color:var(--gold);letter-spacing:.05em;text-transform:uppercase;line-height:1.3;transition:color .5s ease}
@media(max-width:480px){#halongClock{padding:14px 18px;gap:12px;border-radius:20px}#halongClock .hclock-loc{padding-left:12px}}

/* MUSIC BTN */
#dolphinMusicBtn{position:fixed;top:20px;right:20px;z-index:9997;width:56px;height:56px;border-radius:50%;background:var(--bg-panel);border:1px solid rgba(255,255,255,.1);color:var(--text-muted);font-size:24px;cursor:grab;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);transition:all .3s cubic-bezier(.16,1,.3,1);padding:0;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#dolphinMusicBtn.dragging{cursor:grabbing;transform:scale(1.1);transition:none;box-shadow:0 15px 35px rgba(0,0,0,.8)}
#dolphinMusicBtn.active{background:linear-gradient(135deg,var(--gold),#B8860B);color:#050505;box-shadow:0 0 24px var(--gold-glow);border-color:transparent}
#dolphinMusicBtn:hover:not(.active){background:rgba(40,40,40,.8);color:var(--text-main)}

/* MUSIC POPUP */
#dolphinMusicPopup{display:none;position:fixed;background:rgba(15,15,15,.95);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.8);min-width:260px;max-width:88vw;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);z-index:9998;animation:popupIn .3s cubic-bezier(.16,1,.3,1);font-family:'Nunito',sans-serif}
@keyframes popupIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
#dolphinMusicPopup.show{display:block}
#dolphinMusicPopup .dmp-title{font-size:12px;font-weight:900;color:var(--gold);text-transform:uppercase;letter-spacing:.1em;margin-bottom:16px;display:flex;align-items:center;gap:8px}
#dolphinMusicPopup .dmp-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
#dolphinMusicPopup .dmp-row input[type=range]{flex:1;height:4px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.1);border-radius:99px;outline:none;cursor:pointer}
#dolphinMusicPopup .dmp-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold-glow);cursor:pointer}
#dolphinMusicPopup .dmp-pct{font-size:12px;color:var(--text-main);font-weight:800;min-width:40px;text-align:right}
#dolphinMusicPopup .dmp-hint{font-size:11px;color:var(--text-muted);text-align:center;line-height:1.5;margin-bottom:14px}
#dolphinMusicPopup .dmp-hint b{color:var(--gold)}
#dolphinMusicPopup .dmp-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:12px;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:8px;border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.03);color:var(--text-main)}
#dolphinMusicPopup .dmp-btn:hover{background:rgba(255,255,255,.08)}
#dolphinMusicPopup .dmp-btn-refresh:disabled{opacity:.5;cursor:wait}

/* LAYOUT */
#landing>div:first-child{padding-top:calc(2rem + env(safe-area-inset-top,0px))!important;padding-bottom:calc(2rem + env(safe-area-inset-bottom,0px))!important}

/* WELCOME */
.welcome-lbl{text-align:center;font-size:clamp(.95rem,2vw,1.25rem);font-weight:900;color:var(--text-main);margin:0 0 1.5rem;letter-spacing:.04em;line-height:1.5}
.welcome-lbl .wlc-vi{display:block;color:var(--gold);font-family:'Fraunces',serif;font-size:clamp(1.2rem,2.8vw,1.8rem);letter-spacing:.06em;margin-bottom:.4em;transition:color .5s ease}
.welcome-lbl .wlc-vi #wlcStaffName{display:inline-block;color:#fff;text-shadow:0 0 24px var(--gold-glow);font-weight:900;letter-spacing:.08em;margin:0 .15em}
.welcome-lbl .wlc-en{display:block;font-size:.85em;color:var(--text-muted);font-weight:800;margin-top:.5em;letter-spacing:.15em;text-transform:uppercase}

/* BENTO GRID */
.area-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;grid-auto-rows:1fr}
@media(min-width:768px){.area-grid{grid-template-columns:repeat(3,1fr);gap:16px}.area-card.large{grid-column:span 2}.area-card.full{grid-column:span 3}}
.area-card{position:relative;padding:2rem 1.5rem;text-align:center;cursor:pointer;transition:all .4s cubic-bezier(.16,1,.3,1);isolation:isolate;font-family:'Nunito',sans-serif;color:var(--text-main);display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:180px;gap:.5rem;background:linear-gradient(145deg,rgba(30,30,30,.4),rgba(10,10,10,.6));border:1px solid rgba(255,255,255,.06);border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.area-card:hover{transform:translateY(-5px);border-color:var(--gold-glow);background:linear-gradient(145deg,rgba(40,40,40,.6),rgba(15,15,15,.8));box-shadow:0 20px 40px rgba(0,0,0,.5),0 0 20px var(--gold-glow),inset 0 1px 0 rgba(255,255,255,.1)}
.area-card:active{transform:translateY(-2px) scale(.98)}
.area-card::before{content:'';position:absolute;inset:0;border-radius:24px;pointer-events:none;background:radial-gradient(circle at 100% 0%,var(--gold-glow),transparent 50%);opacity:0;transition:opacity .4s ease}
.area-card:hover::before{opacity:.5}
.area-icon{font-size:clamp(2.5rem,6vw,3.5rem);line-height:1;display:block;margin-bottom:.8rem;transition:transform .5s cubic-bezier(.16,1,.3,1);filter:drop-shadow(0 10px 20px rgba(0,0,0,.6));position:relative;z-index:2}
.area-card:hover .area-icon{transform:scale(1.1) rotate(-5deg)}
.area-title-en{font-weight:900;font-size:clamp(.9rem,2vw,1.1rem);letter-spacing:.05em;text-transform:uppercase;color:#fff;margin:0;line-height:1.2;position:relative;z-index:2}
.area-title-vi{font-weight:700;font-size:clamp(.75rem,1.6vw,.85rem);color:var(--text-muted);margin:0;letter-spacing:.03em;position:relative;z-index:2}
.area-badge{position:absolute;top:1rem;right:1rem;background:linear-gradient(135deg,var(--gold),#B8860B);color:#050505;font-size:.6rem;font-weight:900;letter-spacing:.1em;padding:4px 10px;border-radius:99px;text-transform:uppercase;box-shadow:0 4px 12px var(--gold-glow);z-index:5;transition:background .5s ease}

/* ANNOUNCEMENT */
#announcementBar{display:none;max-width:900px;margin:0 auto 1.5rem;background:var(--bg-panel);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px 0;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#announcementBar.show{display:block;animation:announce-fade-in .6s cubic-bezier(.16,1,.3,1)}
@keyframes announce-fade-in{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.announcement-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:24px;z-index:5;filter:drop-shadow(0 0 10px var(--gold-glow))}
.announcement-viewport{overflow:hidden;padding-left:52px;padding-right:24px;position:relative}
.announcement-track{display:inline-flex;white-space:nowrap;animation:announce-marquee 25s linear infinite;will-change:transform}
.announcement-text{padding-right:100px;color:var(--gold);font-weight:800;font-size:14px;letter-spacing:.05em;font-family:'Nunito',sans-serif;transition:color .5s ease}
@keyframes announce-marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@media(min-width:768px){.announcement-text{font-size:16px}#announcementBar{padding:18px 0}}

/* UPDATE BANNER */
#updateBanner{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:rgba(15,15,15,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--gold);padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:update-slide-down .5s cubic-bezier(.16,1,.3,1);font-family:'Nunito',sans-serif}
#updateBanner.show{display:block}
@keyframes update-slide-down{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
.update-content{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.update-icon{font-size:32px;filter:drop-shadow(0 0 12px var(--gold-glow))}
.update-info{flex:1;min-width:180px}
.update-title{font-size:16px;font-weight:900;color:var(--gold);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.update-notes{font-size:12px;color:var(--text-muted);font-weight:600;line-height:1.4}
.update-actions{display:flex;gap:12px;flex-wrap:wrap}
.update-btn{background:var(--gold);color:#050505;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.05em;padding:12px 24px;border-radius:12px;border:none;cursor:pointer;box-shadow:0 4px 16px var(--gold-glow);font-family:inherit;white-space:nowrap;transition:all .2s}
.update-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.update-btn:disabled{opacity:.5;cursor:wait}
.update-skip{background:transparent;color:var(--text-muted);font-weight:700;font-size:12px;padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.1);cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .2s}
.update-skip:hover{background:rgba(255,255,255,.05);color:var(--text-main)}
@media(max-width:480px){.update-actions{width:100%}.update-btn,.update-skip{flex:1;text-align:center}}

/* TRANSITIONS */
#landing{transition:opacity .5s ease,transform .6s cubic-bezier(.16,1,.3,1);position:fixed;inset:0;z-index:50;overflow-y:auto;overflow-x:hidden;background:transparent!important}
#landing.fade-out{opacity:0;transform:scale(1.02);pointer-events:none}
#app-view{opacity:0;transition:opacity .4s ease;position:fixed;inset:0;z-index:40;background:var(--bg-deep)}
#app-view.show{opacity:1}
#app-view.hidden{display:none}
#app-frame{width:100%;height:100%;border:0;display:block;background:var(--bg-deep);position:absolute;inset:0;z-index:1}
#app-frame.hidden-frame{opacity:0}
#app-loading{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.5rem;background:var(--bg-deep);transition:opacity .4s;pointer-events:none}
#app-loading.hide{opacity:0}
.loader-ring{width:60px;height:60px;border:3px solid rgba(255,255,255,.05);border-top-color:var(--gold);border-radius:50%;animation:spin 1s cubic-bezier(.5,0,.5,1) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{color:var(--gold);font-weight:800;font-size:.85rem;letter-spacing:.2em;text-transform:uppercase}

/* HOME CONTROLS */
#home-controls{position:fixed;bottom:24px;right:24px;z-index:1000;display:flex;flex-direction:column-reverse;gap:12px;align-items:center;user-select:none;-webkit-user-select:none;touch-action:none}
#home-controls.dragging{opacity:.9}
#home-controls.dragging #btn-home{transform:scale(1.1);box-shadow:0 15px 40px rgba(0,0,0,.6)}
#btn-home{width:56px;height:56px;border-radius:50%;background:var(--bg-panel);border:1px solid rgba(255,255,255,.1);color:var(--text-main);display:flex;align-items:center;justify-content:center;cursor:grab;backdrop-filter:blur(16px);box-shadow:0 10px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1);transition:all .3s cubic-bezier(.16,1,.3,1);padding:0;touch-action:none;-webkit-tap-highlight-color:transparent}
#btn-home:hover{background:rgba(40,40,40,.8);transform:translateY(-2px)}
#btn-home svg{width:24px;height:24px;pointer-events:none}
#btn-toggle{width:32px;height:32px;border-radius:50%;background:var(--bg-panel);border:1px solid rgba(255,255,255,.1);color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px);box-shadow:0 4px 12px rgba(0,0,0,.3);font-size:14px;padding:0;line-height:1;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#home-controls.minimized #btn-home{width:20px;height:20px;opacity:.5;border-color:rgba(255,255,255,.2);box-shadow:none}
#home-controls.minimized #btn-home svg{display:none}
#home-controls.minimized #btn-toggle{display:none}
#home-controls.minimized #btn-home::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold-glow)}

/* ORDER NOTIFICATION */
#orderNotif{display:none;position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-120%);z-index:9998;background:rgba(20,20,20,.95);backdrop-filter:blur(20px);border:1px solid rgba(239,68,68,.5);border-radius:20px;padding:16px 20px;min-width:300px;max-width:90vw;box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 30px rgba(239,68,68,.2);transition:transform .5s cubic-bezier(.16,1,.3,1);font-family:'Nunito',sans-serif}
#orderNotif.show{display:block;transform:translateX(-50%) translateY(0)}
.order-notif-content{display:flex;align-items:center;gap:16px}
.order-notif-icon{font-size:36px;filter:drop-shadow(0 0 12px rgba(239,68,68,.5))}
.order-notif-info{flex:1;min-width:0}
.order-notif-title{color:#FCA5A5;font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.order-notif-sub{color:var(--text-muted);font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order-notif-sub .table-hl{background:rgba(239,68,68,.2);color:#FCA5A5;padding:2px 8px;border-radius:6px;font-weight:900}
.order-notif-actions{display:flex;gap:8px;flex-direction:column}
.order-notif-btn{background:linear-gradient(135deg,#EF4444,#B91C1C);color:#fff;font-weight:900;font-size:12px;padding:10px 14px;border-radius:10px;border:none;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .2s}
.order-notif-btn:hover{filter:brightness(1.1)}
.order-notif-close{background:transparent;color:var(--text-muted);font-size:12px;font-weight:700;border:none;cursor:pointer;padding:4px;font-family:inherit;transition:color .2s}
.order-notif-close:hover{color:#fff}

/* REMINDER ALARM */
#reminderAlarm{position:fixed;inset:0;z-index:10001;background:rgba(0,0,0,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:none;align-items:center;justify-content:center;padding:24px;animation:alarmFadeIn .3s ease-out}
#reminderAlarm.show{display:flex}
@keyframes alarmFadeIn{from{opacity:0}to{opacity:1}}
#reminderAlarm .ralarm-card{background:linear-gradient(145deg,#1A0A0A,#050505);border:1px solid rgba(239,68,68,.4);border-radius:28px;padding:32px 28px;max-width:440px;width:100%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.05);animation:alarmPop .4s cubic-bezier(.16,1,.3,1)}
@keyframes alarmPop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
#reminderAlarm .ralarm-icon{font-size:64px;display:inline-block;animation:alarmShake .6s ease-in-out infinite;filter:drop-shadow(0 0 24px rgba(239,68,68,.8))}
@keyframes alarmShake{0%,100%{transform:rotate(-10deg) scale(1)}50%{transform:rotate(10deg) scale(1.1)}}
#reminderAlarm .ralarm-title{font-size:24px;font-weight:900;color:#FCA5A5;text-transform:uppercase;letter-spacing:.15em;margin:20px 0 8px}
#reminderAlarm .ralarm-sub{font-size:12px;color:var(--text-muted);font-weight:700;margin-bottom:20px}
#reminderAlarm .ralarm-body{font-size:16px;font-weight:700;color:#fff;line-height:1.6;padding:20px;background:rgba(0,0,0,.4);border-radius:16px;border-left:4px solid #EF4444;text-align:left;word-break:break-word;max-height:40vh;overflow-y:auto;margin-bottom:20px}
#reminderAlarm .ralarm-time{font-size:13px;color:#FCA5A5;font-weight:800;margin-bottom:24px;display:flex;align-items:center;justify-content:center;gap:8px}

<!-- SCRIPT 1: MUSIC DRAG + POPUP -->
<script>
(function(){
'use strict';
var BTN=null,POPUP=null,POS_KEY='dolphinMusicBtnPos',popupOpen=false;
function $(id){return document.getElementById(id)}
function loadPos(){try{var s=localStorage.getItem(POS_KEY);return s?JSON.parse(s):null}catch(e){return null}}
function savePos(x,y){try{localStorage.setItem(POS_KEY,JSON.stringify({x:x,y:y}))}catch(e){}}
function clearPos(){try{localStorage.removeItem(POS_KEY)}catch(e){}}
function clampPos(x,y){var w=BTN.offsetWidth,h=BTN.offsetHeight,vw=window.innerWidth,vh=window.innerHeight;x=Math.max(6,Math.min(x,vw-w-6));y=Math.max(6,Math.min(y,vh-h-6));return{x:x,y:y}}
function applyPos(x,y){var c=clampPos(x,y);BTN.style.left=c.x+'px';BTN.style.top=c.y+'px';BTN.style.right='auto';BTN.style.bottom='auto'}
function resetPos(){clearPos();BTN.style.left='';BTN.style.top='';BTN.style.right='20px';BTN.style.top='20px';BTN.style.bottom='auto'}
function positionPopup(){if(!POPUP||!BTN)return;var rect=BTN.getBoundingClientRect(),pw=POPUP.offsetWidth||260,ph=POPUP.offsetHeight||200,vw=window.innerWidth,vh=window.innerHeight,px=rect.left+rect.width-pw,py=rect.top+rect.height+12;if(px<12)px=12;if(px+pw>vw-12)px=vw-pw-12;if(py+ph>vh-12)py=rect.top-ph-12;if(py<12)py=12;POPUP.style.left=px+'px';POPUP.style.top=py+'px';POPUP.style.right='auto';POPUP.style.bottom='auto'}
function openPopup(){POPUP.classList.add('show');popupOpen=true;positionPopup();syncPopupUI()}
function closePopup(){POPUP.classList.remove('show');popupOpen=false}
function syncBtn(){if(!BTN||!window.DolphinSound)return;var on=window.DolphinSound.isEnabled();BTN.textContent=on?'🔊':'🔇';BTN.classList.toggle('active',on)}
function syncPopupUI(){if(!window.DolphinSound)return;var v=Math.round(window.DolphinSound.getVolume()*100),inp=$('dmpVol'),pct=$('dmpVolPct');if(inp&&document.activeElement!==inp)inp.value=v;if(pct)pct.textContent=v+'%'}
window.__giaitriSyncMusicUI=function(){syncBtn();if(popupOpen)syncPopupUI()};
function getPoint(e){if(e.touches&&e.touches[0])return{x:e.touches[0].clientX,y:e.touches[0].clientY};if(e.changedTouches&&e.changedTouches[0])return{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};return{x:e.clientX,y:e.clientY}}
function init(){
  BTN=$('dolphinMusicBtn');POPUP=$('dolphinMusicPopup');
  if(!BTN||!POPUP)return;
  var saved=loadPos();if(saved)applyPos(saved.x,saved.y);
  var volInp=$('dmpVol');
  if(volInp)volInp.addEventListener('input',function(){if(!window.DolphinSound)return;var v=parseInt(this.value,10);window.DolphinSound.setVolume(v/100);var pct=$('dmpVolPct');if(pct)pct.textContent=v+'%'});
  var refreshBtn=$('dmpRefresh');
  if(refreshBtn)refreshBtn.addEventListener('click',function(e){e.stopPropagation();if(!window.DolphinSound||!window.DolphinSound.refreshTracks)return;refreshBtn.disabled=true;refreshBtn.innerHTML='<span>⏳</span><span>Đang cập nhật...</span>';window.DolphinSound.refreshTracks().then(function(tracks){refreshBtn.disabled=false;refreshBtn.innerHTML='<span>🔄</span><span>Cập nhật danh sách nhạc</span>';if(window.showToast)window.showToast('Đã cập nhật '+(tracks?tracks.length:0)+' bài','✅')}).catch(function(){refreshBtn.disabled=false;refreshBtn.innerHTML='<span>🔄</span><span>Cập nhật danh sách nhạc</span>';if(window.showToast)window.showToast('Cập nhật thất bại','❌')})});
  var resetBtn=$('dmpReset');
  if(resetBtn)resetBtn.addEventListener('click',function(e){e.stopPropagation();resetPos();if(popupOpen)positionPopup();if(window.showToast)window.showToast('Đã về vị trí mặc định','↺')});
  var drag={active:false,moved:false,startX:0,startY:0,origX:0,origY:0};
  function onStart(e){var pt=getPoint(e);drag.active=true;drag.moved=false;drag.startX=pt.x;drag.startY=pt.y;var rect=BTN.getBoundingClientRect();drag.origX=rect.left;drag.origY=rect.top;BTN.style.transition='none'}
  function onMove(e){if(!drag.active)return;var pt=getPoint(e),dx=pt.x-drag.startX,dy=pt.y-drag.startY;if(!drag.moved&&(Math.abs(dx)+Math.abs(dy))<8)return;drag.moved=true;if(e.cancelable)e.preventDefault();var c=clampPos(drag.origX+dx,drag.origY+dy);BTN.style.left=c.x+'px';BTN.style.top=c.y+'px';BTN.style.right='auto';BTN.classList.add('dragging')}
  function onEnd(){if(!drag.active)return;drag.active=false;BTN.style.transition='';BTN.classList.remove('dragging');if(!drag.moved)return;savePos(BTN.offsetLeft,BTN.offsetTop);if(popupOpen)positionPopup()}
  BTN.addEventListener('touchstart',onStart,{passive:true});document.addEventListener('touchmove',onMove,{passive:false});document.addEventListener('touchend',onEnd);document.addEventListener('touchcancel',onEnd);
  BTN.addEventListener('mousedown',function(e){e.preventDefault();onStart(e)});document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onEnd);
  BTN.addEventListener('click',function(e){if(drag.moved){e.preventDefault();e.stopPropagation();drag.moved=false;return}e.stopPropagation();if(window.DolphinSound&&!window.DolphinSound.isEnabled()){window.DolphinSound.enable();syncBtn()}if(popupOpen)closePopup();else openPopup()});
  document.addEventListener('click',function(e){if(!popupOpen)return;if(e.target.closest('#dolphinMusicPopup'))return;if(e.target.closest('#dolphinMusicBtn'))return;closePopup()});
  window.addEventListener('resize',function(){var pos=loadPos();if(pos)applyPos(pos.x,pos.y);if(popupOpen)positionPopup()});
  syncBtn();setInterval(syncBtn,1500);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

<!-- SCRIPT 2: APP LOGIC + GREETING + HOME DRAG (FIXED goHome) -->
<script>
(function(){

var APP_MAP={lounge:'dolphin-lounge.html',bungalow:'dolphin-bungalow.html',restaurant:'dolphin-restaurant.html',show:'dolphin-show.html',giaitri:'giaitri/index.html',dashboard:'manager/dashboard.html',ranking:'ranking/index.html',guests:'dolphin-guests.html'};
var currentApp=null,transitionLock=false;
var HOME_KEY='dolphinHomeBtnHidden';
function applyHomeBtnState(){var ctrl=document.getElementById('home-controls');if(!ctrl)return;ctrl.classList.toggle('minimized',localStorage.getItem(HOME_KEY)==='1')}
window.toggleHomeBtn=function(){var ctrl=document.getElementById('home-controls');if(!ctrl)return;var h=!ctrl.classList.contains('minimized');localStorage.setItem(HOME_KEY,h?'1':'0');ctrl.classList.toggle('minimized',h)};
var DRAG_POS_KEY='dolphinHomeBtnPos',ctrl=null;
function saveHomePos(x,y){try{localStorage.setItem(DRAG_POS_KEY,JSON.stringify({x:x,y:y}))}catch(e){}}
function loadHomePos(){try{var s=localStorage.getItem(DRAG_POS_KEY);return s?JSON.parse(s):null}catch(e){return null}}
function applyHomePos(x,y){if(!ctrl)return;ctrl.style.left=x+'px';ctrl.style.top=y+'px';ctrl.style.right='auto';ctrl.style.bottom='auto'}
function clampHomePos(x,y){var vw=window.innerWidth,vh=window.innerHeight,w=ctrl.offsetWidth||60,h=ctrl.offsetHeight||100;x=Math.max(4,Math.min(x,vw-w-4));y=Math.max(4,Math.min(y,vh-h-4));return{x:x,y:y}}
function snapHomeToEdge(){if(!ctrl)return;var vw=window.innerWidth,w=ctrl.offsetWidth||60,cur={x:ctrl.offsetLeft,y:ctrl.offsetTop},snapLeft=cur.x<(vw-w)/2,nx=snapLeft?12:(vw-w-12),ny=clampHomePos(nx,cur.y).y;ctrl.style.transition='left .3s cubic-bezier(.16,1,.3,1),top .3s cubic-bezier(.16,1,.3,1)';applyHomePos(nx,ny);setTimeout(function(){ctrl.style.transition=''},320);saveHomePos(nx,ny)}
function initHomeDrag(){
  ctrl=document.getElementById('home-controls');if(!ctrl)return;
  var saved=loadHomePos();if(saved){var c=clampHomePos(saved.x,saved.y);applyHomePos(c.x,c.y)}
  var btnHome=document.getElementById('btn-home');if(!btnHome)return;
  var drag={active:false,moved:false,startX:0,startY:0,origX:0,origY:0};
  function getPoint(e){if(e.touches&&e.touches[0])return{x:e.touches[0].clientX,y:e.touches[0].clientY};if(e.changedTouches&&e.changedTouches[0])return{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};return{x:e.clientX,y:e.clientY}}
  function onStart(e){if(e.target.closest('#btn-toggle'))return;var pt=getPoint(e);drag.active=true;drag.moved=false;drag.startX=pt.x;drag.startY=pt.y;drag.origX=ctrl.offsetLeft;drag.origY=ctrl.offsetTop;ctrl.classList.add('dragging');ctrl.style.transition=''}
  function onMove(e){if(!drag.active)return;var pt=getPoint(e),dx=pt.x-drag.startX,dy=pt.y-drag.startY;if(!drag.moved&&Math.abs(dx)+Math.abs(dy)<8)return;drag.moved=true;if(e.cancelable)e.preventDefault();var c=clampHomePos(drag.origX+dx,drag.origY+dy);applyHomePos(c.x,c.y)}

  btnHome.addEventListener('touchstart',onStart,{passive:true});document.addEventListener('touchmove',onMove,{passive:false});document.addEventListener('touchend',onEnd);document.addEventListener('touchcancel',onEnd);
  btnHome.addEventListener('mousedown',function(e){onStart(e);e.preventDefault()});document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onEnd);
  window.addEventListener('resize',function(){var pos=loadHomePos();if(pos){var c=clampHomePos(pos.x,pos.y);applyHomePos(c.x,c.y)}});
  btnHome.addEventListener('click',function(e){if(drag.moved){e.preventDefault();e.stopPropagation();drag.moved=false}},true);

<!-- SCRIPT 5: CLOCK -->
<script>
function initHalongClock(){
  var elH=document.getElementById('hclockH'),elM=document.getElementById('hclockM'),elS=document.getElementById('hclockS'),elDate=document.getElementById('hclockDate');
  if(!elH||!elM||!elS||!elDate)return;
  var fmtTime=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Ho_Chi_Minh',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  var fmtDate=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Ho_Chi_Minh',day:'2-digit',month:'2-digit',year:'numeric',weekday:'short'});
  function tick(){
    var now=new Date();
    var p=fmtTime.formatToParts(now);
    var h='00',m='00',s='00';
    p.forEach(function(x){if(x.type==='hour')h=x.value;if(x.type==='minute')m=x.value;if(x.type==='second')s=x.value});
    elH.textContent=h;elM.textContent=m;elS.textContent=s;
    var dp=fmtDate.formatToParts(now);
    var d='01',mo='01',y='2026',dow='';
    dp.forEach(function(x){if(x.type==='day')d=x.value;if(x.type==='month')mo=x.value;if(x.type==='year')y=x.value;if(x.type==='weekday')dow=x.value});
    var map={Sun:'Chủ Nhật',Mon:'Thứ Hai',Tue:'Thứ Ba',Wed:'Thứ Tư',Thu:'Thứ Năm',Fri:'Thứ Sáu',Sat:'Thứ Bảy'};
    elDate.textContent=(map[dow]||dow)+', '+d+' tháng '+mo+', '+y;
  }
  tick();setInterval(tick,1000);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(initHalongClock,200)});else setTimeout(initHalongClock,200);
</script>

  if(navigator.vibrate){try{navigator.vibrate([300,100,300,100,300,500,300,100,300,100,300])}catch(e){}}
}
