name: TFT Touch Controls Checks
on:
  pull_request:
    paths: ['giaitri/games/tactics-online/**','.github/workflows/tft-touch-controls.yml']
  push:
    branches: [main]
    paths: ['giaitri/games/tactics-online/**','.github/workflows/tft-touch-controls.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test giaitri/games/tactics-online/touch-gear.test.js giaitri/games/tactics-online/tactics-ui.test.js giaitri/games/tactics-online/combat-timeline.test.js
