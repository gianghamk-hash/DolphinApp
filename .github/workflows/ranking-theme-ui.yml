name: Ranking Theme UI Checks
on:
  pull_request:
    paths:
      - 'ranking/index.html'
      - 'ranking/ranking-theme.test.js'
      - 'theme-system.js'
      - '.github/workflows/ranking-theme-ui.yml'
  push:
    branches: [main]
    paths:
      - 'ranking/index.html'
      - 'ranking/ranking-theme.test.js'
      - 'theme-system.js'
      - '.github/workflows/ranking-theme-ui.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check theme-system.js
      - run: node --test ranking/ranking-theme.test.js ranking/work-points.test.js rank-rewards.test.js
