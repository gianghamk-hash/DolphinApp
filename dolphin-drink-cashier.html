<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#123634">
<title>Dolphin · Thu Ngân Đồ Uống</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{serif:['Fraunces','serif'],sans:['Nunito','sans-serif']},colors:{teal:{50:'#effaf6',100:'#d8f3ea',200:'#bfe9dc',300:'#98dccb',400:'#6cc7b3',500:'#4aa896',600:'#37897b',700:'#2a6e65',800:'#215852',900:'#194743',950:'#123634'},gold:{400:'#FBD77A',500:'#F4B842',600:'#D99A2B'}}}}}</script>
<style>
  *{box-sizing:border-box}
  body{background:linear-gradient(160deg,var(--theme-bg1,#0f3d38),var(--theme-bg2,#0a2b28)) !important;color:#fff;font-family:'Nunito',sans-serif;margin:0;min-height:100vh;transition:background 1s ease}
  .brand-title{font-family:'Fraunces',serif;font-weight:900;letter-spacing:.22em;background:linear-gradient(180deg,#FBD77A,#F4B842);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-thumb{background:var(--theme-border,#37897b);border-radius:99px}
  .glass-card{background:rgba(25,71,67,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--theme-border-soft,rgba(244,184,66,.25));border-radius:16px}
  .tab-btn{padding:10px 16px;border-radius:12px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;transition:all .25s;border:1.5px solid transparent;background:rgba(45,110,101,.5);color:#98dccb;flex:1;text-align:center}
  .tab-btn.active{background:linear-gradient(135deg,var(--theme-accent,#FBD77A),var(--theme-accent2,#bfe9dc));color:#123634;font-weight:900}
  .filter-btn{padding:7px 12px;border-radius:99px;font-size:11px;font-weight:800;white-space:nowrap;cursor:pointer;border:1.5px solid var(--theme-border-soft,rgba(244,184,66,.3));background:rgba(25,71,67,.5);color:#bfe9dc;transition:all .2s}
  .filter-btn.active{background:linear-gradient(135deg,var(--theme-accent,#FBD77A),var(--theme-accent2,#bfe9dc));color:#123634;border-color:transparent}
  .status-chip{padding:3px 10px;border-radius:99px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;border:1.5px solid;display:inline-flex;align-items:center;gap:4px}
  .order-log-item{border-left:3px solid var(--theme-accent,#FBD77A);padding:6px 10px;background:rgba(0,0,0,.2);border-radius:8px;margin-bottom:6px}
  .action-btn{padding:9px 16px;border-radius:11px;border:none;font-weight:900;font-size:11px;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;transition:transform .15s}
  .action-btn:active{transform:scale(.95)}
  .action-btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-receive{background:linear-gradient(135deg,#818cf8,#6366f1);color:#fff}
  .btn-invoice{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
  .btn-cancel{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}
  .toast{position:fixed;top:16px;right:16px;z-index:9999;padding:12px 18px;border-radius:14px;font-weight:800;font-size:13px;box-shadow:0 12px 40px rgba(0,0,0,.5);opacity:0;transform:translateY(-20px);transition:all .3s ease;pointer-events:none;max-width:calc(100vw - 32px)}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.success{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
  .toast.error{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}
  .toast.info{background:linear-gradient(135deg,var(--theme-accent,#FBD77A),var(--theme-accent2,#bfe9dc));color:#123634}
  .toast.warn{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
  .conn-dot{width:8px;height:8px;border-radius:50%}
  .bell-ring{animation:bell-shake .5s ease-in-out}
  @keyframes bell-shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
  input,select,textarea{font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--theme-border,#FBD77A) !important;box-shadow:0 0 0 2px var(--theme-glow,rgba(244,184,66,.3))}
</style>
<script src="theme-system.js?v=7.2" defer></script>
<script src="dolphin-soundscape.js?v=2.0" defer></script>
<script src="drink-config.js?v=2.1" defer></script>
</head>
<body>

<div id="toast" class="toast"></div>

<header class="sticky top-0 z-30 bg-teal-950/95 backdrop-blur-md border-b border-teal-800/50 px-3 py-2.5">
  <div class="max-w-5xl mx-auto flex items-center justify-between gap-2">
    <button onclick="goHome()" class="w-9 h-9 rounded-xl bg-teal-900/60 border border-teal-700/50 flex items-center justify-center text-teal-300 text-base active:scale-95">←</button>
    <div class="flex-1 text-center">
      <h1 class="brand-title text-base leading-none">DOLPHIN</h1>
      <p class="text-[9px] text-teal-400 uppercase font-bold tracking-widest mt-0.5">Thu Ngân Đồ Uống</p>
    </div>
    <div class="flex items-center gap-2">
      <span id="cloud-dot" class="conn-dot bg-gold-500 animate-pulse"></span>
      <button id="btnBell" onclick="toggleSound()" class="w-9 h-9 rounded-xl bg-teal-900/60 border border-teal-700/50 flex items-center justify-center text-gold-400 text-base active:scale-95">🔔</button>
    </div>
  </div>
</header>

<main class="max-w-5xl mx-auto px-3 py-3">

  <!-- Stats -->
  <div class="grid grid-cols-3 md:grid-cols-5 gap-2 mb-3">
    <div class="glass-card px-3 py-2.5 text-center">
      <div class="text-[9px] text-amber-400 font-bold uppercase tracking-widest">Chờ</div>
      <div id="statPending" class="text-xl font-black text-amber-400">0</div>
    </div>
    <div class="glass-card px-3 py-2.5 text-center">
      <div class="text-[9px] text-cyan-400 font-bold uppercase tracking-widest">Đã PV</div>
      <div id="statServed" class="text-xl font-black text-cyan-400">0</div>
    </div>
    <div class="glass-card px-3 py-2.5 text-center">
      <div class="text-[9px] text-indigo-400 font-bold uppercase tracking-widest">Đã nhận</div>
      <div id="statReceived" class="text-xl font-black text-indigo-400">0</div>
    </div>
    <div class="glass-card px-3 py-2.5 text-center">
      <div class="text-[9px] text-emerald-400 font-bold uppercase tracking-widest">Hóa đơn</div>
      <div id="statInvoiced" class="text-xl font-black text-emerald-400">0</div>
    </div>
    <div class="glass-card px-3 py-2.5 text-center col-span-3 md:col-span-1">
      <div class="text-[9px] text-gold-400 font-bold uppercase tracking-widest">Doanh thu</div>
      <div id="statRevenue" class="text-lg font-black text-gold-400">0đ</div>
    </div>
  </div>

  <!-- Role info bar -->
  <div class="glass-card px-4 py-2.5 mb-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-lg" id="roleIcon">💰</span>
      <div>
        <div class="text-[9px] text-teal-400 font-bold uppercase tracking-widest">Vai trò</div>
        <div id="roleLabel" class="text-sm font-black text-gold-400">Thu ngân</div>
      </div>
    </div>
    <button onclick="openPinSwitch()" class="bg-teal-800 border border-teal-600 text-white px-3 py-2 rounded-lg text-[10px] font-bold">Đổi vai trò</button>
  </div>

  <!-- Filter bar -->
  <div class="flex gap-2 mb-3 overflow-x-auto pb-1" id="filterBar"></div>

  <!-- Orders list -->
  <div id="ordersList" class="space-y-3"></div>

</main>

<!-- PIN Modal -->
<div id="modalPin" class="fixed inset-0 z-[200] bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
  <div class="glass-card w-full max-w-sm p-6">
    <h3 class="font-black text-gold-400 text-lg uppercase mb-2" id="pinTitle">Xác thực</h3>
    <p class="text-teal-300 text-xs mb-4" id="pinDesc">Nhập mã PIN để vào hệ thống.</p>
    <input id="pinInput" type="password" inputmode="numeric" placeholder="••••" class="w-full bg-teal-950/80 border border-teal-600/50 rounded-xl px-3 py-3 text-2xl text-center tracking-widest text-white mb-3">
    <p id="pinError" class="hidden text-red-400 text-xs font-bold mb-3 bg-red-950/50 py-2 rounded-lg text-center">PIN không đúng!</p>
    <div class="flex gap-2">
      <button onclick="closePinModal()" class="flex-1 bg-teal-900 border border-teal-700 text-teal-300 py-3 rounded-xl text-xs font-bold">Hủy</button>
      <button onclick="verifyPin()" class="flex-1 bg-gradient-to-r from-gold-400 to-gold-500 text-black py-3 rounded-xl text-xs font-black uppercase">Xác nhận</button>
    </div>
  </div>
</div>

<!-- Cancel Order Modal -->
<div id="modalCancel" class="fixed inset-0 z-[200] bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
  <div class="glass-card w-full max-w-sm p-6">
    <h3 class="font-black text-red-400 text-lg uppercase mb-2">Hủy đơn</h3>
    <p class="text-teal-300 text-xs mb-4">Lý do hủy (bắt buộc)</p>
    <textarea id="cancelReason" rows="3" placeholder="Nhập lý do..." class="w-full bg-teal-950/80 border border-teal-600/50 rounded-xl px-3 py-3 text-sm text-white mb-3"></textarea>
    <div class="flex gap-2">
      <button onclick="closeCancelModal()" class="flex-1 bg-teal-900 border border-teal-700 text-teal-300 py-3 rounded-xl text-xs font-bold">Đóng</button>
      <button onclick="confirmCancel()" class="flex-1 bg-red-600 text-white py-3 rounded-xl text-xs font-black uppercase">Xác nhận hủy</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, updateDoc, doc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const CFG = window.DRINK_CONFIG;
const COL_ORDERS = 'drink_orders';

const state = {
  role: null,
  orders: [],
  filterStatus: 'all',
  soundOn: localStorage.getItem('drinkSoundOn') !== '0',
  db: null,
  pendingPinAction: null,
  cancelTargetId: null
};

/* ═══════ TOAST ═══════ */
window.showToast = function(msg, type){
  const t = document.getElementById('toast');
  t.className = 'toast ' + (type || 'info');
  t.textContent = msg;
  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 3000);
};

/* ═══════ SOUND ═══════ */
let audioCtx = null;
function playBell(){
  if (!state.soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const ctx = audioCtx;
    const now = ctx.currentTime;
    const master = ctx.createGain();
    master.gain.value = 0.5;
    master.connect(ctx.destination);
    [1, 2, 2.76, 4.07].forEach((r, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = 1046.5 * r;
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.35 / (i + 1), now + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
      o.connect(g); g.connect(master);
      o.start(now); o.stop(now + 0.7);
    });
    if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
  } catch(e){}
}

window.toggleSound = function(){
  state.soundOn = !state.soundOn;
  localStorage.setItem('drinkSoundOn', state.soundOn ? '1' : '0');
  const btn = document.getElementById('btnBell');
  btn.textContent = state.soundOn ? '🔔' : '🔕';
  btn.classList.toggle('text-gold-400', state.soundOn);
  btn.classList.toggle('text-teal-600', !state.soundOn);
  showToast(state.soundOn ? 'Đã bật chuông' : 'Đã tắt chuông', 'info');
};

/* ═══════ FIREBASE ═══════ */
const fbConfig = {
  apiKey: "AIzaSyAtBNp9WBnyIkCiVjXfUpjH2d7-9dbg-JQ",
  authDomain: "dolphin-f6d67.firebaseapp.com",
  projectId: "dolphin-f6d67"
};

window.addEventListener('load', async () => {
  /* Bell state */
  const btn = document.getElementById('btnBell');
  btn.textContent = state.soundOn ? '🔔' : '🔕';
  btn.classList.toggle('text-gold-400', state.soundOn);
  btn.classList.toggle('text-teal-600', !state.soundOn);

  initFilters();
  requirePin('cashier');

  try {
    const app = initializeApp(fbConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    state.db = db;
    await signInAnonymously(auth);
    document.getElementById('cloud-dot').className = 'conn-dot bg-emerald-500';
    initRealtime();
  } catch(e){
    console.warn(e);
  }
});

function initRealtime(){
  let firstLoad = true;
  onSnapshot(collection(state.db, COL_ORDERS), snap => {
    const arr = [];
    snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
    arr.sort((a,b) => (a.createdAt || 0) - (b.createdAt || 0));

    if (firstLoad){
      state.orders = arr;
      firstLoad = false;
      renderOrders();
      return;
    }

    /* Detect new pending order */
    let hasNew = false;
    const oldIds = new Set(state.orders.map(o => o.id));
    for (const o of arr){
      if (!oldIds.has(o.id) && o.status === 'pending') hasNew = true;
      const old = state.orders.find(x => x.id === o.id);
      if (old && old.status !== o.status && o.status === 'pending') hasNew = true;
    }

    state.orders = arr;
    if (hasNew){
      playBell();
      showToast('🔔 Có order mới!', 'warn');
      const bell = document.getElementById('btnBell');
      bell.classList.add('bell-ring');
      setTimeout(() => bell.classList.remove('bell-ring'), 600);
    }
    renderOrders();
  }, err => console.warn(err));
}

/* ═══════ PIN ═══════ */
window.requirePin = function(role){
  state.pendingPinAction = role;
  document.getElementById('pinTitle').textContent = role === 'manager' ? 'Manager' : 'Thu ngân';
  document.getElementById('pinDesc').textContent = role === 'manager'
    ? 'Nhập PIN Manager để tiếp tục.'
    : 'Nhập PIN Thu ngân để vào hệ thống.';
  document.getElementById('pinInput').value = '';
  document.getElementById('pinError').classList.add('hidden');
  const m = document.getElementById('modalPin');
  m.classList.remove('hidden'); m.classList.add('flex');
  setTimeout(() => document.getElementById('pinInput').focus(), 100);
};

window.openPinSwitch = function(){
  requirePin(state.role === 'manager' ? 'cashier' : 'manager');
};

window.closePinModal = function(){
  const m = document.getElementById('modalPin');
  m.classList.add('hidden'); m.classList.remove('flex');
  state.pendingPinAction = null;
};

window.verifyPin = function(){
  const pin = document.getElementById('pinInput').value.trim();
  const role = state.pendingPinAction;
  if (!role) return;
  const expected = role === 'manager' ? CFG.PIN.manager : CFG.PIN.cashier;
  if (pin !== expected){
    document.getElementById('pinError').classList.remove('hidden');
    return;
  }
  state.role = role;
  closePinModal();
  updateRoleUI();
  showToast('Xin chào ' + (role === 'manager' ? 'Manager' : 'Thu ngân'), 'success');
};

function updateRoleUI(){
  const icon = document.getElementById('roleIcon');
  const label = document.getElementById('roleLabel');
  if (state.role === 'manager'){
    icon.textContent = '👑';
    label.textContent = 'Manager';
    label.classList.remove('text-gold-400');
    label.classList.add('text-purple-400');
  } else {
    icon.textContent = '💰';
    label.textContent = 'Thu ngân';
    label.classList.remove('text-purple-400');
    label.classList.add('text-gold-400');
  }
  renderOrders();
}

/* ═══════ FILTERS ═══════ */
function initFilters(){
  const fBar = document.getElementById('filterBar');
  const filters = [
    { k: 'active',    l: '🔥 Đang xử lý' },
    { k: 'pending',   l: '⏳ Chờ PV' },
    { k: 'served',    l: '☑️ Đã PV' },
    { k: 'received',  l: '💰 Đã nhận' },
    { k: 'invoiced',  l: '✅ Hóa đơn' },
    { k: 'cancelled', l: '❌ Hủy' },
    { k: 'all',       l: '📊 Tất cả' }
  ];
  fBar.innerHTML = filters.map(f => `<button class="filter-btn ${f.k==='active'?'active':''}" data-f="${f.k}" onclick="switchFilter('${f.k}')">${f.l}</button>`).join('');
  state.filterStatus = 'active';
}

window.switchFilter = function(f){
  state.filterStatus = f;
  document.querySelectorAll('#filterBar .filter-btn').forEach(b => b.classList.toggle('active', b.dataset.f === f));
  renderOrders();
};

/* ═══════ RENDER ═══════ */
function renderOrders(){
  /* Stats */
  const stats = { pending: 0, served: 0, received: 0, invoiced: 0 };
  let revenue = 0;
  state.orders.forEach(o => {
    if (o.status === 'pending') stats.pending++;
    else if (o.status === 'served') stats.served++;
    else if (o.status === 'received') stats.received++;
    else if (o.status === 'invoiced'){
      stats.invoiced++;
      revenue += o.totalAmount || 0;
    }
  });
  document.getElementById('statPending').textContent = stats.pending;
  document.getElementById('statServed').textContent = stats.served;
  document.getElementById('statReceived').textContent = stats.received;
  document.getElementById('statInvoiced').textContent = stats.invoiced;
  document.getElementById('statRevenue').textContent = formatMoney(revenue);

  /* Filter */
  let filtered;
  const f = state.filterStatus;
  if (f === 'all'){
    filtered = state.orders.slice();
  } else if (f === 'active'){
    filtered = state.orders.filter(o =>
      o.status === 'pending' || o.status === 'served' || o.status === 'received'
    );
  } else {
    filtered = state.orders.filter(o => o.status === f);
  }

  /* FCFS — cũ nhất trên đầu, invoiced/cancelled xuống dưới */
  filtered.sort((a, b) => {
    const aDone = (a.status === 'invoiced' || a.status === 'cancelled') ? 1 : 0;
    const bDone = (b.status === 'invoiced' || b.status === 'cancelled') ? 1 : 0;
    if (aDone !== bDone) return aDone - bDone;
    return (a.createdAt || 0) - (b.createdAt || 0);
  });

  const list = document.getElementById('ordersList');
  if (filtered.length === 0){
    list.innerHTML = '<div class="glass-card p-8 text-center text-teal-500 text-sm">Không có đơn nào</div>';
    return;
  }
  list.innerHTML = filtered.map(o => renderOrderCard(o)).join('');
}

function renderOrderCard(o){
  const s = CFG.STATUS[o.status] || CFG.STATUS.pending;
  const logs = o.orderLog || [];
  const canReceive = o.status === 'pending' || o.status === 'served';
  const canInvoice = o.status === 'received';
  const canCancel = state.role === 'manager' && o.status !== 'invoiced' && o.status !== 'cancelled';

  const elapsed = o.createdAt ? Math.floor((Date.now() - o.createdAt) / 60000) : 0;
  const isDelayed = elapsed > 5 && (o.status === 'pending' || o.status === 'served');

  return `
    <div class="glass-card p-4 ${isDelayed ? 'border-red-500/50 animate-pulse' : ''}">
      <div class="flex justify-between items-start gap-2 mb-2">
        <div>
          <div class="text-lg font-black text-gold-400">BÀN ${o.table}</div>
          <div class="text-[10px] text-teal-400">${o.tableArea || ''} · ${elapsed} phút trước</div>
        </div>
        <div class="text-right">
          <div class="status-chip ${s.color} ${s.bg} ${s.border}">
            <span class="w-1.5 h-1.5 rounded-full bg-current"></span>${s.label}
          </div>
          <div class="text-[10px] text-teal-400 mt-1">Tạo: ${o.createdTimeString || '--'}</div>
        </div>
      </div>

      <div class="text-[11px] text-teal-300 mb-2">
        NV: <span class="font-black text-white">${(o.allStaffNames || [o.staffName]).join(', ')}</span>
      </div>

      <div class="space-y-2 mb-3">
        ${logs.map(log => `
          <div class="order-log-item">
            <div class="flex justify-between items-center mb-1">
              <span class="text-[10px] font-black text-gold-400 uppercase">Đơn ${log.num} · ${log.timeString}</span>
              <span class="text-[9px] text-teal-400">${log.staffName}</span>
            </div>
            <div class="space-y-0.5">
              ${(log.items || []).map(i => `
                <div class="flex justify-between text-xs">
                  <span class="text-white">${i.displayName || i.name}</span>
                  <span class="text-gold-400 font-black">×${i.qty}</span>
                </div>
              `).join('')}
            </div>
            ${log.specialNotes ? `<div class="text-[10px] italic text-amber-300 mt-1">📝 ${log.specialNotes}</div>` : ''}
          </div>
        `).join('')}
      </div>

      ${o.cancelReason ? `<div class="text-[11px] text-red-300 mb-2 italic">❌ Lý do hủy: ${o.cancelReason}</div>` : ''}

      <div class="flex justify-between items-center pt-2 border-t border-teal-700/50 gap-2 flex-wrap">
        <div>
          <div class="text-[9px] text-teal-400 uppercase font-bold tracking-widest">Tổng</div>
          <div class="text-lg font-black text-gold-400">${formatMoney(o.totalAmount || 0)}</div>
        </div>
        <div class="flex gap-2 flex-wrap">
          ${canReceive ? `<button class="action-btn btn-receive" onclick="markReceived('${o.id}')">💰 Đã nhận</button>` : ''}
          ${canInvoice ? `<button class="action-btn btn-invoice" onclick="markInvoiced('${o.id}')">✅ Làm hóa đơn</button>` : ''}
          ${canCancel ? `<button class="action-btn btn-cancel" onclick="openCancelModal('${o.id}')">✕ Hủy</button>` : ''}
        </div>
      </div>
    </div>
  `;
}

/* ═══════ ACTIONS ═══════ */
window.markReceived = async function(id){
  try {
    await updateDoc(doc(state.db, COL_ORDERS, id), {
      status: 'received',
      receivedAt: Date.now(),
      receivedBy: state.role,
      updatedAt: Date.now(),
      updatedTimeString: formatTimeVN(Date.now())
    });
    showToast('Đã nhận đơn', 'success');
  } catch(e){ showToast('Lỗi: ' + e.message, 'error'); }
};

window.markInvoiced = async function(id){
  try {
    await updateDoc(doc(state.db, COL_ORDERS, id), {
      status: 'invoiced',
      invoicedAt: Date.now(),
      invoicedBy: state.role,
      updatedAt: Date.now(),
      updatedTimeString: formatTimeVN(Date.now())
    });
    showToast('Đã làm hóa đơn', 'success');
  } catch(e){ showToast('Lỗi: ' + e.message, 'error'); }
};

window.openCancelModal = function(id){
  state.cancelTargetId = id;
  document.getElementById('cancelReason').value = '';
  const m = document.getElementById('modalCancel');
  m.classList.remove('hidden'); m.classList.add('flex');
};

window.closeCancelModal = function(){
  const m = document.getElementById('modalCancel');
  m.classList.add('hidden'); m.classList.remove('flex');
  state.cancelTargetId = null;
};

window.confirmCancel = async function(){
  const reason = document.getElementById('cancelReason').value.trim();
  if (!reason){ showToast('Nhập lý do hủy', 'error'); return; }
  try {
    await updateDoc(doc(state.db, COL_ORDERS, state.cancelTargetId), {
      status: 'cancelled',
      cancelledAt: Date.now(),
      cancelledBy: state.role,
      cancelReason: reason,
      updatedAt: Date.now(),
      updatedTimeString: formatTimeVN(Date.now())
    });
    closeCancelModal();
    showToast('Đã hủy đơn', 'success');
  } catch(e){ showToast('Lỗi: ' + e.message, 'error'); }
};

/* ═══════ HELPERS ═══════ */
function formatMoney(n){
  return (n || 0).toLocaleString('vi-VN') + 'đ';
}
function formatTimeVN(ts){
  const d = new Date(ts);
  return new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Asia/Ho_Chi_Minh',
    hour: '2-digit', minute: '2-digit', hour12: false
  }).format(d);
}

window.goHome = function(){
  window.location.href = '/DolphinApp/';
};
</script>
