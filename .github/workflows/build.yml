name: Build Dolphin APKs (Staff + Manager)

on:
  pull_request:
    paths:
      - 'android/**'
      - 'dolphin-push.js'
      - 'push-config.js'
      - '.github/workflows/build.yml'
  workflow_run:
    workflows: ["Auto Bump Version"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: staff
            app_name: "Dolphin Staff"
            package_id: "com.dolphin.cruise.staff"
            ua_extra: "DolphinStaff/1.0"
            artifact_name: "DolphinStaff-APK"
          - variant: manager
            app_name: "Dolphin Manager"
            package_id: "com.dolphin.cruise.manager"
            ua_extra: "DolphinManager/1.0"
            artifact_name: "DolphinManager-APK"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Resolve APK version
        id: apk_version
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          version = json.load(open('version.json', encoding='utf-8'))['version']
          match = re.fullmatch(r'(\d+)\.(\d+)\.(\d+)', version)
          if not match:
              raise SystemExit('Invalid semantic version: ' + version)
          major, minor, patch = map(int, match.groups())
          if minor > 999 or patch > 999:
              raise SystemExit('Version segment exceeds Android code range')
          code = major * 1000000 + minor * 1000 + patch
          if not 1 <= code <= 2100000000:
              raise SystemExit('Android versionCode out of range')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'code={code}\nname={version}\n')
          print(f'Android version {version} ({code})')
          PY

      - name: Create Android project structure
        env:
          APP_NAME: ${{ matrix.app_name }}
          PKG_ID: ${{ matrix.package_id }}
          UA_EXTRA: ${{ matrix.ua_extra }}
          VARIANT: ${{ matrix.variant }}
          FIREBASE_MANAGER_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_MANAGER_GOOGLE_SERVICES_JSON_B64 }}
          APK_VERSION_CODE: ${{ steps.apk_version.outputs.code }}
          APK_VERSION_NAME: ${{ steps.apk_version.outputs.name }}
        run: |
          mkdir -p app/src/main/java/com/dolphin/cruise
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/assets

          cat > settings.gradle << 'EOF_SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DolphinApp"
          include ':app'
          EOF_SETTINGS

          cat > build.gradle << 'EOF_ROOT'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF_ROOT

          cat > gradle.properties << 'EOF_PROPS'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.caching=true
          org.gradle.parallel=true
          EOF_PROPS

          cat > app/build.gradle << EOF_APP
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.dolphin.cruise'
              compileSdk 34
              defaultConfig {
                  applicationId "${PKG_ID}"
                  minSdk 24
                  targetSdk 34
                  versionCode ${APK_VERSION_CODE}
                  versionName "${APK_VERSION_NAME}"
              }
              signingConfigs {
                  release {
                      storeFile file("\${rootDir}/dolphin.keystore")
                      storePassword "dolphin123"
                      keyAlias "dolphin"
                      keyPassword "dolphin123"
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF_APP

          cat > app/src/main/AndroidManifest.xml << 'EOF_MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_MANIFEST

          cat > app/src/main/res/layout/activity_main.xml << 'EOF_LAYOUT'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#123634">
              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
              <ProgressBar
                  android:id="@+id/progressBar"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center" />
          </FrameLayout>
          EOF_LAYOUT

          cat > app/src/main/res/values/strings.xml << EOF_STRINGS
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">${APP_NAME}</string>
          </resources>
          EOF_STRINGS

          cat > app/src/main/java/com/dolphin/cruise/MainActivity.java << EOF_JAVA
          package com.dolphin.cruise;

          import android.annotation.SuppressLint;
          import android.app.AlertDialog;
          import android.content.pm.ActivityInfo;
          import android.webkit.JavascriptInterface;
          import android.webkit.JsResult;
          import android.webkit.JsPromptResult;
          import android.webkit.WebChromeClient;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ProgressBar;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;

          import java.io.ByteArrayInputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.util.HashMap;
          import java.util.Map;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;
              private ProgressBar progressBar;
              private long lastBackPress = 0L;

              // Only the TFT game can request sensor landscape via the approved game page.
              private boolean trustedDolphinPage() {
                  if (webView == null || webView.getUrl() == null) return false;
                  Uri u = Uri.parse(webView.getUrl());
                  boolean customDomain = "dolphinfb.store".equals(u.getHost());
                  boolean legacyPages = "gianghamk-hash.github.io".equals(u.getHost())
                      && u.getPath() != null && u.getPath().startsWith("/DolphinApp/");
                  return "https".equals(u.getScheme()) && (u.getPort() == -1 || u.getPort() == 443)
                      && (customDomain || legacyPages);
              }
              private void setGameOrientation(boolean landscape) {
                  runOnUiThread(() -> {
                      if (!trustedDolphinPage()) return;
                      setRequestedOrientation(landscape
                          ? ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                          : ActivityInfo.SCREEN_ORIENTATION_PORTRAIT);
                  });
              }
              public final class AndroidGameBridge {
                  @JavascriptInterface public void enterLandscapeFullscreen() { setGameOrientation(true); }
                  @JavascriptInterface public void exitLandscapeFullscreen() { setGameOrientation(false); }
              }



              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webview);
                  progressBar = findViewById(R.id.progressBar);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  s.setUserAgentString(s.getUserAgentString() + " ${UA_EXTRA}");

                  // Android WebView does not display JavaScript confirm/alert/prompt
                  // unless a WebChromeClient handles them. Staff-name locking uses confirm().
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onJsConfirm(WebView view, String url, String message, JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                              .setTitle("Xác nhận")
                              .setMessage(message)
                              .setCancelable(false)
                              .setPositiveButton("Đồng ý", (dialog, which) -> result.confirm())
                              .setNegativeButton("Hủy", (dialog, which) -> result.cancel())
                              .show();
                          return true;
                      }

                      @Override
                      public boolean onJsAlert(WebView view, String url, String message, JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                              .setTitle("Thông báo")
                              .setMessage(message)
                              .setCancelable(false)
                              .setPositiveButton("Đóng", (dialog, which) -> result.confirm())
                              .show();
                          return true;
                      }

                      @Override
                      public boolean onJsPrompt(WebView view, String url, String message, String defaultValue, JsPromptResult result) {
                          android.widget.EditText field = new android.widget.EditText(MainActivity.this);
                          field.setSingleLine(true);
                          field.setText(defaultValue == null ? "" : defaultValue);
                          new AlertDialog.Builder(MainActivity.this)
                              .setTitle("Nhập thông tin")
                              .setMessage(message)
                              .setView(field)
                              .setCancelable(false)
                              .setPositiveButton("Đồng ý", (dialog, which) -> result.confirm(field.getText().toString()))
                              .setNegativeButton("Hủy", (dialog, which) -> result.cancel())
                              .show();
                          return true;
                      }
                  });

                  webView.addJavascriptInterface(new AndroidGameBridge(), "AndroidGame");
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String host = uri.getHost();
                          if ("appassets.androidplatform.net".equals(host)) {
                              String path = uri.getPath();
                              if (path != null && path.startsWith("/assets/")) {
                                  String assetPath = path.substring("/assets/".length());
                                  try {
                                      InputStream is = getAssets().open(assetPath);
                                      Map<String, String> headers = new HashMap<>();
                                      headers.put("Access-Control-Allow-Origin", "*");
                                      return new WebResourceResponse(
                                              guessMime(assetPath), "utf-8", 200, "OK", headers, is);
                                  } catch (IOException e) {
                                      return new WebResourceResponse(
                                              "text/plain", "utf-8", 404, "Not Found",
                                              new HashMap<String, String>(),
                                              new ByteArrayInputStream("Not found".getBytes()));
                                  }
                              }
                          }
                          return null;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          if (progressBar != null) progressBar.setVisibility(View.GONE);
                          if (url == null || !url.contains("/giaitri/")) setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_PORTRAIT);
                      }
                  });

                  // 🌐 Load từ custom domain → OTA update tự động
                  webView.loadUrl("https://dolphinfb.store/index.html");
              }

              private static String guessMime(String path) {
                  if (path.endsWith(".html") || path.endsWith(".htm")) return "text/html";
                  if (path.endsWith(".js")) return "application/javascript";
                  if (path.endsWith(".css")) return "text/css";
                  if (path.endsWith(".json")) return "application/json";
                  if (path.endsWith(".png")) return "image/png";
                  if (path.endsWith(".jpg") || path.endsWith(".jpeg")) return "image/jpeg";
                  if (path.endsWith(".svg")) return "image/svg+xml";
                  return "application/octet-stream";
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_PORTRAIT);
                      webView.goBack();
                      return;
                  }
                  long now = System.currentTimeMillis();
                  if (now - lastBackPress < 2000) {
                      super.onBackPressed();
                  } else {
                      lastBackPress = now;
                      Toast.makeText(this, "Nhan lan nua de thoat", Toast.LENGTH_SHORT).show();
                  }
              }
          }
          EOF_JAVA

          sed -i 's/^          //' settings.gradle build.gradle gradle.properties app/build.gradle
          sed -i 's/^          //' app/src/main/AndroidManifest.xml
          sed -i 's/^          //' app/src/main/res/layout/activity_main.xml
          sed -i 's/^          //' app/src/main/res/values/strings.xml
          sed -i 's/^          //' app/src/main/java/com/dolphin/cruise/MainActivity.java

          cp index.html dolphin-bungalow.html dolphin-lounge.html dolphin-restaurant.html dolphin-show.html app/src/main/assets/
          cp master.js app/src/main/assets/
          cp staff-sync.js app/src/main/assets/
          mkdir -p app/src/main/assets/manager
          cp manager/dashboard.html app/src/main/assets/manager/
          cp avatar-system.js app/src/main/assets/

          # Both APKs use native FCM; their registered app IDs are distinct.
          if [ "$VARIANT" = "manager" ] || [ "$VARIANT" = "staff" ]; then
            if [ -z "$FIREBASE_MANAGER_GOOGLE_SERVICES_JSON_B64" ]; then
              echo "::error::Missing repository secret FIREBASE_MANAGER_GOOGLE_SERVICES_JSON_B64 (base64 of Firebase Android manager google-services.json)"
              exit 1
            fi
            printf '%s' "$FIREBASE_MANAGER_GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
            python3 - <<'PY_MANAGER_PUSH'
          import json, os
          from pathlib import Path
          config = json.loads(Path('app/google-services.json').read_text())
          assert config['project_info']['project_id'] == 'dolphin-f6d67'
          assert str(config['project_info']['project_number']) == '547227270636'
          clients = config.get('client', [])
          assert any(
              c.get('client_info', {}).get('android_client_info', {}).get('package_name')
              == 'com.dolphin.cruise.manager' for c in clients
          ), 'google-services.json does not contain com.dolphin.cruise.manager'
          if os.environ['VARIANT'] == 'staff':
              staff = json.loads(Path('android/staff/firebase-app.json').read_text())
              assert staff['projectId'] == config['project_info']['project_id']
              assert staff['messagingSenderId'] == str(config['project_info']['project_number'])
              assert staff['packageName'] == os.environ['PKG_ID']
              manager = next(c for c in clients if
                  c['client_info']['android_client_info']['package_name'] == 'com.dolphin.cruise.manager')
              # Official SDK configs use the same project Android API key.
              config['client'] = [{
                  'client_info': {'mobilesdk_app_id': staff['appId'],
                      'android_client_info': {'package_name': staff['packageName']}},
                  'api_key': manager['api_key'], 'oauth_client': [], 'services': {}
              }]
              Path('app/google-services.json').write_text(json.dumps(config))
          gradle = Path('app/build.gradle')
          content = gradle.read_text().replace(
              "id 'com.android.application'",
              "id 'com.android.application'\n    id 'com.google.gms.google-services'", 1
          ).replace(
              "implementation 'androidx.appcompat:appcompat:1.6.1'",
              "implementation 'androidx.appcompat:appcompat:1.6.1'\n    implementation 'com.google.firebase:firebase-messaging:24.1.2'",
              1
          )
          gradle.write_text(content)
          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text().replace(
              '<uses-permission android:name="android.permission.VIBRATE" />',
              '<uses-permission android:name="android.permission.VIBRATE" />\n'
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              1
          ).replace(
              '</application>',
              '<service android:name=".DolphinMessagingService" '
              'android:exported="false">\n'
              '<intent-filter><action android:name="com.google.firebase.MESSAGING_EVENT" />'
              '</intent-filter></service>\n</application>',
              1
          )
          manifest.write_text(m)
          source = Path('app/src/main/java/com/dolphin/cruise/MainActivity.java')
          java = source.read_text().replace(
              'webView.addJavascriptInterface(new AndroidGameBridge(), "AndroidGame");',
              'webView.addJavascriptInterface(new AndroidGameBridge(), "AndroidGame");\n'
              '        webView.addJavascriptInterface(new AndroidPushBridge(this, webView), "AndroidPush");',
              1
          ).replace(
              'webView.loadUrl("https://dolphinfb.store/index.html");',
              'webView.loadUrl(pushLandingUrl(getIntent()));',
              1
          )
          helper = """
              private String pushLandingUrl(android.content.Intent incoming) {
                  final String home = "https://dolphinfb.store/index.html";
                  if (incoming == null) return home;
                  String raw = incoming.getStringExtra("dolphin_push_url");
                  if (raw == null) return home;
                  Uri uri = Uri.parse(raw);
                  if ("https".equals(uri.getScheme()) && "dolphinfb.store".equals(uri.getHost())
                      && (uri.getPort() == -1 || uri.getPort() == 443)
                      && "/index.html".equals(uri.getPath())) return raw;
                  return home;
              }
              @Override protected void onNewIntent(android.content.Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  if (webView != null) webView.loadUrl(pushLandingUrl(intent));
              }

          """
          assert 'private static String guessMime(String path)' in java
          java = java.replace('private static String guessMime(String path)', helper +
                              'private static String guessMime(String path)', 1)
          source.write_text(java)
          PY_MANAGER_PUSH
            cp android/manager/AndroidPushBridge.java app/src/main/java/com/dolphin/cruise/
            cp android/manager/DolphinMessagingService.java app/src/main/java/com/dolphin/cruise/
          fi

      - name: Generate icons
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y imagemagick
          fi
          if [ ! -f "icon-source.png" ]; then
            echo "ERROR: icon-source.png not found!"
            exit 1
          fi
          convert icon-source.png -resize 1024x1024^ -gravity center -extent 1024x1024 /tmp/icon_1024.png
          convert /tmp/icon_1024.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert /tmp/icon_1024.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert /tmp/icon_1024.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert /tmp/icon_1024.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert /tmp/icon_1024.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert /tmp/icon_1024.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          convert /tmp/icon_1024.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          convert /tmp/icon_1024.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          convert /tmp/icon_1024.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          convert /tmp/icon_1024.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore dolphin.keystore -alias dolphin -keyalg RSA -keysize 2048 -validity 10000 -storepass dolphin123 -keypass dolphin123 -dname "CN=Dolphin, O=Dolphin, C=VN"

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
