name: Deploy Dolphin XP from saved ranking records
on:
  push:
    branches: [main, fix/simple-xp-from-ranking-activity-20261101]
    paths:
      - '.github/workflows/staff-xp-rank-sync-production.yml'
      - 'functions/staff-xp-rank-sync.js'
      - 'functions/staff-prestige.js'
      - 'functions/index.js'
      - 'functions/staff-xp-rank-sync.test.cjs'
permissions:
  contents: read
concurrency:
  group: firebase-staff-xp-ranking-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'gianghamk-hash/DolphinApp'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check project and secrets
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOLPHIN }}
          STAFF_ADMIN_UIDS: ${{ secrets.STAFF_ADMIN_UIDS }}
        run: |
          test -n "$FIREBASE_CREDENTIALS" && test -n "$STAFF_ADMIN_UIDS"
          node -e "const fs=require('fs');if(JSON.parse(fs.readFileSync('.firebaserc','utf8')).projects.default!=='dolphin-f6d67')process.exit(1)"
      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOLPHIN }}
          project_id: dolphin-f6d67
          export_environment_variables: true
      - name: Test saved-activity XP
        run: |
          npm ci --prefix functions || npm install --prefix functions --no-audit --no-fund
          node --check functions/staff-xp-rank-sync.js
          node --test functions/staff-xp-rank-sync.test.cjs functions/staff-prestige.test.cjs
          node scripts/check-service-pages.cjs
      - name: Keep old Firestore triggers off
        env:
          STAFF_ADMIN_UIDS: ${{ secrets.STAFF_ADMIN_UIDS }}
        run: |
          node - <<'NODE'
          const fs=require('fs');const val=process.env.STAFF_ADMIN_UIDS||'';
          if(!/^[a-zA-Z0-9,_-]+$/.test(val))throw Error('Invalid admin allowlist');
          fs.writeFileSync('functions/.env.dolphin-f6d67','STAFF_ADMIN_UIDS='+val+'\nSTAFF_AUTO_XP_ENABLED=false\nSTAFF_SECURE_AUTO_XP_ENABLED=true\n',{mode:0o600});
          NODE
      - name: Deploy only saved-activity callable
        run: |
          npm install -g firebase-tools
          firebase deploy --project dolphin-f6d67 --non-interactive --only functions:staffSyncSavedActivityXP,functions:staffSyncMyRecentXP
      - name: Remove temporary env
        if: always()
        run: rm -f functions/.env.dolphin-f6d67

