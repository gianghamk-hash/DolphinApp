<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#123634">
<title>Dolphin · Order Đồ Uống</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{serif:['Fraunces','serif'],sans:['Nunito','sans-serif']},colors:{teal:{50:'#effaf6',100:'#d8f3ea',200:'#bfe9dc',300:'#98dccb',400:'#6cc7b3',500:'#4aa896',600:'#37897b',700:'#2a6e65',800:'#215852',900:'#194743',950:'#123634'},gold:{400:'#FBD77A',500:'#F4B842',600:'#D99A2B'}}}}}</script>
<style>
  *{box-sizing:border-box}
  body{background:linear-gradient(160deg,var(--theme-bg1,#0f3d38),var(--theme-bg2,#0a2b28)) !important;color:#fff;font-family:'Nunito',sans-serif;margin:0;min-height:100vh;transition:background 1s ease}
  .brand-title{font-family:'Fraunces',serif;font-weight:900;letter-spacing:.22em;background:linear-gradient(180deg,#FBD77A,#F4B842);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-thumb{background:var(--theme-border,#37897b);border-radius:99px}
  .glass-card{background:rgba(25,71,67,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--theme-border-soft,rgba(244,184,66,.25));border-radius:16px}
  .tab-btn{padding:10px 16px;border-radius:12px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;transition:all .25s;border:1.5px solid transparent;background:rgba(45,110,101,.5);color:#98dccb;flex:1;text-align:center}
  .tab-btn.active{background:linear-gradient(135deg,var(--theme-accent,#FBD77A),var(--theme-accent2,#bfe9dc));color:#123634;font-weight:900}
  .filter-btn{padding:7px 12px;border-radius:99px;font-size:11px;font-weight:800;white-space:nowrap;cursor:pointer;border:1.5px solid var(--theme-border-soft,rgba(244,184,66,.3));background:rgba(25,71,67,.5);color:#bfe9dc;transition:all .2s}
  .filter-btn.active{background:linear-gradient(135deg,var(--theme-accent,#FBD77A),var(--theme-accent2,#bfe9dc));color:#123634;border-color:transparent}
  .drink-card{background:rgba(25,71,67,.55);border:1.5px solid var(--theme-border-soft,rgba(244,184,66,.25));border-radius:14px;padding:12px;cursor:pointer;transition:all .25s}
  .drink-card:hover{border-color:var(--theme-border,rgba(244,184,66,.55));transform:translateY(-2px);box-shadow:0 8px 20px -8px var(--theme-glow,rgba(244,184,66,.4))}
  .drink-card:active{transform:scale(.98)}
  .drink-card.selected{border-color:var(--theme-accent,#FBD77A);background:rgba(244,184,66,.1)}
  .status-chip{padding:3px 10px;border-radius:99px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;border:1.5px solid;display:inline-flex;align-items:center;gap:4px}
  .order-log-item{border-left:3px solid var(--theme-accent,#FBD77A);padding:6px 10px;background:rgba(0,0,0,.2);border-radius:8px;margin-bottom:6px}
  .btn-send{background:linear-gradient(135deg,#FBD77A,#F4B842);color:#123634;font-weight:900;padding:14px;border-radius:14px;border:none;width:100%;font-size:14px;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;box-shadow:0 6px 20px rgba(244,184,66,.4);transition:transform .15s}
  .btn-send:active{transform:scale(.97)}
  .btn-send:disabled{opacity:.5;cursor:not-allowed}
  .btn-serve{background:linear-gradient(135deg,#22d3ee,#06b6d4);color:#0a2b28;font-weight:900;padding:9px 14px;border-radius:11px;border:none;font-size:11px;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;transition:transform .15s}
  .btn-serve:active{transform:scale(.95)}
  .btn-serve:disabled{opacity:.4;cursor:not-allowed;background:#475569;color:#94a3b8}
  .toast{position:fixed;top:16px;right:16px;z-index:9999;padding:12px 18px;border-radius:14px;font-weight:800;font-size:13px;box-shadow:0 12px 40px rgba(0,0,0,.5);opacity:0;transform:translateY(-20px);transition:all .3s ease;pointer-events:none;max-width:calc(100vw - 32px)}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.success{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
  .toast.error{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}
  .toast.info{background:linear-gradient(135deg,var(--theme-accent,#FBD77A),var(--theme-accent2,#bfe9dc));color:#123634}
  .toast.warn{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
  .conn-dot{width:8px;height:8px;border-radius:50%}
  input,select,textarea{font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--theme-border,#FBD77A) !important;box-shadow:0 0 0 2px var(--theme-glow,rgba(244,184,66,.3))}
  .breadcrumb-link{color:var(--theme-accent2,#98dccb);cursor:pointer;transition:color .2s}
  .breadcrumb-link:hover{color:var(--theme-accent,#FBD77A)}
</style>
<script src="staff-sync.js" defer></script>
<script src="theme-system.js?v=7.2" defer></script>
<script src="dolphin-soundscape.js?v=2.0" defer></script>
<script src="drink-config.js?v=2.0" defer></script>
</head>
<body>

<div id="toast" class="toast"></div>

<!-- ═══════ HEADER ═══════ -->
<header class="sticky top-0 z-30 bg-teal-950/95 backdrop-blur-md border-b border-teal-800/50 px-3 py-2.5">
  <div class="max-w-4xl mx-auto flex items-center justify-between gap-2">
    <button onclick="goHome()" class="w-9 h-9 rounded-xl bg-teal-900/60 border border-teal-700/50 flex items-center justify-center text-teal-300 text-base active:scale-95">←</button>
    <div class="flex-1 text-center">
      <h1 class="brand-title text-base leading-none">DOLPHIN</h1>
      <p class="text-[9px] text-teal-400 uppercase font-bold tracking-widest mt-0.5">Order Đồ Uống</p>
    </div>
    <div class="flex items-center gap-1.5">
      <span id="cloud-dot" class="conn-dot bg-gold-500 animate-pulse"></span>
      <span id="cloud-txt" class="text-[9px] font-bold text-teal-200 uppercase">...</span>
    </div>
  </div>
</header>

<main class="max-w-4xl mx-auto px-3 py-3">

  <!-- Staff info bar -->
  <div class="glass-card px-4 py-3 mb-3 flex items-center justify-between gap-3">
    <div class="flex items-center gap-2.5">
      <span class="text-xl">🍹</span>
      <div>
        <div class="text-[9px] text-teal-400 font-bold uppercase tracking-widest">Nhân viên phục vụ</div>
        <div id="staffName" class="text-sm font-black text-gold-400">—</div>
      </div>
    </div>
    <button onclick="changeStaff()" class="bg-teal-800 border border-teal-600 text-white px-3 py-2 rounded-lg text-[10px] font-bold">Đổi tên</button>
  </div>

  <!-- Tabs -->
  <div class="flex gap-2 mb-3">
    <button class="tab-btn active" data-tab="create" onclick="switchTab('create')">➕ Tạo Order</button>
    <button class="tab-btn" data-tab="mine" onclick="switchTab('mine')">📋 Order của tôi</button>
  </div>

  <!-- ═══════ TAB: CREATE ═══════ -->
  <div id="panel-create">

    <!-- Pick table -->
    <div class="glass-card px-4 py-3 mb-3">
      <div class="text-[10px] font-black text-teal-300 uppercase tracking-widest mb-2">1. Chọn bàn</div>
      <div class="grid grid-cols-2 gap-2">
        <select id="groupSelect" onchange="onGroupChange()" class="bg-teal-950/80 border border-teal-600/50 rounded-xl px-3 py-2.5 text-sm text-white">
          <option value="">— Chọn khu vực —</option>
        </select>
        <select id="tableSelect" onchange="onTableChange()" class="bg-teal-950/80 border border-teal-600/50 rounded-xl px-3 py-2.5 text-sm text-white" disabled>
          <option value="">— Chọn bàn —</option>
        </select>
      </div>
      <div id="tableInfo" class="hidden mt-2 text-[11px] text-teal-300">
        Bàn đã chọn: <span id="selectedTableLabel" class="font-black text-gold-400"></span>
      </div>
    </div>

    <!-- Pick drinks — FOLDER NAVIGATION -->
    <div class="glass-card px-4 py-3 mb-3">
      <div class="flex items-center justify-between mb-2">
        <div class="text-[10px] font-black text-teal-300 uppercase tracking-widest">2. Chọn đồ uống</div>
        <button id="btnBackFolder" onclick="backToFolder()" class="hidden text-[10px] font-bold text-cyan-400 active:scale-95">← Quay lại</button>
      </div>

      <!-- Breadcrumb -->
      <div id="breadcrumb" class="hidden text-[10px] text-teal-400 mb-2 flex items-center gap-1.5 flex-wrap"></div>

      <!-- Search -->
      <input type="text" id="searchDrink" oninput="onSearchDrink(this.value)" placeholder="🔍 Tìm đồ uống..." class="w-full bg-teal-950/80 border border-teal-600/50 rounded-xl px-3 py-2.5 text-sm text-white mb-3">

      <!-- Folder grid (main cats + subcats) -->
      <div id="folderGrid" class="grid grid-cols-2 gap-2"></div>

      <!-- Drink list (inside folder) -->
      <div id="drinkList" class="hidden space-y-1.5 max-h-[60vh] overflow-y-auto pr-1"></div>

      <!-- Search results -->
      <div id="searchResults" class="hidden space-y-1.5 max-h-[60vh] overflow-y-auto pr-1"></div>
    </div>

    <!-- Cart -->
    <div class="glass-card px-4 py-3 mb-3">
      <div class="text-[10px] font-black text-teal-300 uppercase tracking-widest mb-2 flex justify-between">
        <span>3. Giỏ hàng</span>
        <span id="cartCount" class="text-gold-400">0 món</span>
      </div>
      <div id="cartList" class="space-y-2 max-h-64 overflow-y-auto pr-1">
        <div class="text-center text-teal-500 text-xs py-4">Chưa có món nào</div>
      </div>
      <textarea id="specialNotes" rows="2" placeholder="Ghi chú đặc biệt (nếu có)..." class="w-full bg-teal-950/80 border border-teal-600/50 rounded-xl px-3 py-2.5 text-sm text-white mt-3"></textarea>
      <div class="flex justify-between items-center mt-3 pt-3 border-t border-teal-700/50">
        <div>
          <div class="text-[9px] text-teal-400 font-bold uppercase tracking-widest">Tổng tiền</div>
          <div id="cartTotal" class="text-xl font-black text-gold-400">0đ</div>
        </div>
        <button id="btnSend" class="btn-send w-auto px-6" onclick="sendOrder()" disabled>GỬI ORDER</button>
      </div>
    </div>

  </div>

  <!-- ═══════ TAB: MY ORDERS ═══════ -->
  <div id="panel-mine" class="hidden">
    <div class="flex gap-2 mb-3 overflow-x-auto pb-1" id="myFilters"></div>
    <div id="myOrdersList" class="space-y-3"></div>
  </div>

</main>

<!-- Modal: Change staff name -->
<div id="modalStaff" class="fixed inset-0 z-[200] bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
  <div class="glass-card w-full max-w-sm p-6">
    <h3 class="font-black text-gold-400 text-lg uppercase mb-2">Nhập tên nhân viên</h3>
    <p class="text-teal-300 text-xs mb-4">Tên này sẽ được ghi vào order.</p>
    <input id="inputStaff" type="text" placeholder="VD: Giang..." class="w-full bg-teal-950/80 border border-teal-600/50 rounded-xl px-3 py-3 text-sm text-white mb-3">
    <div class="flex gap-2">
      <button onclick="closeStaffModal()" class="flex-1 bg-teal-900 border border-teal-700 text-teal-300 py-3 rounded-xl text-xs font-bold">Hủy</button>
      <button onclick="saveStaff()" class="flex-1 bg-gradient-to-r from-gold-400 to-gold-500 text-black py-3 rounded-xl text-xs font-black uppercase">Lưu</button>
    </div>
  </div>
</div>

<!-- Modal: Chọn Ly/Chai -->
<div id="modalUnit" class="fixed inset-0 z-[200] bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
  <div class="glass-card w-full max-w-sm p-6">
    <h3 class="font-black text-gold-400 text-lg uppercase mb-2 text-center">Chọn loại</h3>
    <p class="text-teal-200 text-sm mb-5 text-center font-bold" id="unitDrinkName">—</p>
    <div class="grid grid-cols-2 gap-3">
      <button id="btnPickGlass" onclick="pickUnit('glass')" class="bg-gradient-to-br from-cyan-500 to-blue-600 text-white p-4 rounded-xl font-black text-sm flex flex-col items-center gap-2 active:scale-95 shadow-lg">
        <span class="text-3xl">🥃</span>
        <span class="tracking-widest">LY</span>
        <span class="text-xs font-bold opacity-90" id="unitGlassPrice">—</span>
      </button>
      <button id="btnPickBottle" onclick="pickUnit('bottle')" class="bg-gradient-to-br from-amber-500 to-red-600 text-white p-4 rounded-xl font-black text-sm flex flex-col items-center gap-2 active:scale-95 shadow-lg">
        <span class="text-3xl">🍾</span>
        <span class="tracking-widest">CHAI</span>
        <span class="text-xs font-bold opacity-90" id="unitBottlePrice">—</span>
      </button>
    </div>
    <button onclick="closeUnitModal()" class="w-full mt-4 bg-teal-900 border border-teal-700 text-teal-300 py-3 rounded-xl text-xs font-bold">Hủy</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot, getDocs, query, where }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const CFG = window.DRINK_CONFIG;
const COL_ORDERS = 'drink_orders';

const state = {
  staffName: localStorage.getItem('dolphinStaffName') || '',
  selectedGroup: '',
  selectedTable: '',
  cart: {},
  menu: [],
  myOrders: [],
  filterStatus: 'all',
  db: null,
  /* Folder navigation */
  currentFolder: null,   /* { cat, sub } */
  viewMode: 'folders',   /* 'folders' | 'list' | 'search' */
  pendingDrinkId: null
};

/* ═══════ TOAST ═══════ */
window.showToast = function(msg, type){
  const t = document.getElementById('toast');
  t.className = 'toast ' + (type || 'info');
  t.textContent = msg;
  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 3000);
};

/* ═══════ FIREBASE ═══════ */
const fbConfig = {
  apiKey: "AIzaSyAtBNp9WBnyIkCiVjXfUpjH2d7-9dbg-JQ",
  authDomain: "dolphin-f6d67.firebaseapp.com",
  projectId: "dolphin-f6d67"
};

window.addEventListener('load', async () => {
  try {
    const app = initializeApp(fbConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    state.db = db;
    await signInAnonymously(auth);
    document.getElementById('cloud-dot').className = 'conn-dot bg-emerald-500';
    document.getElementById('cloud-txt').textContent = 'ONLINE';
    initRealtime();
  } catch(e){
    console.warn(e);
    document.getElementById('cloud-txt').textContent = 'OFFLINE';
  }
  initUI();
  renderStaffName();
  renderFolders();
  renderCart();
});

function initRealtime(){
  /* Listen my orders */
  if (!state.staffName){
    renderMyOrders();
    return;
  }
  const q = query(collection(state.db, COL_ORDERS), where('allStaffNames', 'array-contains', state.staffName));
  onSnapshot(q, snap => {
    const list = [];
    snap.forEach(d => list.push({ id: d.id, ...d.data() }));
    list.sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    state.myOrders = list;
    renderMyOrders();
  }, err => console.warn(err));
}

/* ═══════ INIT UI ═══════ */
function initUI(){
  /* Groups dropdown */
  const gSel = document.getElementById('groupSelect');
  CFG.TABLE_GROUPS.forEach(g => {
    const o = document.createElement('option');
    o.value = g.key;
    o.textContent = g.label;
    gSel.appendChild(o);
  });

  /* My filters */
  const fBar = document.getElementById('myFilters');
  const filters = [
    { k: 'all',       l: '📊 Tất cả' },
    { k: 'pending',   l: '⏳ Chờ' },
    { k: 'served',    l: '☑️ Đã PV' },
    { k: 'received',  l: '💰 Đã nhận' },
    { k: 'invoiced',  l: '✅ Hóa đơn' },
    { k: 'cancelled', l: '❌ Hủy' }
  ];
  fBar.innerHTML = filters.map(f => `<button class="filter-btn ${f.k==='all'?'active':''}" data-f="${f.k}" onclick="switchFilter('${f.k}')">${f.l}</button>`).join('');
}

/* ═══════ STAFF ═══════ */
window.renderStaffName = function(){
  const el = document.getElementById('staffName');
  if (state.staffName){
    el.textContent = state.staffName;
  } else {
    el.textContent = '⚠️ Chưa nhập tên';
    openStaffModal();
  }
};

window.changeStaff = () => openStaffModal();
window.openStaffModal = function(){
  document.getElementById('inputStaff').value = state.staffName || '';
  const m = document.getElementById('modalStaff');
  m.classList.remove('hidden');
  m.classList.add('flex');
  setTimeout(() => document.getElementById('inputStaff').focus(), 100);
};
window.closeStaffModal = function(){
  const m = document.getElementById('modalStaff');
  m.classList.add('hidden');
  m.classList.remove('flex');
};
window.saveStaff = function(){
  const name = document.getElementById('inputStaff').value.trim();
  if (!name){ showToast('Vui lòng nhập tên', 'error'); return; }
  state.staffName = name;
  localStorage.setItem('dolphinStaffName', name);
  renderStaffName();
  closeStaffModal();
  showToast('Xin chào ' + name + '!', 'success');
  if (state.db) initRealtime();
};

/* ═══════ TAB ═══════ */
window.switchTab = function(tab){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('panel-create').classList.toggle('hidden', tab !== 'create');
  document.getElementById('panel-mine').classList.toggle('hidden', tab !== 'mine');
};

/* ═══════ TABLE PICKER ═══════ */
window.onGroupChange = function(){
  const key = document.getElementById('groupSelect').value;
  const tSel = document.getElementById('tableSelect');
  state.selectedGroup = key;
  state.selectedTable = '';
  tSel.innerHTML = '<option value="">— Chọn bàn —</option>';
  document.getElementById('tableInfo').classList.add('hidden');
  if (!key){ tSel.disabled = true; return; }
  const g = CFG.TABLE_GROUPS.find(x => x.key === key);
  if (!g) return;
  g.tables.forEach(t => {
    const o = document.createElement('option');
    o.value = t;
    o.textContent = t;
    tSel.appendChild(o);
  });
  tSel.disabled = false;
};
window.onTableChange = function(){
  const t = document.getElementById('tableSelect').value;
  state.selectedTable = t;
  if (t){
    const g = CFG.getGroupByTable(t);
    document.getElementById('selectedTableLabel').textContent = t + ' · ' + (g ? g.label : '');
    document.getElementById('tableInfo').classList.remove('hidden');
  } else {
    document.getElementById('tableInfo').classList.add('hidden');
  }
  updateSendBtn();
};

/* ═══════════════════════════════════════════════════════
   FOLDER NAVIGATION
   ═══════════════════════════════════════════════════════ */

/* ───── Render: MAIN FOLDERS (5 folder chính) ───── */
window.renderFolders = function(){
  const grid = document.getElementById('folderGrid');
  if (!grid) return;
  grid.classList.remove('hidden');
  document.getElementById('drinkList').classList.add('hidden');
  document.getElementById('searchResults').classList.add('hidden');
  document.getElementById('breadcrumb').classList.add('hidden');
  document.getElementById('btnBackFolder').classList.add('hidden');
  document.getElementById('searchDrink').value = '';
  state.currentFolder = null;
  state.viewMode = 'folders';

  grid.innerHTML = CFG.CATEGORIES.map(cat => {
    const count = CFG.MENU.filter(d => d.cat === cat.id).length;
    const subCount = (CFG.SUBCATS[cat.id] || []).length;
    return `
      <button onclick="enterCategory('${cat.id}')" class="drink-card text-left flex flex-col gap-2">
        <div class="flex items-center justify-between w-full">
          <span class="text-3xl">${cat.icon}</span>
          <span class="text-[10px] font-black text-gold-400 bg-gold-500/15 px-2 py-0.5 rounded-full">${count}</span>
        </div>
        <div class="text-sm font-black text-white leading-tight">${cat.label.replace(/^[^\s]+\s/, '')}</div>
        <div class="text-[10px] text-teal-400">${subCount} danh mục con</div>
      </button>
    `;
  }).join('');
};

/* ───── Enter 1 main category ───── */
window.enterCategory = function(catId){
  const cat = CFG.CATEGORIES.find(c => c.id === catId);
  if (!cat) return;
  const subs = CFG.SUBCATS[catId] || [];

  /* Nếu chỉ có 1 subcategory → vào thẳng list */
  if (subs.length <= 1){
    enterSubCategory(catId, subs[0] || 'Beer');
    return;
  }

  const grid = document.getElementById('folderGrid');
  grid.classList.remove('hidden');
  document.getElementById('drinkList').classList.add('hidden');
  document.getElementById('searchResults').classList.add('hidden');
  document.getElementById('searchDrink').value = '';

  grid.innerHTML = subs.map(sub => {
    const count = CFG.MENU.filter(d => d.cat === catId && d.sub === sub).length;
    return `
      <button onclick="enterSubCategory('${catId}', '${sub.replace(/'/g, "\\'")}')" class="drink-card text-left flex flex-col gap-1.5">
        <div class="flex items-center justify-between w-full">
          <span class="text-lg">📂</span>
          <span class="text-[10px] font-black text-gold-400 bg-gold-500/15 px-2 py-0.5 rounded-full">${count}</span>
        </div>
        <div class="text-xs font-black text-white leading-tight">${sub}</div>
      </button>
    `;
  }).join('');

  const bc = document.getElementById('breadcrumb');
  bc.classList.remove('hidden');
  bc.innerHTML = `<span class="breadcrumb-link" onclick="renderFolders()">🏠 Trang chủ</span><span>›</span><span class="font-black text-gold-400">${cat.icon} ${cat.label.replace(/^[^\s]+\s/, '')}</span>`;

  document.getElementById('btnBackFolder').classList.remove('hidden');
  state.currentFolder = { cat: catId, sub: null };
  state.viewMode = 'folders';
};

/* ───── Enter subcategory → list món ───── */
window.enterSubCategory = function(catId, sub){
  const cat = CFG.CATEGORIES.find(c => c.id === catId);
  const list = CFG.MENU.filter(d => d.cat === catId && d.sub === sub);

  const dl = document.getElementById('drinkList');
  document.getElementById('folderGrid').classList.add('hidden');
  document.getElementById('searchResults').classList.add('hidden');
  document.getElementById('searchDrink').value = '';
  dl.classList.remove('hidden');

  if (list.length === 0){
    dl.innerHTML = '<div class="text-center text-teal-500 text-xs py-6">Chưa có món nào</div>';
  } else {
    dl.innerHTML = list.map(d => renderDrinkRow(d)).join('');
  }

  const bc = document.getElementById('breadcrumb');
  bc.classList.remove('hidden');
  bc.innerHTML =
    `<span class="breadcrumb-link" onclick="renderFolders()">🏠 Trang chủ</span>` +
    `<span>›</span>` +
    `<span class="breadcrumb-link" onclick="enterCategory('${catId}')">${cat.icon} ${cat.label.replace(/^[^\s]+\s/, '')}</span>` +
    `<span>›</span>` +
    `<span class="font-black text-gold-400">${sub}</span>`;

  document.getElementById('btnBackFolder').classList.remove('hidden');
  state.currentFolder = { cat: catId, sub: sub };
  state.viewMode = 'list';
};

/* ───── Nút "Quay lại" ───── */
window.backToFolder = function(){
  if (state.viewMode === 'search'){
    renderFolders();
    return;
  }
  if (state.viewMode === 'list' && state.currentFolder){
    if (state.currentFolder.sub){
      enterCategory(state.currentFolder.cat);
    } else {
      renderFolders();
    }
  } else {
    renderFolders();
  }
};

/* ═══════════════════════════════════════════════════════
   DRINK ROW
   ═══════════════════════════════════════════════════════ */
function renderDrinkRow(d){
  const hasGlass = !!d.pg;
  const hasBottle = !!d.pb;
  const qtyGlass = state.cart[d.id + '_g'] || 0;
  const qtyBottle = state.cart[d.id + '_b'] || 0;
  const totalQty = qtyGlass + qtyBottle;
  const isSelected = totalQty > 0;

  let priceDisplay = '';
  if (hasGlass && hasBottle){
    priceDisplay = `
      <div class="flex gap-2 flex-wrap">
        <span class="text-[10px] text-cyan-400 font-bold">Ly: <span class="text-gold-400 font-black">${formatMoney(d.pg)}</span></span>
        <span class="text-[10px] text-amber-400 font-bold">Chai: <span class="text-gold-400 font-black">${formatMoney(d.pb)}</span></span>
      </div>`;
  } else if (hasGlass){
    priceDisplay = `<span class="text-gold-400 font-black text-sm">${formatMoney(d.pg)}</span> <span class="text-[10px] text-teal-500">/ly</span>`;
  } else {
    priceDisplay = `<span class="text-gold-400 font-black text-sm">${formatMoney(d.pb)}</span> <span class="text-[10px] text-teal-500">/chai</span>`;
  }

  return `
    <div class="drink-card ${isSelected ? 'selected' : ''} flex items-start gap-3" onclick="pickDrink('${d.id}')">
      <div class="flex-1 min-w-0">
        <div class="text-[13px] font-black text-white leading-snug mb-1">${d.name}</div>
        ${d.desc ? `<div class="text-[10px] text-teal-500 italic leading-tight mb-2">${d.desc}</div>` : ''}
        ${priceDisplay}
      </div>
      ${totalQty > 0 ? `<div class="flex-shrink-0 flex flex-col items-end gap-1">
        ${qtyGlass > 0 ? `<span class="text-[9px] bg-cyan-500 text-white font-black px-2 py-0.5 rounded-full">Ly ×${qtyGlass}</span>` : ''}
        ${qtyBottle > 0 ? `<span class="text-[9px] bg-amber-500 text-white font-black px-2 py-0.5 rounded-full">Chai ×${qtyBottle}</span>` : ''}
      </div>` : ''}
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════
   SEARCH
   ═══════════════════════════════════════════════════════ */
window.onSearchDrink = function(q){
  q = (q || '').toLowerCase().trim();
  const folderGrid = document.getElementById('folderGrid');
  const drinkList = document.getElementById('drinkList');
  const searchResults = document.getElementById('searchResults');
  const bc = document.getElementById('breadcrumb');
  const btnBack = document.getElementById('btnBackFolder');

  if (!q){
    searchResults.classList.add('hidden');
    if (state.viewMode === 'list' && state.currentFolder){
      drinkList.classList.remove('hidden');
      folderGrid.classList.add('hidden');
    } else {
      folderGrid.classList.remove('hidden');
      drinkList.classList.add('hidden');
    }
    return;
  }

  folderGrid.classList.add('hidden');
  drinkList.classList.add('hidden');
  searchResults.classList.remove('hidden');
  bc.classList.remove('hidden');
  bc.innerHTML = `<span class="breadcrumb-link" onclick="renderFolders()">🏠 Trang chủ</span><span>›</span><span class="font-black text-gold-400">🔍 "${q}"</span>`;
  btnBack.classList.remove('hidden');

  const results = CFG.MENU.filter(d =>
    d.name.toLowerCase().includes(q) ||
    (d.desc || '').toLowerCase().includes(q) ||
    d.sub.toLowerCase().includes(q)
  );

  if (results.length === 0){
    searchResults.innerHTML = '<div class="text-center text-teal-500 text-xs py-6">Không tìm thấy món nào</div>';
  } else {
    searchResults.innerHTML = results.slice(0, 80).map(d => renderDrinkRow(d)).join('');
  }
  state.viewMode = 'search';
};

/* ═══════════════════════════════════════════════════════
   PICK DRINK — Popup Ly/Chai hoặc thêm thẳng
   ═══════════════════════════════════════════════════════ */
window.pickDrink = function(id){
  const d = CFG.MENU.find(x => x.id === id);
  if (!d) return;
  const hasGlass = !!d.pg;
  const hasBottle = !!d.pb;

  if (hasGlass && hasBottle){
    state.pendingDrinkId = id;
    document.getElementById('unitDrinkName').textContent = d.name;
    document.getElementById('unitGlassPrice').textContent = formatMoney(d.pg);
    document.getElementById('unitBottlePrice').textContent = formatMoney(d.pb);
    const m = document.getElementById('modalUnit');
    m.classList.remove('hidden');
    m.classList.add('flex');
  } else if (hasGlass){
    addToCart(id + '_g');
  } else if (hasBottle){
    addToCart(id + '_b');
  }
};

window.closeUnitModal = function(){
  const m = document.getElementById('modalUnit');
  m.classList.add('hidden');
  m.classList.remove('flex');
  state.pendingDrinkId = null;
};

window.pickUnit = function(unit){
  const id = state.pendingDrinkId;
  if (!id) return;
  addToCart(id + (unit === 'glass' ? '_g' : '_b'));
  closeUnitModal();
};

/* ═══════════════════════════════════════════════════════
   REFRESH VIEW
   ═══════════════════════════════════════════════════════ */
window.refreshCurrentView = function(){
  if (state.viewMode === 'search'){
    const q = document.getElementById('searchDrink').value;
    onSearchDrink(q);
  } else if (state.viewMode === 'list' && state.currentFolder){
    enterSubCategory(state.currentFolder.cat, state.currentFolder.sub);
  } else if (state.currentFolder && !state.currentFolder.sub){
    enterCategory(state.currentFolder.cat);
  } else {
    renderFolders();
  }
};

/* ═══════════════════════════════════════════════════════
   CART
   ═══════════════════════════════════════════════════════ */
window.addToCart = function(key){
  state.cart[key] = (state.cart[key] || 0) + 1;
  refreshCurrentView();
  renderCart();
};
window.removeFromCart = function(key){
  if (state.cart[key] > 1) state.cart[key]--;
  else delete state.cart[key];
  refreshCurrentView();
  renderCart();
};
window.deleteFromCart = function(key){
  delete state.cart[key];
  refreshCurrentView();
  renderCart();
};

window.renderCart = function(){
  const list = document.getElementById('cartList');
  const entries = Object.entries(state.cart);
  const count = entries.reduce((s, [_, q]) => s + q, 0);
  document.getElementById('cartCount').textContent = count + ' món';
  if (entries.length === 0){
    list.innerHTML = '<div class="text-center text-teal-500 text-xs py-4">Chưa có món nào</div>';
    document.getElementById('cartTotal').textContent = '0đ';
    updateSendBtn();
    return;
  }
  let total = 0;
  list.innerHTML = entries.map(([key, qty]) => {
    const parts = key.split('_');
    const id = parts[0];
    const unit = parts[1] || 'g';
    const d = CFG.MENU.find(x => x.id === id);
    if (!d) return '';
    const price = unit === 'b' ? d.pb : d.pg;
    const unitLabel = unit === 'b' ? 'Chai' : 'Ly';
    const unitColor = unit === 'b' ? 'text-amber-400' : 'text-cyan-400';
    total += (price || 0) * qty;
    return `
      <div class="flex items-center gap-2 bg-teal-900/50 p-2 rounded-lg border border-teal-700/50">
        <div class="flex-1 min-w-0">
          <div class="text-xs font-bold text-white truncate">${d.name} <span class="${unitColor}">[${unitLabel}]</span></div>
          <div class="text-[10px] text-gold-400 font-black">${formatMoney(price || 0)} × ${qty} = ${formatMoney((price || 0) * qty)}</div>
        </div>
        <div class="flex items-center gap-1">
          <button onclick="removeFromCart('${key}')" class="w-7 h-7 rounded-lg bg-teal-800 text-teal-300 font-black text-sm active:scale-90">−</button>
          <span class="text-white font-black text-sm w-6 text-center">${qty}</span>
          <button onclick="addToCart('${key}')" class="w-7 h-7 rounded-lg bg-teal-800 text-gold-400 font-black text-sm active:scale-90">+</button>
          <button onclick="deleteFromCart('${key}')" class="w-7 h-7 rounded-lg bg-red-900/60 text-red-300 font-black text-sm active:scale-90 ml-1">✕</button>
        </div>
      </div>
    `;
  }).join('');
  document.getElementById('cartTotal').textContent = formatMoney(total);
  updateSendBtn();
};

function updateSendBtn(){
  const btn = document.getElementById('btnSend');
  const count = Object.values(state.cart).reduce((s, q) => s + q, 0);
  btn.disabled = !(count > 0 && state.selectedTable && state.staffName);
}

/* ═══════ SEND ORDER ═══════ */
window.sendOrder = async function(){
  if (!state.db){ showToast('Chưa kết nối', 'error'); return; }
  if (!state.staffName){ showToast('Chưa nhập tên', 'error'); return; }
  if (!state.selectedTable){ showToast('Chưa chọn bàn', 'error'); return; }

  const items = Object.entries(state.cart).map(([key, qty]) => {
    const parts = key.split('_');
    const id = parts[0];
    const unit = parts[1] || 'g';
    const d = CFG.MENU.find(x => x.id === id);
    if (!d) return null;
    const price = unit === 'b' ? d.pb : d.pg;
    const unitLabel = unit === 'b' ? 'Chai' : 'Ly';
    return {
      id: key,
      drinkId: id,
      name: d.name,
      displayName: d.name + ' [' + unitLabel + ']',
      price: price,
      qty: qty,
      unit: unitLabel,
      sub: d.sub
    };
  }).filter(Boolean);
  if (items.length === 0){ showToast('Giỏ hàng trống', 'warn'); return; }

  const notes = document.getElementById('specialNotes').value.trim();
  const now = Date.now();
  const timeStr = formatTimeVN(now);
  const group = CFG.getGroupByTable(state.selectedTable);
  const areaKey = group ? group.area : 'other';

  try {
    const existing = state.myOrders.find(o =>
      o.table === state.selectedTable &&
      (o.status === 'pending' || o.status === 'served' || o.status === 'received')
    ) || await findExistingOrder(state.selectedTable);

    if (existing){
      const newLog = {
        num: (existing.orderLog || []).length + 1,
        items: items,
        specialNotes: notes,
        timestamp: now,
        timeString: timeStr,
        staffName: state.staffName
      };
      const mergedItems = mergeItems(existing.items || [], items);
      const allStaff = Array.from(new Set([...(existing.allStaffNames || []), state.staffName]));
      const total = mergedItems.reduce((s, i) => s + i.price * i.qty, 0);

      await updateDoc(doc(state.db, COL_ORDERS, existing.id), {
        items: mergedItems,
        orderLog: [...(existing.orderLog || []), newLog],
        allStaffNames: allStaff,
        specialNotes: notes || existing.specialNotes || '',
        totalAmount: total,
        updatedAt: now,
        updatedTimeString: timeStr
      });
      showToast('Đã cộng thêm vào order bàn ' + state.selectedTable, 'success');
    } else {
      const total = items.reduce((s, i) => s + i.price * i.qty, 0);
      await addDoc(collection(state.db, COL_ORDERS), {
        table: state.selectedTable,
        tableArea: areaKey,
        staffName: state.staffName,
        allStaffNames: [state.staffName],
        items: items,
        orderLog: [{
          num: 1,
          items: items,
          specialNotes: notes,
          timestamp: now,
          timeString: timeStr,
          staffName: state.staffName
        }],
        specialNotes: notes,
        status: 'pending',
        totalAmount: total,
        createdAt: now,
        createdTimeString: timeStr,
        updatedAt: now,
        updatedTimeString: timeStr,
        servedAt: 0, servedBy: '',
        receivedAt: 0, receivedBy: '',
        invoicedAt: 0, invoicedBy: '',
        cancelledAt: 0, cancelledBy: '',
        cancelReason: ''
      });
      showToast('Đã gửi order bàn ' + state.selectedTable, 'success');
    }

    state.cart = {};
    document.getElementById('specialNotes').value = '';
    renderFolders();
    renderCart();
    switchTab('mine');
  } catch(e){
    console.error(e);
    showToast('Lỗi: ' + (e.message || ''), 'error');
  }
};

async function findExistingOrder(table){
  try {
    const q = query(
      collection(state.db, COL_ORDERS),
      where('table', '==', table),
      where('status', 'in', ['pending', 'served', 'received'])
    );
    const snap = await getDocs(q);
    if (snap.empty) return null;
    const d = snap.docs[0];
    return { id: d.id, ...d.data() };
  } catch(e){
    return null;
  }
}

function mergeItems(oldItems, newItems){
  const map = {};
  oldItems.forEach(i => { map[i.id] = { ...i }; });
  newItems.forEach(i => {
    if (map[i.id]){
      map[i.id].qty += i.qty;
    } else {
      map[i.id] = { ...i };
    }
  });
  return Object.values(map);
}

/* ═══════ MY ORDERS ═══════ */
window.switchFilter = function(f){
  state.filterStatus = f;
  document.querySelectorAll('#myFilters .filter-btn').forEach(b => b.classList.toggle('active', b.dataset.f === f));
  renderMyOrders();
};

window.renderMyOrders = function(){
  const list = document.getElementById('myOrdersList');
  if (!list) return;
  const filtered = state.filterStatus === 'all'
    ? state.myOrders
    : state.myOrders.filter(o => o.status === state.filterStatus);

  if (filtered.length === 0){
    list.innerHTML = '<div class="glass-card p-8 text-center text-teal-500 text-sm">Chưa có order nào</div>';
    return;
  }
  list.innerHTML = filtered.map(o => renderOrderCard(o)).join('');
};

function renderOrderCard(o){
  const s = CFG.STATUS[o.status] || CFG.STATUS.pending;
  const canServe = o.status === 'pending';
  const logs = o.orderLog || [];
  return `
    <div class="glass-card p-4">
      <div class="flex justify-between items-start gap-2 mb-2">
        <div>
          <div class="text-lg font-black text-gold-400">BÀN ${o.table}</div>
          <div class="text-[10px] text-teal-400">${o.tableArea || ''}</div>
        </div>
        <div class="text-right">
          <div class="status-chip ${s.color} ${s.bg} ${s.border}">
            <span class="w-1.5 h-1.5 rounded-full bg-current"></span>${s.label}
          </div>
          <div class="text-[10px] text-teal-400 mt-1">Cập nhật: ${o.updatedTimeString || o.createdTimeString || '--'}</div>
        </div>
      </div>

      <div class="text-[11px] text-teal-300 mb-2">
        NV: <span class="font-black text-white">${(o.allStaffNames || [o.staffName]).join(', ')}</span>
      </div>

      <div class="space-y-2 mb-3">
        ${logs.map(log => `
          <div class="order-log-item">
            <div class="flex justify-between items-center mb-1">
              <span class="text-[10px] font-black text-gold-400 uppercase">Đơn ${log.num} · ${log.timeString}</span>
              <span class="text-[9px] text-teal-400">${log.staffName}</span>
            </div>
            <div class="space-y-0.5">
              ${(log.items || []).map(i => `
                <div class="flex justify-between text-xs">
                  <span class="text-white">${i.displayName || i.name}</span>
                  <span class="text-gold-400 font-black">×${i.qty}</span>
                </div>
              `).join('')}
            </div>
            ${log.specialNotes ? `<div class="text-[10px] italic text-amber-300 mt-1">📝 ${log.specialNotes}</div>` : ''}
          </div>
        `).join('')}
      </div>

      <div class="flex justify-between items-center pt-2 border-t border-teal-700/50">
        <div>
          <div class="text-[9px] text-teal-400 uppercase font-bold tracking-widest">Tổng</div>
          <div class="text-lg font-black text-gold-400">${formatMoney(o.totalAmount || 0)}</div>
        </div>
        ${canServe ? `<button class="btn-serve" onclick="markServed('${o.id}')">☑️ Đã phục vụ</button>` : ''}
      </div>
    </div>
  `;
}

window.markServed = async function(orderId){
  if (!state.db) return;
  try {
    await updateDoc(doc(state.db, COL_ORDERS, orderId), {
      status: 'served',
      servedAt: Date.now(),
      servedBy: state.staffName,
      updatedAt: Date.now(),
      updatedTimeString: formatTimeVN(Date.now())
    });
    showToast('Đã đánh dấu phục vụ', 'success');
  } catch(e){
    showToast('Lỗi: ' + e.message, 'error');
  }
};

/* ═══════ HELPERS ═══════ */
function formatMoney(n){
  return (n || 0).toLocaleString('vi-VN') + 'đ';
}
function formatTimeVN(ts){
  const d = new Date(ts);
  return new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Asia/Ho_Chi_Minh',
    hour: '2-digit', minute: '2-digit', hour12: false
  }).format(d);
}

window.goHome = function(){
  window.location.href = '/DolphinApp/';
};
</script>
