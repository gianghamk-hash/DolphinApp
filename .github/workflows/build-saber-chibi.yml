name: Build Saber Chibi GLB in Blender
on:
  pull_request:
    paths:
      - "giaitri/games/tactics-online/assets/models/production/saber/**"
      - ".github/workflows/build-saber-chibi.yml"
  push:
    branches: [main]
    paths:
      - "giaitri/games/tactics-online/assets/models/production/saber/build_saber.py"
      - ".github/workflows/build-saber-chibi.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-saber:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender with bounded apt retries
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # Avoid hanging on dpkg locks or network stalls.
          sudo DEBIAN_FRONTEND=noninteractive timeout 240 apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=20
          sudo DEBIAN_FRONTEND=noninteractive timeout 1000 apt-get install -y --no-install-recommends blender python3-numpy -o DPkg::Lock::Timeout=45 -o Acquire::Retries=2 -o Acquire::http::Timeout=20
          blender --version | head -n 2
      - name: Build original Saber 3D mesh, skinned armature, animations
        run: |
          mkdir -p generated-saber
          blender -b -t 2 --python-exit-code 1 --python giaitri/games/tactics-online/assets/models/production/saber/build_saber.py -- "$PWD/generated-saber/h01.glb"
          test -s generated-saber/h01.glb
      - name: Validate GLB animation, skeleton and mesh
        run: |
          python -m pip install pygltflib --break-system-packages -q
          python giaitri/games/tactics-online/assets/models/production/saber/validate_saber_glb.py generated-saber/h01.glb
          test "$(stat -c %s generated-saber/h01.glb)" -gt 15000
      - name: Activate validated Saber model on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p giaitri/games/tactics-online/assets/models/heroes/chibi
          cp generated-saber/h01.glb giaitri/games/tactics-online/assets/models/heroes/chibi/h01.glb
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('giaitri/games/tactics-online/assets/models/manifest.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          m['heroes']['H01'].update(file='heroes/chibi/h01.glb',quality='stylized-chibi',targetHeight=1.02,scale=1)
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add giaitri/games/tactics-online/assets/models/heroes/chibi/h01.glb giaitri/games/tactics-online/assets/models/manifest.json
          if git diff --cached --quiet; then
            echo 'No asset changes to commit'
          else
            git commit -m 'assets(tactics): activate validated original Saber Chibi GLB'
            # main may advance during the Blender job (e.g. version-bump automation).
            # Rebase our generated asset commit, preserving unrelated remote changes.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo 'Could not safely rebase Saber assets. No force push attempted.'
                exit 1
              fi
              if git push origin HEAD:main; then
                echo 'Saber model published successfully'
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo 'Remote main advanced repeatedly; aborting without force push'
                exit 1
              fi
              sleep 3
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saber-chibi-glb-test
          path: generated-saber/h01.glb
          retention-days: 14
