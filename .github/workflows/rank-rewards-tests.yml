name: Rank Rewards Tests
on:
  pull_request:
    paths:
      - 'rank-rewards.js'
      - 'rank-rewards.test.js'
      - '.github/workflows/rank-rewards-tests.yml'
  push:
    branches: [main]
    paths:
      - 'rank-rewards.js'
      - 'rank-rewards.test.js'
      - '.github/workflows/rank-rewards-tests.yml'
permissions:
  contents: read
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test rank-rewards.test.js
