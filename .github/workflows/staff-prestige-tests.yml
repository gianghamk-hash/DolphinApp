name: Staff Prestige and Reconciliation
on:
  pull_request:
    paths:
      - 'functions/staff-prestige.js'
      - 'functions/staff-daily-core.cjs'
      - 'functions/staff-daily-missions.js'
      - 'functions/staff-daily-core.test.cjs'
      - 'functions/staff-daily-missions.test.cjs'
      - 'functions/staff-daily-arcade.test.cjs'
      - 'crew-arcade-proof.js'
      - 'functions/crew-arcade-proof.cjs'
      - 'scripts/verify-firebase-source-boundary.cjs'
      - 'crew-arcade-missions.js'
      - 'scripts/crew-arcade-missions.test.cjs'
      - 'giaitri/games/snake.html'
      - 'giaitri/games/game2048.html'
      - 'functions/staff-xp-reconcile.js'
      - 'functions/staff-xp-reconcile.test.cjs'
      - 'functions/staff-prestige.test.cjs'
      - 'functions/staff-xp-engine.cjs'
      - 'functions/staff-xp-engine.test.cjs'
      - 'functions/staff-xp-rank-sync.js'
      - 'functions/staff-xp-rank-sync.test.cjs'
      - 'functions/staff-xp-actions.js'
      - 'functions/staff-xp-actions.test.cjs'
      - 'functions/staff-xp-live.js'
      - 'functions/staff-xp-live-engine.cjs'
      - 'functions/staff-xp-live-engine.test.cjs'
      - 'functions/staff-xp-actions.test.cjs'
      - 'staff-prestige-client.js'
      - 'scripts/staff-levelup.test.cjs'
      - 'staff-prestige-profile.js'
      - 'crew-character-card.js'
      - 'crew-levelup-cinematic.js'
      - 'crew-levelup-cinematic.css'
      - 'scripts/crew-levelup-browser.cjs'
      - 'crew-character-card.css'
      - 'scripts/crew-character-card.test.cjs'
      - 'dolphin-profile.html'
      - 'scripts/staff-prestige-client.test.cjs'
      - 'staff-xp-manager.js'
      - 'theme-system.js'
      - '.github/workflows/staff-prestige-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax checks
        run: |
          node --check functions/staff-prestige.js
          node --check functions/staff-daily-missions.js
          node --check functions/staff-daily-core.cjs
          node --check crew-arcade-proof.js
          node --check functions/crew-arcade-proof.cjs
          node scripts/verify-firebase-source-boundary.cjs
          node --check crew-arcade-missions.js
          node --check functions/staff-xp-reconcile.js
          node --check functions/staff-xp-engine.cjs
          node --check functions/staff-xp-rank-sync.js
          node --check functions/staff-xp-actions.js
          node --check functions/staff-xp-live.js
          node --check functions/staff-xp-live-engine.cjs
          node --check staff-prestige-client.js
          node --check staff-prestige-profile.js
          node --check crew-character-card.js
          node --check crew-levelup-cinematic.js
          node --check staff-xp-manager.js
          node --check theme-system.js
      - name: Staff XP and archival reconciliation tests
        run: node --test scripts/staff-levelup.test.cjs functions/staff-daily-core.test.cjs functions/staff-daily-missions.test.cjs functions/staff-daily-arcade.test.cjs scripts/crew-arcade-missions.test.cjs functions/staff-xp-actions.test.cjs functions/staff-xp-rank-sync.test.cjs scripts/staff-prestige-client.test.cjs functions/staff-xp-engine.test.cjs functions/staff-xp-reconcile.test.cjs functions/staff-prestige.test.cjs functions/staff-xp-live-engine.test.cjs scripts/crew-character-card.test.cjs
